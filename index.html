    <style>
      *, *:after, *:before {

        border: 0 solid;

      }
      :root {

      const autoFormatLogText = raw => {
        if (!raw || typeof raw !== "string") return "";
        const lines = raw.replace(/\r\n?/g, "\n").split("\n");
        const formatted = [];
        let blankStreak = 0;

        for (let line of lines) {

            if (formatted.length > 0 && blankStreak === 0) {

              blankStreak++;

            continue;

          blankStreak = 0;

          const bulletMatch = trimmed.match(/^(?:[-+•]|\*(?!\*))\s*(.+)$/);
          if (bulletMatch) {
            let body = bulletMatch[1].trim().replace(/[ \t]+/g, " ");

            trimmed = `• ${body}`;
          } else {

            trimmed = trimmed.replace(/^(\*\*)?([a-z])/, (_, b, ch) => (b || "") + ch.toUpperCase());
          }

          // Tidy spacing around punctuation without altering any words
          trimmed = trimmed

        if (dur <= 0 || !job.date) return null;
        const parts = job.date.split("-").map(Number);
        if (parts.length !== 3) return null;
        const exp = new Date(parts[0], parts[1] - 1, parts[2]);
        if (unit === "Days") exp.setDate(exp.getDate() + dur);
        else if (unit === "Weeks") exp.setDate(exp.getDate() + dur * 7);
        else if (unit === "Months") exp.setMonth(exp.getMonth() + dur);

        const now = new Date();

        const days = Math.round((exp.getTime() - now.getTime()) / 864e5);

            return true;
          } catch {}

        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);

        const canvasRef = useRef(null);

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;
          const ctx = canvas.getContext("2d", { alpha: true });
          if (!ctx) return;

          let w = (canvas.width = window.innerWidth);
          let h = (canvas.height = window.innerHeight);
          const onResize = () => {
            if (!canvas) return;
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
          };
          window.addEventListener("resize", onResize);

          let t = 0;
          let raf = 0;
          const colors = [[0, 255, 136], [163, 230, 53], [34, 211, 238], [16, 185, 129]];
          const waves = [
            { cIdx1: 0, cIdx2: 1, alpha: .28, speed: .0035, freq: 9e-4, amp: 160, yOffset: .22 },
            { cIdx1: 1, cIdx2: 2, alpha: .2, speed: .0025, freq: 7e-4, amp: 200, yOffset: .38 },
            { cIdx1: 2, cIdx2: 0, alpha: .16, speed: .0042, freq: .0011, amp: 130, yOffset: .15 }
          ];
          const orbs = Array.from({ length: 14 }, (_, idx) => ({
            x: Math.random(),
            y: Math.random() * .7,
            r: Math.random() * 24 + 10,
            vx: (Math.random() - .5) * 2e-4,
            vy: (Math.random() - .5) * 15e-5,
            phase: Math.random() * Math.PI * 2,
            cIdx: idx % 4
          }));

          const lerp = (cur, target, step) => {
            for (let i = 0; i < 4; i++) {
              for (let j = 0; j < 3; j++) cur[i][j] += (target[i][j] - cur[i][j]) * step;
            }
          };
          const rgba = (rgb, a) => `rgba(${Math.round(rgb[0])}, ${Math.round(rgb[1])}, ${Math.round(rgb[2])}, ${a})`;

          const render = () => {
            if (document.body.classList.contains("no-fx")) { raf = requestAnimationFrame(render); return; }
            const palette = ACCENT_THEMES[accentRef.current in ACCENT_THEMES ? accentRef.current : "neon"].aurora;
            lerp(colors, palette, .05);
            ctx.clearRect(0, 0, w, h);
            ctx.globalCompositeOperation = "screen";
            t += 1;

            waves.forEach((wv, i) => {
              const c1 = colors[wv.cIdx1];
              const c2 = colors[wv.cIdx2];
              const base = h * wv.yOffset;
              ctx.beginPath();
              ctx.moveTo(0, h);
              ctx.lineTo(0, base);
              for (let x = 0; x <= w; x += 28) {
                const y = base + (Math.sin(x * wv.freq + t * wv.speed + i) + Math.sin(x * wv.freq * 1.8 - t * wv.speed * 1.2 + i * 2) * .35) * wv.amp;
                ctx.lineTo(x, y);
              }
              ctx.lineTo(w, h);
              ctx.closePath();
              const grad = ctx.createLinearGradient(0, base - wv.amp * 1.5, w * .6, base + wv.amp * 4);
              grad.addColorStop(0, rgba(c1, 0));
              grad.addColorStop(.3, rgba(c1, wv.alpha));
              grad.addColorStop(.7, rgba(c2, wv.alpha * .5));
              grad.addColorStop(1, rgba(c2, 0));
              ctx.fillStyle = grad;
              ctx.fill();
            });

              orb.x = (orb.x + orb.vx + 1) % 1;
              orb.y = (orb.y + orb.vy + .7) % .7;
              const cx = orb.x * w;
              const cy = orb.y * h;
              const a = (Math.sin(t * .02 + orb.phase) * .5 + .5) * .15;
              const c = colors[orb.cIdx];
              const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, orb.r * 3);

              grad.addColorStop(1, rgba(c, 0));
              ctx.fillStyle = grad;
              ctx.beginPath();
              ctx.arc(cx, cy, orb.r * 3, 0, Math.PI * 2);
              ctx.fill();
            });

            raf = requestAnimationFrame(render);
          };

          raf = requestAnimationFrame(render);
          return () => {
            cancelAnimationFrame(raf);
            window.removeEventListener("resize", onResize);
          };

        dash: "Log Repair",
        tax: "Export HMRC CSV",
        stock: "Add Part / Device",
        exp: "Add Expense",
        diary: "Add Entry",
        tests: "Add Test",
        diag: "Save QA Log",
        ai: "New Chat"
      };

      // Top Header Component
      const Header = ({ state, tab, searchQuery, cloudStatus, manualSaveFeedback, onSelectTab, onSearchChange, onManualSave, onLock, onOpenSettings, onPrimaryAction }) => (
        <header>
          <div className="brand">
            <span className="logo"><BrandLogo /></span>
            <div className="brand-info">
              <div className="brand-top">
                <span>SECOND LIFE</span>
                <span className="uk-pill">UK</span>
                <span id="cloud-status" className="cnt" style={{ marginLeft: 2, fontSize: 9 }}>{cloudStatus}</span>
              </div>
              <div className="brand-sub">Doncaster, UK | TMR Mods &amp; Repairs</div>
            </div>
          </div>
          <nav id="nav">
            {NAV_TABS.map(item => {
              const cnt = item.count ? item.count(state) : null;
              return (
                <button
                  key={item.key}
                  type="button"
                  className={`b${item.key === tab ? " on" : ""}`}
                  onClick={() => onSelectTab(item.key)}
                >
                  <Icon name={item.icon} size={14} />
                  {item.label}
                  {cnt !== null && <span className="cnt">{cnt}</span>}
                </button>
              );
            })}
          </nav>
          <div className="srch">
            <span><Icon name="search" size={16} /></span>
            <input
              id="q"
              placeholder="Quick Search (#id, seller, order)…"
              value={searchQuery}
              onChange={e => onSearchChange(e.target.value)}
            />
          </div>
          <div className="hact">
            <button type="button" className="b" title="Save all data to Firebase Cloud" onClick={onManualSave}>
              <Icon name="check" size={14} /> {manualSaveFeedback ? "Saved!" : "Save"}
            </button>
            <button type="button" className="ib" title="Lock session" onClick={onLock}>
              <Icon name="lock" size={18} />
            </button>
            <button type="button" className="ib" title="Settings" onClick={onOpenSettings}>
              <Icon name="gear" size={18} />
            </button>
            <button type="button" className="b pri" onClick={onPrimaryAction}>
              <Icon name={tab === "ai" ? "sparkles" : "plus"} size={16} />
              {PRIMARY_ACTIONS[tab]}
            </button>
          </div>
        </header>
      );

      // Jobs View Component
      const OPEN_STATUSES = ["Pending", "In Progress"];
      const JobsView = ({ state, searchQuery, onSortChange, onCycleStatus, onJumpToDiary, onDeleteJob, onOpenJobModal, onOpenReceipt }) => {
        const cur = state.settings.currency || "£";
        const completed = state.jobs.filter(j => j.status === "Completed");
        const rev = completed.reduce((s, j) => s + (+j.price || 0), 0);
        const profit = completed.reduce((s, j) => s + calcNet(j), 0);
        const dates = state.jobs.map(j => j.date).filter(Boolean).sort();
        const spanDays = dates.length ? Math.round((new Date(dates[dates.length - 1]).getTime() - new Date(dates[0]).getTime()) / 864e5) : 0;

        const filtered = state.jobs.map((j, idx) => ({ ...j, _i: idx })).filter(j => matchesQuery(j, searchQuery));
        const openJobs = sortByDate(filtered.filter(j => OPEN_STATUSES.includes(j.status)), state.settings.sortOrder);
        const closedJobs = sortByDate(filtered.filter(j => !OPEN_STATUSES.includes(j.status)), state.settings.sortOrder);

        const renderJobCard = j => {
          const isOpen = OPEN_STATUSES.includes(j.status);
          const sched = isOpen
            ? state.diary.filter(d => d.job == j.id && d.scheduled).map(d => d.scheduled).sort().at(-1)
            : "";
          const margin = calcMargin(j);
          const statusCls = j.status.replace(/\s+/g, "");
          const diaryCount = state.diary.filter(d => d.job == j.id).length;
          const warr = getWarrantyInfo(j);
          const linkedStockDevice = j.linkedStockId
            ? state.stock.find(s => s.id === j.linkedStockId)
            : (j.linkedStockName ? { name: j.linkedStockName } : null);

          return (
            <div
              key={j.id}
              className="jc"
              data-jv={j._i}
              title="Click to inspect full job telemetry & financials"
              onClick={e => {
                if (!e.target.closest("button, a, input, select, textarea")) onOpenJobModal(j._i);
              }}
            >
              <div className="jr">
                <div className="jid">#{j.id}</div>
                <div className="jm">
                  <b>
                    <span dangerouslySetInnerHTML={{ __html: formatRich(j.customer) }} />
                    <span className="tg">{j.type}</span>
                    {linkedStockDevice && (
                      <span className="linked-pill" style={{ marginLeft: 6 }} title="Linked to Stock Device">
                        <Icon name="link" size={10} /> Stock: {linkedStockDevice.name}
                      </span>
                    )}
                    {warr && (
                      <span className={`warr-badge ${warr.cls}`} style={{ marginLeft: 6 }} title={`Warranty (${warr.label}) · Expires ${warr.expDate}`}>
                        <Icon name="shield" size={10} /> {warr.fullText}
                      </span>
                    )}
                  </b>
                  <span>
                    <span dangerouslySetInnerHTML={{ __html: formatRich(j.device) }} /> · {fmtDate(j.date)}
                    {warr ? ` · Exp: ${warr.expDate}` : ""}
                  </span>
                  {!isOpen && j.parts?.length ? (
                    <div className="chips">
                      <small style={{ color: "var(--mu)", fontWeight: 800, fontSize: "9.5px", letterSpacing: ".08em", fontFamily: "'JetBrains Mono', monospace" }}>
                        PARTS LINKED:
                      </small>
                      {j.parts.map((p, idx) => (
                        <span key={idx} className="chip">
                          <span dangerouslySetInnerHTML={{ __html: formatRich(p.name) }} /> ({p.qtyUsed}x)
                        </span>
                      ))}
                    </div>
                  ) : null}
                </div>
                <div className="jn">
                  <small>Margin</small>
                  <b className={margin >= 75 ? "pos" : margin >= 30 ? "amb" : "neg"}>{margin.toFixed(1)}%</b>
                </div>
                <div className="jn">
                  <small>Charged</small>
                  <b>{fmtMoney(j.price, cur)}</b>
                </div>
                <div className="ja">
                  {sched && (
                    <span className="sch">
                      <Icon name="clock" size={13} />
                      {fmtDate(sched)}
                    </span>
                  )}
                  <button
                    type="button"
                    className={`ib ${diaryCount ? "glow" : "dim"}`}
                    title={diaryCount ? `${diaryCount} diary entries - view in Diary tab` : "View diary entries"}
                    onClick={() => onJumpToDiary(j.id)}
                  >
                    <Icon name="cal" size={16} />
                    {diaryCount > 0 && <i className="bd">{diaryCount}</i>}
                  </button>
                  <button
                    type="button"
                    className="ib"
                    title="Generate Customer Receipt & Warranty Card"
                    onClick={() => onOpenReceipt(j._i)}
                  >
                    <Icon name="invoice" size={15} />
                  </button>
                  <button
                    type="button"
                    className={`pill ${statusCls}`}
                    title={`Click to cycle status (${j.status})`}
                    onClick={() => onCycleStatus(j._i)}
                  >
                    {j.status === "Completed" ? <Icon name="check" size={13} /> : "●"} {j.status}
                  </button>
                  <button type="button" className="ib dg" title="Delete Job" onClick={() => onDeleteJob(j._i)}>
                    <Icon name="trash" size={16} />
                  </button>
                </div>
              </div>
              {j.notes && (
                <div className="nb">
                  <small>Internal note</small>
                  <span dangerouslySetInnerHTML={{ __html: formatRich(j.notes, true) }} />
                </div>
              )}
            </div>
          );
        };

        return (
          <Fragment>
            <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(230px,1fr))" }}>
              <div className="card stat">
                <div className="sic"><Icon name="dollar" size={22} /></div>
                <div><small>Revenue</small><b data-n={rev} data-f="m">{fmtMoney(rev, cur)}</b></div>
              </div>
              <div className="card stat">
                <div className="sic"><Icon name="trend" size={22} /></div>
                <div><small>Net profit</small><b data-n={profit} data-f="m">{fmtMoney(profit, cur)}</b></div>
              </div>
              <div className="card stat">
                <div className="sic"><Icon name="target" size={22} /></div>
                <div><small>Avg margin</small><b data-n={rev ? (profit / rev) * 100 : 0} data-f="p">{(rev ? (profit / rev) * 100 : 0).toFixed(1)}%</b></div>
              </div>
              <div className="card stat">
                <div className="sic"><Icon name="cal" size={22} /></div>
                <div><small>Timespan</small><b data-n={spanDays} data-f="d">{spanDays} days</b></div>
              </div>
            </div>

            <div className="ah">
              <h2>
                <span style={{ color: "var(--ac)", display: "flex" }}><Icon name="layers" size={20} /></span>{" "}
                <span className="gradient-emerald-text">Job Activity</span>
              </h2>
              <div>
                <select id="so" value={state.settings.sortOrder} onChange={e => onSortChange(e.target.value)}>
                  <option value="date-desc">Newest Date</option>
                  <option value="date-asc">Oldest Date</option>
                </select>
                <span className="chip Completed">{filtered.length} Records</span>
              </div>
            </div>

            {openJobs.map(renderJobCard)}
            {openJobs.length > 0 && closedJobs.length > 0 && <div className="sep">Processed &amp; Completed Jobs</div>}
            {closedJobs.map(renderJobCard)}
            {openJobs.length === 0 && closedJobs.length === 0 && <p className="note">No jobs match search criteria.</p>}
            <p className="note">Stats count Completed jobs only. Click a status pill on an open job to cycle its status.</p>
          </Fragment>
        );
      };

      // Analytics / Stats Dashboard
      const CHART_COLORS = ["var(--ac)", "#22d3ee", "#a3e635", "#f59e0b"];
      const StatsView = ({ state }) => {
        const [range, setRange] = useState("all");
        const cur = state.settings.currency || "£";
        const latestDateStr = [...state.jobs.map(j => j.date), ...state.expenses.map(e => e.date)].filter(Boolean).sort().at(-1) || todayIso();
        const latestDate = new Date(latestDateStr);
        const monthsList = [...new Set(state.jobs.map(j => (j.date || "").slice(0, 7)).filter(Boolean))].sort();

        const inRange = d => {
          if (!d || range === "all") return true;
          if (range === "30d") {
            const diff = (latestDate.getTime() - new Date(d).getTime()) / 864e5;
            return diff >= 0 && diff <= 30;
          }
          if (range === "90d") {
            const diff = (latestDate.getTime() - new Date(d).getTime()) / 864e5;
            return diff >= 0 && diff <= 90;
          }
          return !range.startsWith("mo:") || d.startsWith(range.slice(3));
        };

        const jobs = state.jobs.filter(j => inRange(j.date));
        const expenses = state.expenses.filter(e => inRange(e.date));
        const tests = state.tests.filter(t => inRange(t.date));
        const done = jobs.filter(j => j.status === "Completed");
        const open = jobs.filter(j => ["Pending", "In Progress"].includes(j.status));
        const canc = jobs.filter(j => j.status === "Cancelled");

        const rev = done.reduce((s, j) => s + (+j.price || 0), 0);
        const netPrf = done.reduce((s, j) => s + calcNet(j), 0);
        const directCost = done.reduce((s, j) => s + (+j.deviceCost || 0) + (+j.partsCost || 0), 0);
        const totalExp = expenses.reduce((s, e) => s + (+e.amount || 0), 0);
        const netCash = rev - totalExp;
        const unitMargin = rev ? (netPrf / rev) * 100 : 0;
        const roi = totalExp > 0 ? ((rev - totalExp) / totalExp) * 100 : 100;
        const denom = done.length || 1;

        const jobDates = jobs.map(j => j.date).filter(Boolean).sort();
        const activeDays = jobDates.length ? Math.max(1, Math.round((new Date(jobDates[jobDates.length - 1]).getTime() - new Date(jobDates[0]).getTime()) / 864e5)) : 1;

        const monthly = {};
        state.jobs.filter(j => j.status === "Completed").forEach(j => {
          const m = (j.date || "").slice(0, 7);
          if (!m) return;
          const row = monthly[m] || (monthly[m] = { r: 0, p: 0, n: 0, exp: 0 });
          row.r += +j.price || 0;
          row.p += calcNet(j);
          row.n++;
        });
        state.expenses.forEach(e => {
          const m = (e.date || "").slice(0, 7);
          if (!m) return;
          const row = monthly[m] || (monthly[m] = { r: 0, p: 0, n: 0, exp: 0 });
          row.exp += +e.amount || 0;
        });

        const sortedMonths = Object.keys(monthly).sort();
        const latestMo = monthly[sortedMonths.at(-1) || ""];
        const prevMo = monthly[sortedMonths.at(-2) || ""];
        const maxBar = Math.max(1, ...sortedMonths.map(m => Math.max(monthly[m].r, monthly[m].p, monthly[m].exp)));
        const momRev = latestMo && prevMo && prevMo.r ? ((latestMo.r - prevMo.r) / prevMo.r) * 100 : 0;
        const momPrf = latestMo && prevMo && prevMo.p ? ((latestMo.p - prevMo.p) / Math.abs(prevMo.p)) * 100 : 0;

        // Job Category Donut Breakdown
        const byTypeCount = {};
        const byTypeRev = {};
        done.forEach(j => {
          const t = j.type || "Other";
          byTypeCount[t] = (byTypeCount[t] || 0) + 1;
          byTypeRev[t] = (byTypeRev[t] || 0) + (+j.price || 0);
        });
        let donutAcc = 0;
        const typeEntries = Object.entries(byTypeCount).sort((a, b) => b[1] - a[1]);
        const donutGradient = typeEntries.map(([, cnt], idx) => {
          const start = donutAcc;
          donutAcc += (cnt / (done.length || 1)) * 100;
          return `${CHART_COLORS[idx % 4]} ${start}% ${donutAcc}%`;
        }).join(", ");

        // Hardware Specialization Mix
        const hwMix = {
          "PS5 TMR & Hall Effect": { n: 0, r: 0, p: 0 },
          "Xbox TMR & Hall Effect": { n: 0, r: 0, p: 0 },
          "PC Builds & Tuning": { n: 0, r: 0, p: 0 },
          "Apple / Mobile & Other": { n: 0, r: 0, p: 0 }
        };
        done.forEach(j => {
          const dev = (j.device || "").toLowerCase();
          let bucket = "Apple / Mobile & Other";
          if (dev.includes("ps5") || dev.includes("dualsense") || dev.includes("dualshock")) bucket = "PS5 TMR & Hall Effect";
          else if (dev.includes("xbox")) bucket = "Xbox TMR & Hall Effect";
          else if (dev.includes("pc") || dev.includes("computer")) bucket = "PC Builds & Tuning";
          hwMix[bucket].n++;
          hwMix[bucket].r += +j.price || 0;
          hwMix[bucket].p += calcNet(j);
        });
        const hwEntries = Object.entries(hwMix).filter(([, v]) => v.n > 0).sort((a, b) => b[1].r - a[1].r);
        const maxHwRev = Math.max(1, ...hwEntries.map(([, v]) => v.r));

        // Top Clients & Repeat Business
        const clientMap = {};
        done.forEach(j => {
          const name = (j.customer || "Walk-in").trim();
          if (!clientMap[name]) clientMap[name] = { name, jobs: 0, rev: 0, profit: 0, last: j.date };
          clientMap[name].jobs++;
          clientMap[name].rev += +j.price || 0;
          clientMap[name].profit += calcNet(j);
          if (j.date > clientMap[name].last) clientMap[name].last = j.date;
        });
        const topClients = Object.values(clientMap).sort((a, b) => b.rev - a.rev || b.jobs - a.jobs).slice(0, 5);
        const repeatClientsCount = Object.values(clientMap).filter(c => c.jobs > 1).length;

        const pipeRev = open.reduce((s, j) => s + (+j.price || 0), 0);
        const pipeProfit = open.reduce((s, j) => s + calcNet(j), 0);
        const partsStockVal = state.stock.filter(s => s.cat === "Parts").reduce((s, x) => s + Number(x.qty ?? 0) * Number(x.unitCost ?? 0), 0);
        const totalInvVal = partsStockVal + state.stock.filter(s => s.cat !== "Parts" && s.status !== "Sold").reduce((s, x) => s + Number(x.deviceCost ?? 0) + Number(x.partsCost ?? 0), 0);
        const estInvResale = state.stock.filter(s => s.cat !== "Parts" && s.status !== "Sold").reduce((s, x) => s + Number(x.price ?? 0), 0);
        const compRate = jobs.length ? (done.length / jobs.length) * 100 : 0;
        const qaPassRate = tests.length ? (tests.filter(t => t.result === "Passed").length / tests.length) * 100 : 100;

        const expCats = { Parts: 0, Equipment: 0, Device: 0, General: 0 };
        expenses.forEach(e => {
          const c = expCats[e.cat] === undefined ? "General" : e.cat;
          expCats[c] += +e.amount || 0;
        });

        const filterPills = [
          ["all", "All Time"],
          ["90d", "Last 90 Days"],
          ["30d", "Last 30 Days"],
          ...monthsList.slice(-4).map(m => ["mo:" + m, new Date(m + "-01").toLocaleString("en-GB", { month: "short", year: "2-digit" })])
        ];

        const kpiCards = [
          { ico: "dollar", l: "Avg Job Value", v: rev / denom, f: "m", sub: `Max: ${fmtMoney(Math.max(0, ...done.map(j => +j.price || 0)), cur)}`, display: fmtMoney(rev / denom, cur) },
          { ico: "trend", l: "Avg Profit / Job", v: netPrf / denom, f: "m", sub: `${unitMargin.toFixed(1)}% unit margin`, display: fmtMoney(netPrf / denom, cur) },
          { ico: "check", l: "Jobs Completed", v: done.length, f: "i", sub: `${compRate.toFixed(0)}% completion (${canc.length} canc)`, display: String(done.length) },
          { ico: "clock", l: "Weekly Velocity", v: done.length / Math.max(1, activeDays / 7), f: "x", sub: `Over ${activeDays} active days`, display: (done.length / Math.max(1, activeDays / 7)).toFixed(1) },
          { ico: "layers", l: "Active Pipeline", v: pipeRev, f: "m", sub: `${open.length} open job${open.length === 1 ? "" : "s"}`, display: fmtMoney(pipeRev, cur) },
          { ico: "box", l: "Inventory Value", v: totalInvVal, f: "m", sub: `Est. resale: ${fmtMoney(estInvResale + partsStockVal, cur)}`, display: fmtMoney(totalInvVal, cur) },
          { ico: "tag", l: "Logged Expenses", v: totalExp, f: "m", sub: `${expenses.length} purchase records`, display: fmtMoney(totalExp, cur) },
          { ico: "flask", l: "QA Pass Rate", v: qaPassRate, f: "p", sub: `${tests.length} quality checks logged`, display: `${qaPassRate.toFixed(1)}%` }
        ];

        return (
          <Fragment>
            <div className="ah" style={{ marginTop: 0, marginBottom: 20 }}>
              <div className="ph" style={{ margin: 0 }}>
                <h2><span className="gradient-emerald-text">Executive Telemetry &amp; Analytics</span></h2>
                <p>Real-time workshop financial performance, unit economics, and hardware mod telemetry.</p>
              </div>
              <div className="pills" style={{ margin: 0 }}>
                {filterPills.map(([k, lbl]) => (
                  <button key={k} type="button" className={`b${range === k ? " on" : ""}`} onClick={() => setRange(r => r === k && k !== "all" ? "all" : k)}>
                    {lbl}
                  </button>
                ))}
              </div>
            </div>

            <div className="stat-hero-grid">
              <div className="hero-stat-card">
                <div className="hero-stat-top">
                  <small>Gross Revenue ({done.length} Jobs)</small>
                  {latestMo && prevMo && range === "all" ? (
                    <span className={`chip ${momRev >= 0 ? "Completed" : "Cancelled"}`}>
                      {momRev >= 0 ? "▲" : "▼"} {Math.abs(momRev).toFixed(0)}% MoM
                    </span>
                  ) : (
                    <span className="chip Completed">Active</span>
                  )}
                </div>
                <div className="hero-stat-val gradient-emerald-text" data-n={rev} data-f="m">{fmtMoney(rev, cur)}</div>
                <div className="mini-bar-track"><div className="mini-bar-fill" style={{ width: `${Math.min(100, (rev / Math.max(1, rev + pipeRev)) * 100)}%` }} /></div>
                <div className="hero-stat-foot">
                  <span>Pipeline: <strong style={{ color: "var(--tx)" }}>{fmtMoney(pipeRev, cur)}</strong></span>
                  <span>Potential: <strong style={{ color: "var(--ac)" }}>{fmtMoney(rev + pipeRev, cur)}</strong></span>
                </div>
              </div>

              <div className="hero-stat-card">
                <div className="hero-stat-top">
                  <small>Net Job Profit</small>
                  {latestMo && prevMo && range === "all" ? (
                    <span className={`chip ${momPrf >= 0 ? "Completed" : "Cancelled"}`}>
                      {momPrf >= 0 ? "▲" : "▼"} {Math.abs(momPrf).toFixed(0)}% MoM
                    </span>
                  ) : (
                    <span className="chip Completed">Net Positive</span>
                  )}
                </div>
                <div className="hero-stat-val gradient-emerald-text" data-n={netPrf} data-f="m">{fmtMoney(netPrf, cur)}</div>
                <div className="mini-bar-track"><div className="mini-bar-fill" style={{ width: `${Math.max(5, Math.min(100, unitMargin))}%` }} /></div>
                <div className="hero-stat-foot">
                  <span>Direct Costs: <strong style={{ color: "var(--tx)" }}>{fmtMoney(directCost, cur)}</strong></span>
                  <span>Pending Prf: <strong style={{ color: "var(--ac)" }}>+{fmtMoney(pipeProfit, cur)}</strong></span>
                </div>
              </div>

              <div className="hero-stat-card">
                <div className="hero-stat-top">
                  <small>Unit Profit Margin</small>
                  <span className={`chip ${unitMargin >= 70 ? "Completed" : unitMargin >= 40 ? "Pending" : "Cancelled"}`}>
                    {unitMargin >= 70 ? "High Margin" : unitMargin >= 40 ? "Healthy" : "Tight"}
                  </span>
                </div>
                <div className="hero-stat-val gradient-emerald-text" data-n={unitMargin} data-f="p">{unitMargin.toFixed(1)}%</div>
                <div className="mini-bar-track"><div className="mini-bar-fill" style={{ width: `${Math.max(5, Math.min(100, unitMargin))}%` }} /></div>
                <div className="hero-stat-foot">
                  <span>Avg Ticket: <strong style={{ color: "var(--tx)" }}>{fmtMoney(rev / denom, cur)}</strong></span>
                  <span>Avg Profit: <strong style={{ color: "var(--ac)" }}>{fmtMoney(netPrf / denom, cur)}</strong></span>
                </div>
              </div>

              <div className="hero-stat-card">
                <div className="hero-stat-top">
                  <small>Net Cash Position</small>
                  <span className={`chip ${netCash >= 0 ? "Completed" : "Cancelled"}`}>ROI {roi >= 0 ? "+" : ""}{roi.toFixed(0)}%</span>
                </div>
                <div className="hero-stat-val gradient-emerald-text" data-n={netCash} data-f="m">{fmtMoney(netCash, cur)}</div>
                <div className="mini-bar-track"><div className="mini-bar-fill" style={{ width: `${Math.min(100, rev ? Math.max(10, ((rev - totalExp) / rev) * 100) : 0)}%` }} /></div>
                <div className="hero-stat-foot">
                  <span>Total Outlay: <strong style={{ color: "var(--red)" }}>{fmtMoney(totalExp, cur)}</strong></span>
                  <span>Stock Asset: <strong style={{ color: "var(--ac)" }}>+{fmtMoney(totalInvVal, cur)}</strong></span>
                </div>
              </div>
            </div>

            <div className="grid">
              {kpiCards.map(c => (
                <div key={c.l} className="card stat">
                  <div className="sic"><Icon name={c.ico} size={22} /></div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <small>{c.l}</small>
                    <b data-n={c.v} data-f={c.f}>{c.display}</b>
                    {c.sub && <div style={{ fontSize: "10.5px", color: "var(--mu)", marginTop: 2, fontFamily: "'JetBrains Mono', monospace" }}>{c.sub}</div>}
                  </div>
                </div>
              ))}
            </div>

            <div className="grid g2" style={{ marginBottom: 18 }}>
              <div className="card">

                  </div>
                  <div className="leg" style={{ margin: 0 }}>
                    <span><u style={{ background: "var(--ac)" }} />Rev</span>
                    <span><u style={{ background: "#22d3ee" }} />Profit</span>
                    <span><u style={{ background: "rgba(244,63,94,0.8)" }} />Exp</span>
                  </div>
                </div>
                <div className="chart-bars-wrap">
                  {sortedMonths.map(m => {
                    const row = monthly[m];
                    const rH = Math.max(4, (row.r / maxBar) * 100);
                    const pH = Math.max(4, (Math.max(0, row.p) / maxBar) * 100);
                    const eH = row.exp > 0 ? Math.max(4, (row.exp / maxBar) * 100) : 0;
                    const lbl = new Date(m + "-01").toLocaleString("en-GB", { month: "short", year: "2-digit" });
                    const mPct = row.r ? ((row.p / row.r) * 100).toFixed(0) : 0;
                    return (
                      <div key={m} className="chart-col" onClick={() => setRange(r => r === "mo:" + m ? "all" : "mo:" + m)}>
                        <div className="chart-tooltip">
                          <div style={{ color: "var(--ac)", fontWeight: 800, marginBottom: 3 }}>{lbl} ({row.n} Jobs)</div>
                          <div>Revenue: <b>{fmtMoney(row.r, cur)}</b></div>
                          <div>Net Profit: <b style={{ color: "#22d3ee" }}>{fmtMoney(row.p, cur)}</b> ({mPct}%)</div>

                        <div className="chart-bars-group">

                          <div className="chart-bar prf" style={{ height: `${pH}%` }} />
                          {eH > 0 && <div className="chart-bar exp" style={{ height: `${eH}%` }} />}

                        <small style={{ marginTop: 6, fontFamily: "'JetBrains Mono', monospace", fontSize: "10.5px", color: range === "mo:" + m ? "var(--ac)" : "var(--mu)", fontWeight: range === "mo:" + m ? 800 : 600 }}>

              <div className="card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                  <div>
                    <h3 style={{ color: "var(--ac)" }}>Hardware Specialization Mix</h3>
                    <small>Revenue &amp; job share by hardware category</small>

                <div className="donut" style={{ marginBottom: 16 }}>

                  <div style={{ flex: 1 }}>
                    {typeEntries.map(([tName, cnt], idx) => (
                      <div key={tName} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "6px 0", fontSize: "12.5px" }}>
                        <span>
                          <u style={{ display: "inline-block", width: 9, height: 9, borderRadius: 3, marginRight: 7, background: CHART_COLORS[idx % 4], textDecoration: "none" }} />
                          {tName} <span style={{ color: "var(--mu)", fontSize: 11 }}>({cnt})</span>
                        </span>
                        <b style={{ fontSize: 13 }}>{fmtMoney(byTypeRev[tName] || 0, cur)}</b>
                      </div>
                    ))}

                <div style={{ borderTop: "1px solid var(--line)", paddingTop: 12 }}>

                        <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, fontWeight: 700, color: "var(--ac)" }}>

                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="grid g2" style={{ marginBottom: 18 }}>
              <div className="card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                  <div>
                    <h3 style={{ color: "var(--ac)" }}>Top Clients &amp; Repeat Business</h3>
                    <small>Highest value customers &amp; loyalty metrics</small>
                  </div>
                  <span className="chip Completed">{repeatClientsCount} Repeat Clients</span>
                </div>
                <div>
                  {topClients.length === 0 ? (
                    <p className="note">No completed customer jobs in this period.</p>
                  ) : topClients.map((cl, idx) => (
                    <div key={cl.name} className="rank-item">
                      <div style={{ display: "flex", alignItems: "center", gap: 10, minWidth: 0 }}>
                        <span className="rank-num">#{idx + 1}</span>
                        <div style={{ minWidth: 0 }}>
                          <div style={{ fontWeight: 700, fontSize: "13.5px", color: "var(--tx)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{cl.name}</div>
                          <small style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: "10.5px" }}>
                            {cl.jobs} job{cl.jobs > 1 ? "s" : ""} · Last: {fmtDate(cl.last)}
                          </small>
                        </div>
                      </div>
                      <div style={{ textAlign: "right", flexShrink: 0 }}>
                        <b style={{ fontSize: "14.5px", color: "var(--ac)" }}>{fmtMoney(cl.rev, cur)}</b>
                        <small style={{ fontSize: 10, color: "var(--mu)" }}>{fmtMoney(cl.profit, cur)} net</small>
                      </div>
                    </div>
