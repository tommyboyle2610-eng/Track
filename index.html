              </div>
              <div className="dlg-body">
                <p style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--tx)" }}>{prompt.message}</p>
                {hasInput && (
                  <input
                    type={inputType}
                    step={inputType === "number" ? "any" : undefined}
                    placeholder={prompt.placeholder || ""}
                    value={val}
                    autoFocus
                    onChange={e => setVal(e.target.value)}
                  />
                )}
              </div>
              <div className="dlg-footer">
                <button type="button" className="b" onClick={onClose}>Cancel</button>
                <button
                  type="button"
                  className="b pri"
                  onClick={() => {
                    const cb = prompt.onConfirm;
                    const out = hasInput ? val : undefined;
                    onClose();
                    cb(out);
                  }}
                >
                  {hasInput ? "Confirm" : "Yes"}
                </button>
              </div>
            </div>
          </dialog>
        );
      };

      // Storage Keys & State Loader
      const STORAGE_KEY = "rbt_v1";
      const UNLOCK_KEY = "rbt_unlocked";

      function loadInitialState() {
        try {
          const raw = window.localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            const base = JSON.parse(JSON.stringify(DEFAULT_STATE));
            base.expenses = normalizeExpenseIds(base.expenses);
            base.stock = normalizeStockIds(base.stock, base.expenses);
            return base;
          }
          const parsed = JSON.parse(raw);
          const normExpenses = normalizeExpenseIds(Array.isArray(parsed?.expenses) ? parsed.expenses : DEFAULT_STATE.expenses);
          const normStock = normalizeStockIds(Array.isArray(parsed?.stock) ? parsed.stock : DEFAULT_STATE.stock, normExpenses);
          return {
            ...DEFAULT_STATE,
            ...parsed,
            settings: { ...DEFAULT_STATE.settings, ...(parsed?.settings || {}) },
            jobs: Array.isArray(parsed?.jobs) ? parsed.jobs : DEFAULT_STATE.jobs,
            expenses: normExpenses,
            diary: Array.isArray(parsed?.diary) ? parsed.diary : DEFAULT_STATE.diary,
            tests: Array.isArray(parsed?.tests) ? parsed.tests : DEFAULT_STATE.tests,
            stock: normStock,
            aiChats: Array.isArray(parsed?.aiChats) ? parsed.aiChats : [],
            activeAiChatId: typeof parsed?.activeAiChatId === "string" ? parsed.activeAiChatId : null
          };
        } catch {
          const fallback = JSON.parse(JSON.stringify(DEFAULT_STATE));
          fallback.expenses = normalizeExpenseIds(fallback.expenses);
          fallback.stock = normalizeStockIds(fallback.stock, fallback.expenses);
          return fallback;
        }
      }

      // Main Application Component
      function App() {
        const [state, setState] = useState(loadInitialState);
        const [tab, setTab] = useState("jobs");
        const [searchQuery, setSearchQuery] = useState("");
        const [unlocked, setUnlocked] = useState(() => {
          try { return window.sessionStorage.getItem(UNLOCK_KEY) === "true"; } catch { return false; }
        });
        const [tempMobileMode, setTempMobileMode] = useState(false);
        const [cloudStatus, setCloudStatus] = useState("Cloud Sync");
        const [manualSaved, setManualSaved] = useState(false);
        const [streamingChatId, setStreamingChatId] = useState(null);

        const [inspectJobIdx, setInspectJobIdx] = useState(null);
        const [receiptJobIdx, setReceiptJobIdx] = useState(null);
        const [editJobModal, setEditJobModal] = useState({ open: false, index: null });
        const [entityModal, setEntityModal] = useState({ kind: null, index: null, presetCat: null });
        const [inspectDeviceExpIdx, setInspectDeviceExpIdx] = useState(null);
        const [stockPickerOpen, setStockPickerOpen] = useState(false);
        const [settingsOpen, setSettingsOpen] = useState(false);
        const [invoiceModal, setInvoiceModal] = useState(null);
        const [promptModal, setPromptModal] = useState(null);
        const [animTick, setAnimTick] = useState(1);

        const stateRef = useRef(state);
        stateRef.current = state;
        const viewRef = useRef(null);
        const fileInputRef = useRef(null);
        const firestoreRef = useRef(null);
        const isSavingRef = useRef(false);
        const lastJsonRef = useRef("");
        const saveTimerRef = useRef(null);
        const aiOpenedThisSessionRef = useRef(false);

        const accentKey = ACCENT_THEMES[state.settings.accent] ? state.settings.accent : "neon";

        useEffect(() => {
          document.body.classList.toggle("light", !state.settings.dark);
          document.body.classList.toggle("mobile-mode", tempMobileMode);
          const fxOn = state.settings.animations !== false;
          document.body.classList.toggle("fx", fxOn);
          document.body.classList.toggle("no-fx", !fxOn);
          const fKey = FONTS[state.settings.font] ? state.settings.font : "jakarta";
          document.documentElement.style.setProperty("--font-main", FONTS[fKey].family);
          const theme = ACCENT_THEMES[accentKey];
          document.documentElement.style.setProperty("--ac", theme.ac);
          document.documentElement.style.setProperty("--lime", theme.lime || "#a3e635");
          document.documentElement.style.setProperty("--grad", theme.grad);
          document.documentElement.style.setProperty("--bg-glow", theme.bgGlow);
        }, [state.settings.dark, state.settings.font, accentKey, tempMobileMode, state.settings.animations]);

        useEffect(() => {
          if (state.settings.animations === false) return;
          const onDown = e => {
            const btn = e.target?.closest?.(".b, .ib, nav button, .seg button");
            if (!btn || btn.disabled) return;
            const r = btn.getBoundingClientRect();
            const size = Math.max(r.width, r.height) * 2.1;
            const dot = document.createElement("span");
            dot.className = "fx-ripple";
            dot.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
            btn.appendChild(dot);
            setTimeout(() => dot.remove(), 600);
          };
          document.addEventListener("pointerdown", onDown, { passive: true });
          return () => document.removeEventListener("pointerdown", onDown);
        }, [state.settings.animations]);

        const persistState = useCallback(async (nextState, immediate = false) => {
          const json = JSON.stringify(nextState);
          try { window.localStorage.setItem(STORAGE_KEY, json); } catch {}
          const db = firestoreRef.current;
          if (!db) {
            if (immediate) {
              setManualSaved(true);
              setTimeout(() => setManualSaved(false), 1800);
            }
            return;
          }
          const runCloudSave = async () => {
            if (saveTimerRef.current !== null) {
              clearTimeout(saveTimerRef.current);
              saveTimerRef.current = null;
            }
            isSavingRef.current = true;
            setCloudStatus("Cloud Sync: Saving...");
            try {
              const appId = window.__app_id || "second-life-uk-tracker";
              const docRef = db.collection("artifacts").doc(appId).collection("public").doc("data");
              lastJsonRef.current = json;
              await docRef.set({
                json,
                appState: nextState,
                aiCustomInstructions: nextState?.settings?.aiCustomInstructions || "",
                aiApiKey: nextState?.settings?.aiApiKey || "",
                updatedAt: Date.now()
              });
              setCloudStatus("Cloud Sync: Saved");
              if (immediate) {
                setManualSaved(true);
                setTimeout(() => setManualSaved(false), 1800);
              }
            } catch (err) {
              setCloudStatus(err?.code === "permission-denied" || err?.code === "unavailable" ? "Cloud Sync: Local Mode" : "Cloud Sync: Save Error");
            } finally {
              setTimeout(() => { isSavingRef.current = false; }, 450);
            }
          };

          if (immediate) {
            await runCloudSave();
          } else {
            setCloudStatus("Cloud Sync: Saving...");
            if (saveTimerRef.current !== null) clearTimeout(saveTimerRef.current);
            saveTimerRef.current = setTimeout(runCloudSave, 280);
          }
        }, []);

        const updateState = useCallback((updater, immediate = false) => {
          setState(prev => {
            const next = updater(prev);
            persistState(next, immediate);
            return next;
          });
        }, [persistState]);

        // Firebase Initialization
        useEffect(() => {
          let unsub;
          (async () => {
            try {
              const fb = window.firebase;
              if (!fb) { setCloudStatus("Cloud Sync: Local Mode"); return; }
              const appId = window.__app_id || "second-life-uk-tracker";
              if (!fb.apps?.length) fb.initializeApp(FIREBASE_CONFIG);
              const db = fb.firestore();
              firestoreRef.current = db;
              const auth = typeof fb.auth === "function" ? fb.auth() : null;
              if (auth) {
                try {
                  if (window.__initial_auth_token) await auth.signInWithCustomToken(window.__initial_auth_token);
                  else if (!auth.currentUser) await auth.signInAnonymously();
                } catch {}
              }
              unsub = db.collection("artifacts").doc(appId).collection("public").doc("data").onSnapshot(
                snap => {
                  if (isSavingRef.current) return;
                  const data = snap.exists ? snap.data() : null;
                  const remoteJson = typeof data?.json === "string" ? data.json : (data?.appState ? JSON.stringify(data.appState) : null);
                  if (remoteJson && remoteJson !== lastJsonRef.current) {
                    lastJsonRef.current = remoteJson;
                    try {
                      const parsed = JSON.parse(remoteJson);
                      if (parsed && parsed.jobs) {
                        try { window.localStorage.setItem(STORAGE_KEY, remoteJson); } catch {}
                        setState(prev => {
                          const normExpenses = normalizeExpenseIds(parsed.expenses || prev.expenses);
                          const normStock = normalizeStockIds(parsed.stock || prev.stock, normExpenses);
                          return {
                            ...DEFAULT_STATE,
                            ...parsed,
                            settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) },
                            stock: normStock,
                            expenses: normExpenses
                          };
                        });
                      }
                    } catch {}
                  }
                  setCloudStatus("Cloud Sync: Active");
                },
                () => setCloudStatus("Cloud Sync: Local Mode")
              );
            } catch {
              setCloudStatus("Cloud Sync: Local Mode");
            }
          })();
          return () => { if (unsub) unsub(); };
        }, []);

        useEffect(() => {
          const el = viewRef.current;
          if (!el) return;
          el.classList.remove("in");
          void el.offsetWidth;
          el.classList.add("in");
        }, [tab, animTick]);

        const createFreshAiChat = useCallback(() => {
          const nowIso = new Date().toISOString();
          const freshId = `chat-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
          const freshChat = { id: freshId, title: "New Chat", createdAt: nowIso, updatedAt: nowIso, messages: [] };
          updateState(s => ({ ...s, activeAiChatId: freshId, aiChats: [freshChat, ...(s.aiChats || [])] }));
        }, [updateState]);

        const switchTab = t => {
          if (t === "ai" && !aiOpenedThisSessionRef.current) {
            aiOpenedThisSessionRef.current = true;
            createFreshAiChat();
          }
          setTab(t);
          setSearchQuery("");
          setAnimTick(c => c + 1);
        };

        const handlePrimaryAction = () => {
          if (tab === "ai") createFreshAiChat();
          else if (tab === "stock") setStockPickerOpen(true);
          else if (tab === "jobs" || tab === "dash") setEditJobModal({ open: true, index: null });
          else if (tab === "tax") exportHmrcCsv("2026/27");
          else if (tab === "diag") switchTab("tests");
          else if (tab === "exp" || tab === "diary" || tab === "tests") setEntityModal({ kind: tab, index: null, presetCat: null });
        };

        const exportHmrcCsv = taxYear => {
          const rows = [["Date", "Type", "Category_Or_Job", "Customer_Or_Supplier", "Description", "Income_GBP", "Expense_GBP"]];
          state.jobs
            .filter(j => j.status === "Completed" && getUkTaxYear(j.date) === taxYear)
            .forEach(j => rows.push([j.date, "Income", `Job #${j.id} (${j.type})`, j.customer, j.device, (Number(j.price) || 0).toFixed(2), "0.00"]));
          state.expenses
            .filter(e => getUkTaxYear(e.date) === taxYear)
            .forEach(e => rows.push([e.date, "Expense", e.cat || "General", e.seller || "Supplier", e.name, "0.00", (Number(e.amount) || 0).toFixed(2)]));
          const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
          const a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
          a.download = `SecondLifeUK-HMRC-Tax-${taxYear.replace("/", "-")}.csv`;
          a.click();
        };

        // Cycle Job Status & Sync Linked Stock Device Status
        const handleCycleStatus = idx => {
          const nextMap = { Pending: "In Progress", "In Progress": "Completed", Completed: "Cancelled", Cancelled: "Pending" };
          updateState(prev => {
            const jobs = [...prev.jobs];
            const job = jobs[idx];
            if (!job) return prev;
            const newStatus = nextMap[job.status] || "Pending";
            jobs[idx] = { ...job, status: newStatus };

            let stock = [...prev.stock];
            if (job.linkedStockId) {
              stock = stock.map(item => {
                if (item.id !== job.linkedStockId) return item;
                if (newStatus === "Completed") return { ...item, status: "Sold", sold: Number(job.price) || item.price || 0, linkedJobId: job.id };
                if (newStatus === "Cancelled") return { ...item, status: "In Stock", sold: 0, linkedJobId: "" };
                return { ...item, status: "Pending", linkedJobId: job.id };
              });
            }
            return { ...prev, jobs, stock };
          });
        };

        const handleDeleteJob = idx => {
          const job = state.jobs[idx];
          if (!job) return;
          setPromptModal({
            message: `Delete job #${job.id} (${job.customer || "Unnamed"})?`,
            onConfirm: () => {
              setEditJobModal({ open: false, index: null });
              setInspectJobIdx(null);
              updateState(prev => {
                const target = prev.jobs[idx];
                const targetId = target?.id;
                const stock = prev.stock.map(item =>
                  target?.linkedStockId && item.id === target.linkedStockId
                    ? { ...item, status: "In Stock", sold: 0, linkedJobId: "" }
                    : item
                );
                return {
                  ...prev,
                  jobs: prev.jobs.filter((_, i) => i !== idx),
                  diary: prev.diary.filter(d => d.job != targetId),
                  tests: prev.tests.filter(t => t.job != targetId),
                  stock
                };
              });
            }
          });
        };

        const handleDeleteEntity = (kind, idx) => {
          const labels = { exp: "expense", diary: "diary entry", tests: "test log", stock: "stock item" };
          setPromptModal({
            message: `Delete this ${labels[kind]}?`,
            onConfirm: () => {
              setEntityModal({ kind: null, index: null, presetCat: null });
              updateState(prev => {
                if (kind === "exp") {
                  const removed = prev.expenses[idx];
                  return {
                    ...prev,
                    expenses: prev.expenses.filter((_, i) => i !== idx),
                    stock: prev.stock.map(s => (removed?.id && s.linkedExpenseId === removed.id ? { ...s, linkedExpenseId: "" } : s))
                  };
                }
                if (kind === "diary") return { ...prev, diary: prev.diary.filter((_, i) => i !== idx) };
                if (kind === "tests") return { ...prev, tests: prev.tests.filter((_, i) => i !== idx) };
                const removedStock = prev.stock[idx];
                return {
                  ...prev,
                  stock: prev.stock.filter((_, i) => i !== idx),
                  jobs: prev.jobs.map(j => (removedStock?.id && j.linkedStockId === removedStock.id ? { ...j, linkedStockId: "", linkedStockName: "" } : j))
                };
              });
            }
          });
        };

        // Gemini AI Chat Handler (Full Read/Write Workshop Agent)
        const executeAiActionsOnState = (prev, actionsList) => {
          let next = {
            ...prev,
            jobs: [...prev.jobs],
            stock: prev.stock.map(s => ({ ...s })),
            expenses: [...prev.expenses],
            diary: [...prev.diary],
            tests: [...prev.tests]
          };

          for (const action of actionsList) {
            if (!action || !action.type || !action.data) continue;
            const d = action.data;

            if (action.type === "ADD_JOB") {
              const jobParts = [];
              let computedPartsCost = Number(d.partsCost) || 0;
              if (d.partName) {
                const pIdx = next.stock.findIndex(st => st.cat === "Parts" && st.name.toLowerCase().includes(String(d.partName).toLowerCase()));
                if (pIdx !== -1) {
                  const qty = Math.max(1, Number(d.partQty) || 2);
                  const stItem = next.stock[pIdx];
                  next.stock[pIdx] = { ...stItem, qty: Math.max(0, Number(stItem.qty || 0) - qty) };
                  jobParts.push({ index_: stItem.index_ ?? pIdx, name: stItem.name, unitCost: Number(stItem.unitCost) || 0, qtyUsed: qty });
                  if (!computedPartsCost) computedPartsCost = Number(((Number(stItem.unitCost) || 0) * qty).toFixed(2));
                }
              }
              const newJob = {
                id: nextJobId(next.jobs),
                date: d.date || todayIso(),
                customer: d.customer || "Customer",
                device: d.device || "Repair Service",
                deviceCost: Number(d.deviceCost) || 0,
                partsCost: computedPartsCost,
                price: Number(d.price) || 0,
                status: d.status || "Pending",
                type: d.type || "Service",
                notes: d.notes || "",
                parts: jobParts,
                hasWarranty: !!d.hasWarranty,
                warrantyDuration: d.hasWarranty ? (Number(d.warrantyDuration) || 3) : 0,
                warrantyUnit: d.warrantyUnit || "Months"
              };
              next.jobs.push(newJob);
            } else if (action.type === "UPDATE_JOB") {
              const targetId = Number(d.id);
              const jIdx = next.jobs.findIndex(j => Number(j.id) === targetId);
              if (jIdx !== -1) {
                const oldJob = next.jobs[jIdx];
                const updated = {
                  ...oldJob,
                  ...(d.date !== undefined ? { date: d.date } : {}),
                  ...(d.customer !== undefined ? { customer: d.customer } : {}),
                  ...(d.device !== undefined ? { device: d.device } : {}),
                  ...(d.type !== undefined ? { type: d.type } : {}),
                  ...(d.status !== undefined ? { status: d.status } : {}),
                  ...(d.deviceCost !== undefined ? { deviceCost: Number(d.deviceCost) || 0 } : {}),
                  ...(d.partsCost !== undefined ? { partsCost: Number(d.partsCost) || 0 } : {}),
                  ...(d.price !== undefined ? { price: Number(d.price) || 0 } : {}),
                  ...(d.notes !== undefined ? { notes: d.notes } : {}),
                  ...(d.hasWarranty !== undefined ? { hasWarranty: !!d.hasWarranty } : {}),
                  ...(d.warrantyDuration !== undefined ? { warrantyDuration: Number(d.warrantyDuration) || 0 } : {}),
                  ...(d.warrantyUnit !== undefined ? { warrantyUnit: d.warrantyUnit } : {})
                };
                next.jobs[jIdx] = updated;
                if (updated.linkedStockId) {
                  next.stock = next.stock.map(item => {
                    if (item.id !== updated.linkedStockId) return item;
                    if (updated.status === "Completed") return { ...item, status: "Sold", sold: Number(updated.price) || item.price || 0, linkedJobId: updated.id };
                    if (updated.status === "Cancelled") return { ...item, status: "In Stock", sold: 0, linkedJobId: "" };
                    return { ...item, status: "Pending", linkedJobId: updated.id };
                  });
                }
              }
            } else if (action.type === "DELETE_JOB") {
              const targetId = Number(d.id);
              const target = next.jobs.find(j => Number(j.id) === targetId);
              if (target) {
                next.jobs = next.jobs.filter(j => Number(j.id) !== targetId);
                next.diary = next.diary.filter(x => Number(x.job) !== targetId);
                next.tests = next.tests.filter(x => Number(x.job) !== targetId);
                if (target.linkedStockId) {
                  next.stock = next.stock.map(item =>
                    item.id === target.linkedStockId ? { ...item, status: "In Stock", sold: 0, linkedJobId: "" } : item
                  );
                }
              }
            } else if (action.type === "ADD_STOCK") {
              const isPart = d.cat === "Parts";
              if (isPart) {
                next.stock.push({
                  id: `stk-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  date: d.date || todayIso(),
                  name: d.name || "New Part",
                  cat: "Parts",
                  unitCost: Number(d.unitCost) || 0,
                  qty: Number(d.qty) || 0,
                  bought: Number(d.bought ?? d.qty) || 0,
                  low: Number(d.low) || 4,
                  link: d.link || "",
                  linkedExpenseId: ""
                });
              } else {
                next.stock.push({
                  id: `stk-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  date: d.date || todayIso(),
                  name: d.name || "Refurb Device",
                  cat: "Device",
                  deviceCost: Number(d.deviceCost) || 0,
                  partsCost: Number(d.partsCost) || 0,
                  price: Number(d.price) || 0,
                  sold: Number(d.sold) || 0,
                  status: d.status || "In Stock",
                  eta: d.eta || "",
                  link: d.link || "",
                  linkedExpenseId: "",
                  seller: d.seller || "",
                  platform: d.platform || "",
                  extOrderId: d.extOrderId || "",
                  orderBatchLabel: d.orderBatchLabel || ""
                });
              }
            } else if (action.type === "UPDATE_STOCK") {
              const sIdx = next.stock.findIndex(s =>
                (d.id && s.id === d.id) || (d.name && s.name.toLowerCase().includes(String(d.name).toLowerCase()))
              );
              if (sIdx !== -1) {
                const oldItem = next.stock[sIdx];
                next.stock[sIdx] = {
                  ...oldItem,
                  ...(d.newName !== undefined ? { name: d.newName } : {}),
                  ...(d.qty !== undefined ? { qty: Math.max(0, Number(d.qty) || 0) } : {}),
                  ...(d.qtyDelta !== undefined ? { qty: Math.max(0, Number(oldItem.qty || 0) + Number(d.qtyDelta)) } : {}),
                  ...(d.unitCost !== undefined ? { unitCost: Number(d.unitCost) || 0 } : {}),
                  ...(d.deviceCost !== undefined ? { deviceCost: Number(d.deviceCost) || 0 } : {}),
                  ...(d.partsCost !== undefined ? { partsCost: Number(d.partsCost) || 0 } : {}),
                  ...(d.price !== undefined ? { price: Number(d.price) || 0 } : {}),
                  ...(d.sold !== undefined ? { sold: Number(d.sold) || 0 } : {}),
                  ...(d.status !== undefined ? { status: d.status } : {}),
                  ...(d.seller !== undefined ? { seller: d.seller } : {}),
                  ...(d.platform !== undefined ? { platform: d.platform } : {}),
                  ...(d.extOrderId !== undefined ? { extOrderId: d.extOrderId } : {})
                };
              }
            } else if (action.type === "ADD_EXPENSE") {
              next.expenses.push({
                id: `exp-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                date: d.date || todayIso(),
                name: d.name || "Workshop Purchase",
                cat: d.cat || "Parts",
                amount: Number(d.amount) || 0,
                link: d.link || "",
                seller: d.seller || "",
                platform: d.platform || "",
                extOrderId: d.extOrderId || "",
                unitQty: Math.max(1, Number(d.unitQty) || 1)
              });
            } else if (action.type === "ADD_DIARY") {
              next.diary.push({
                job: Number(d.job) || 0,
                title: autoFormatInlineTitle(d.title || "AI Logged Note"),
                date: d.date || todayIso(),
                text: autoFormatLogText(d.text || ""),
                scheduled: d.scheduled || "",
                link: "",
                webLink: ""
              });
            } else if (action.type === "ADD_TEST") {
              next.tests.push({
                job: Number(d.job) || 0,
                date: d.date || todayIso(),
                name: autoFormatInlineTitle(d.name || "Full Controller Functional Test"),
                result: d.result || "Passed",
                notes: autoFormatLogText(d.notes || ""),
                drive: d.drive || ""
              });
            }
          }
          return next;
        };

        const handleSendAiMessage = async (text, depth) => {
          const clean = text.trim();
          if (!clean || streamingChatId || stateRef.current.settings.aiEnabled === false) return;
          const nowIso = new Date().toISOString();
          const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

          const userMsg = { id: `u-${Date.now()}`, role: "user", text: clean, timestamp: timeStr };
          const modelId = `m-${Date.now() + 1}`;
          const modelMsg = { id: modelId, role: "model", text: "", timestamp: timeStr };

          let chatId = stateRef.current.activeAiChatId;
          const existing = chatId ? (stateRef.current.aiChats || []).find(c => c.id === chatId) : null;
          const convo = [...(existing ? existing.messages.filter(m => !m.isError) : []), userMsg];

          if (existing) {
            const nextTitle = existing.title === "New Chat" || !existing.title ? clean.slice(0, 44) : existing.title;
            updateState(s => ({
              ...s,
              activeAiChatId: existing.id,
              aiChats: (s.aiChats || []).map(c => c.id === existing.id ? { ...c, title: nextTitle, updatedAt: nowIso, messages: [...c.messages.filter(m => !m.isError), userMsg, modelMsg] } : c)
            }));
          } else {
            chatId = `chat-${Date.now()}`;
            const newChat = { id: chatId, title: clean.slice(0, 44), createdAt: nowIso, updatedAt: nowIso, messages: [...convo, modelMsg] };
            updateState(s => ({ ...s, activeAiChatId: chatId, aiChats: [newChat, ...(s.aiChats || [])] }));
          }

          setStreamingChatId(chatId);
          try {
            const curState = stateRef.current;
            const apiKey = (curState.settings?.aiApiKey || "").trim();
            if (!apiKey) {
              throw new Error("No Gemini API key configured. Add your Google AI Studio API key in Tracker Settings (gear icon).");
            }
            const cur = curState.settings?.currency || "£";
            const doneJobs = curState.jobs.filter(j => j.status === "Completed");
            const grossRev = doneJobs.reduce((s, j) => s + (+j.price || 0), 0);
            const netJobPrf = doneJobs.reduce((s, j) => s + calcNet(j), 0);
            const totalExp = curState.expenses.reduce((s, e) => s + (+e.amount || 0), 0);

            const modelChain = ["gemini-4-hydrogen", "gemini-3-flash-preview", "gemini-2.5-flash"];

            const sysPrompt = [
              `You are the Second Life UK Repair Business Analyst AI embedded in Tommy Boyle's Doncaster electronics repair & controller refurbishment workshop tracker. You have FULL permission to create, edit, update, and clean up tracker records when requested.`,
              `Currency: ${cur}. Today's Date: ${todayIso()}.`,
              `KPI Snapshot: Completed Jobs=${doneJobs.length}, Gross Revenue=${fmtMoney(grossRev, cur)}, Net Job Profit=${fmtMoney(netJobPrf, cur)}, Total Logged Expenses=${fmtMoney(totalExp, cur)}, Cash Position=${fmtMoney(grossRev - totalExp, cur)}.`,
              curState.settings?.aiCustomInstructions ? `Custom Workshop Rules: ${curState.settings.aiCustomInstructions}` : "",
              `Whenever the user asks to log, edit, update, restock, complete, cancel, or delete any Job, Stock item, Expense, Diary entry, or QA Test, you MUST include a JSON block at the very end of your reply wrapped in <ACTION_JSON>...</ACTION_JSON>.`,
              `The JSON can be a single action object OR an array of action objects (if multiple changes are requested at once). Supported schemas:`,
              `1) {"type":"ADD_JOB","summary":"1-line summary","data":{"date":"YYYY-MM-DD","customer":"Name","device":"Device/Service","type":"Service|Device|Exchange|Other","status":"Pending|In Progress|Completed","deviceCost":0,"partsCost":0,"price":25,"notes":"","partName":"Optional exact stock part name","partQty":2,"hasWarranty":true,"warrantyDuration":3,"warrantyUnit":"Months"}}`,
              `2) {"type":"UPDATE_JOB","summary":"1-line summary","data":{"id":47,"status":"Completed","price":30,"notes":"Updated note","hasWarranty":true,"warrantyDuration":3,"warrantyUnit":"Months"}}`,
              `3) {"type":"DELETE_JOB","summary":"1-line summary","data":{"id":12}}`,
              `4) {"type":"ADD_STOCK","summary":"1-line summary","data":{"cat":"Parts|Device","date":"YYYY-MM-DD","name":"Item Name","unitCost":0.71,"qty":20,"low":4,"deviceCost":15,"partsCost":1.42,"price":40,"status":"Awaiting Delivery|In Stock|Pending|Sold","eta":"","seller":"","platform":"","extOrderId":""}}`,
              `5) {"type":"UPDATE_STOCK","summary":"1-line summary","data":{"name":"PS5 TMR Sticks","qtyDelta":20,"status":"In Stock","sold":35}}`,
              `6) {"type":"ADD_EXPENSE","summary":"1-line summary","data":{"date":"YYYY-MM-DD","name":"Item","cat":"Parts|Equipment|Device|General","amount":0,"link":"","seller":"","platform":"","extOrderId":"","unitQty":1}}`,
              `7) {"type":"ADD_DIARY","summary":"1-line summary","data":{"job":0,"title":"Title","date":"YYYY-MM-DD","text":"Note body","scheduled":""}}`,
              `8) {"type":"ADD_TEST","summary":"1-line summary","data":{"job":47,"date":"YYYY-MM-DD","name":"Sticks, Buttons, Triggers","result":"Passed|Failed|Partial","notes":""}}`,
              `For analytical questions, respond with sharp, practical, data-backed insights using **bold** highlights and exact numbers from the live database below.`,
              `Live Database: ${JSON.stringify({ jobs: curState.jobs, expenses: curState.expenses, stock: curState.stock, diary: curState.diary, tests: curState.tests })}`
            ].filter(Boolean).join("\n");

            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const isBusy = (status, d) => {
              const msg = (d?.error?.message || "").toLowerCase();
              return status === 429 || status === 500 || status === 503 || status === 504 ||
                d?.error?.status === "UNAVAILABLE" || d?.error?.status === "RESOURCE_EXHAUSTED" ||
                msg.includes("high demand") || msg.includes("overloaded");
            };
            let data = null;
            let lastErr = null;
            outer:
            for (let mi = 0; mi < modelChain.length; mi++) {
              const modelName = modelChain[mi];
              const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
              const genConfig = mi === 0
                ? { thinkingConfig: { thinkingLevel: depth === "deep" ? "HIGH" : "LOW" } }
                : {};
              for (let attempt = 0; attempt < 3; attempt++) {
                try {
                  const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                      systemInstruction: { parts: [{ text: sysPrompt }] },
                      contents: convo.map(m => ({ role: m.role === "model" ? "model" : "user", parts: [{ text: m.text }] })),
                      generationConfig: genConfig
                    })
                  });
                  let d = null;
                  try { d = await res.json(); } catch { d = null; }
                  if (res.ok && d?.candidates) { data = d; break outer; }
                  lastErr = d;
                  if (!isBusy(res.status, d)) {
                    if (res.status === 404 && mi < modelChain.length - 1) continue outer;
                    data = d || { error: { message: `Request failed (${res.status}).` } };
                    break outer;
                  }
                } catch (netErr) {
                  lastErr = { error: { message: netErr?.message || "Network error." } };
                }
                if (attempt < 2) await sleep(1500 * Math.pow(2, attempt));
              }
            }
            if (!data) {
              data = lastErr || { error: { message: "The AI service is busy right now. Please try again in a minute." } };
              if (isBusy(0, data)) data = { error: { message: "Gemini is under heavy load on every model I tried. Please wait a minute and resend." } };
            }
            let rawReply = (data?.candidates?.[0]?.content?.parts || []).filter(p => p.text && !p.thought).map(p => p.text).join("") || data?.error?.message || "No response returned.";
            let parsedActions = [];

            const actionMatch = rawReply.match(/<ACTION_JSON>([\s\S]*?)<\/ACTION_JSON>/);
            if (actionMatch) {
              try {
                const parsed = JSON.parse(actionMatch[1].trim());
                parsedActions = Array.isArray(parsed) ? parsed : [parsed];
                rawReply = rawReply.replace(actionMatch[0], "").trim();
              } catch {}
            }

            const combinedAction = parsedActions.length > 0
              ? {
                  type: parsedActions.length > 1 ? `${parsedActions.length} ACTIONS` : parsedActions[0].type,
                  summary: parsedActions.map(a => a.summary).filter(Boolean).join(" • "),
                  actions: parsedActions
                }
              : null;

            const shouldAutoApply = combinedAction && curState.settings?.aiAutoApply !== false;

            updateState(s => {
              let next = shouldAutoApply ? executeAiActionsOnState(s, parsedActions) : { ...s };
              next.aiChats = (next.aiChats || []).map(c =>
                c.id === chatId
                  ? {
                      ...c,
                      updatedAt: new Date().toISOString(),
                      messages: c.messages.map(m =>
                        m.id === modelId
                          ? {
                              ...m,
                              text: rawReply,
                              proposedAction: combinedAction,
                              actionApplied: !!shouldAutoApply,
                              isError: !data?.candidates
                            }
                          : m
                      )
                    }
                  : c
              );
              return next;
            }, true);
          } catch (err) {
            updateState(s => ({
              ...s,
              aiChats: (s.aiChats || []).map(c =>
                c.id === chatId
                  ? { ...c, messages: c.messages.map(m => (m.id === modelId ? { ...m, text: err?.message || "AI request failed.", isError: true } : m)) }
                  : c
              )
            }));
          } finally {
            setStreamingChatId(null);
          }
        };

        const handleApplyAiAction = (chatId, msgId, actionWrapper) => {
          if (!actionWrapper) return;
          const list = Array.isArray(actionWrapper.actions) ? actionWrapper.actions : [actionWrapper];
          updateState(prev => {
            const next = executeAiActionsOnState(prev, list);
            next.aiChats = (next.aiChats || []).map(c =>
              c.id === chatId
                ? { ...c, messages: c.messages.map(m => (m.id === msgId ? { ...m, actionApplied: true } : m)) }
                : c
            );
            return next;
          }, true);
        };

        return (
          <Fragment>
            <AuroraCanvas accent={accentKey} />
            <LockScreen
              unlocked={unlocked}
              onUnlock={() => {
                try { window.sessionStorage.setItem(UNLOCK_KEY, "true"); } catch {}
                setUnlocked(true);
              }}
            />
            <div aria-hidden={!unlocked} style={unlocked ? undefined : { visibility: "hidden", pointerEvents: "none" }}>
              <Header
                state={state}
                tab={tab}
                searchQuery={searchQuery}
                cloudStatus={cloudStatus}
                manualSaveFeedback={manualSaved}
                onSelectTab={switchTab}
                onSearchChange={setSearchQuery}
                onManualSave={() => void persistState(state, true)}
                onLock={() => {
                  try { window.sessionStorage.removeItem(UNLOCK_KEY); } catch {}
                  setUnlocked(false);
                }}
                onOpenSettings={mode =>
                  mode === "toggleAutoApply"
                    ? updateState(s => ({ ...s, settings: { ...s.settings, aiAutoApply: s.settings.aiAutoApply === false } }))
                    : setSettingsOpen(true)
                }
                onPrimaryAction={handlePrimaryAction}
              />

              <main>
                <div id="v" ref={viewRef}>
                  {tab === "jobs" && (
                    <JobsView
                      state={state}
                      searchQuery={searchQuery}
                      onSortChange={order => updateState(s => ({ ...s, settings: { ...s.settings, sortOrder: order } }))}
                      onCycleStatus={handleCycleStatus}
                      onJumpToDiary={id => { setTab("diary"); setSearchQuery("#" + id); setAnimTick(c => c + 1); }}
                      onDeleteJob={handleDeleteJob}
                      onOpenJobModal={idx => setInspectJobIdx(idx)}
                      onOpenReceipt={idx => setReceiptJobIdx(idx)}
                    />
                  )}
                  {tab === "dash" && <StatsView state={state} />}
                  {tab === "tax" && <TaxView state={state} searchQuery={searchQuery} onExportHmrcCsv={exportHmrcCsv} />}
                  {tab === "exp" && (
                    <ExpensesView
                      state={state}
                      searchQuery={searchQuery}
                      onAddDevicePurchase={() => setEntityModal({ kind: "exp", index: null, presetCat: "Device" })}
                      onEditExpense={idx => setEntityModal({ kind: "exp", index: idx, presetCat: null })}
                      onDeleteExpense={idx => handleDeleteEntity("exp", idx)}
                      onInspectLinkedStock={devName => { setTab("stock"); setSearchQuery(devName); setAnimTick(c => c + 1); }}
                      onInspectDeviceExpense={idx => setInspectDeviceExpIdx(idx)}
                      onRenameSeller={oldSeller => {
                        const isUnassigned = oldSeller === "Unassigned / Direct";
                        setPromptModal({
                          message: isUnassigned
                            ? "Assign a seller name to all unassigned device orders:"
                            : `Rename seller "${oldSeller}" across all device orders & linked stock:`,
                          initialValue: isUnassigned ? "" : oldSeller,
                          inputType: "text",
                          placeholder: "Enter seller name...",
                          onConfirm: newVal => {
                            const trimmed = String(newVal ?? "").trim();
                            if (!trimmed || (!isUnassigned && trimmed === oldSeller)) return;
                            updateState(prev => {
                              const matchesOld = s => {
                                const norm = (s || "").trim();
                                return isUnassigned ? norm === "" : norm === oldSeller;
                              };
                              const expenses = prev.expenses.map(e =>
                                (e.cat || "").trim() === "Device" && matchesOld(e.seller)
                                  ? { ...e, seller: trimmed }
                                  : e
                              );
                              const stock = prev.stock.map(s =>
                                s.cat !== "Parts" && matchesOld(s.seller)
                                  ? { ...s, seller: trimmed }
                                  : s
                              );
                              return { ...prev, expenses, stock };
                            });
                          }
                        });
                      }}
                    />
                  )}
                  {tab === "stock" && (
                    <StockView
                      state={state}
                      searchQuery={searchQuery}
                      onEditStock={idx => {
                        const item = state.stock[idx];
                        if (item) {
                          setEntityModal({
                            kind: item.cat === "Parts" ? "stock-part" : (item.status === "Awaiting Delivery" ? "stock-delivery" : "stock-device"),
                            index: idx,
                            presetCat: null
                          });
                        }
                      }}
                      onDeleteStock={idx => handleDeleteEntity("stock", idx)}
                      onAdjustQty={(idx, delta) => {
                        updateState(prev => {
                          const stock = [...prev.stock];
                          const target = stock[idx];
                          if (!target) return prev;
                          stock[idx] = { ...target, qty: Math.max(0, Number(target.qty ?? 0) + delta) };
                          return { ...prev, stock };
                        });
                      }}
                      onSetDeviceStatus={(idx, newSt) => {
                        const item = state.stock[idx];
                        if (!item) return;
                        const cur = state.settings.currency || "£";
                        if (newSt === "Sold") {
                          setPromptModal({
                            message: `Enter actual sold price (${cur}):`,
                            initialValue: item.sold && item.sold > 0 ? item.sold : item.price || 0,
                            onConfirm: val => {
                              updateState(prev => {
                                const stock = [...prev.stock];
                                if (stock[idx]) stock[idx] = { ...stock[idx], status: "Sold", sold: Number(val) || 0 };
                                return { ...prev, stock };
                              });
                            }
                          });
                        } else {
                          updateState(prev => {
                            const stock = [...prev.stock];
                            if (stock[idx]) stock[idx] = { ...stock[idx], status: newSt, sold: 0 };
                            return { ...prev, stock };
                          });
                        }
                      }}
                      onToggleHideSold={() => updateState(s => ({ ...s, settings: { ...s.settings, hideSold: !s.settings.hideSold } }))}
                      onAddDeliveryDevice={() => setEntityModal({ kind: "stock-delivery", index: null, presetCat: null })}
                      onJumpToExpense={expName => { setTab("exp"); setSearchQuery(expName); setAnimTick(c => c + 1); }}
                      onJumpToJob={jobId => { setTab("jobs"); setSearchQuery("#" + jobId); setAnimTick(c => c + 1); }}
                    />
                  )}
                  {tab === "diary" && (
                    <DiaryView
                      state={state}
                      searchQuery={searchQuery}
                      onEditDiary={idx => setEntityModal({ kind: "diary", index: idx, presetCat: null })}
                      onDeleteDiary={idx => handleDeleteEntity("diary", idx)}
                      onOpenInvoice={(url, customerName, jobId) => setInvoiceModal({ url, customerName, jobId })}
                    />
                  )}
                  {tab === "tests" && (
                    <TestingView
                      state={state}
                      searchQuery={searchQuery}
                      onEditTest={idx => setEntityModal({ kind: "tests", index: idx, presetCat: null })}
                      onDeleteTest={idx => handleDeleteEntity("tests", idx)}
                    />
                  )}
                  {tab === "diag" && (
                    <DeviceDiagnosticsView
                      state={state}
                      onSaveTestResult={newTest => {
                        const formattedTest = {
                          ...newTest,
                          name: autoFormatInlineTitle(newTest.name || ""),
                          notes: autoFormatLogText(newTest.notes || "")
                        };
                        updateState(prev => ({
                          ...prev,
                          tests: [...prev.tests, formattedTest]
                        }), true);
                      }}
                    />
                  )}
                  {tab === "ai" && (
                    <AIView
                      state={state}
                      streamingChatId={streamingChatId}
                      onSendMessage={handleSendAiMessage}
                      onSelectChat={id => updateState(s => ({ ...s, activeAiChatId: id }))}
                      onNewChat={createFreshAiChat}
                      onDeleteChat={id => updateState(s => ({ ...s, aiChats: (s.aiChats || []).filter(c => c.id !== id), activeAiChatId: s.activeAiChatId === id ? null : s.activeAiChatId }))}
                      onOpenSettings={mode =>
                        mode === "toggleAutoApply"
                          ? updateState(s => ({ ...s, settings: { ...s.settings, aiAutoApply: s.settings.aiAutoApply === false } }))
                          : setSettingsOpen(true)
                      }
                      onApplyAiAction={handleApplyAiAction}
                    />
                  )}
                </div>
              </main>
            </div>

            <input
              ref={fileInputRef}
              type="file"
              accept=".json"
              hidden
              onChange={e => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                  try {
                    const parsed = JSON.parse(String(reader.result));
                    if (!parsed.jobs || !Array.isArray(parsed.jobs)) throw new Error("Invalid backup file format");
                    const normExpenses = normalizeExpenseIds(parsed.expenses || []);
                    const normStock = normalizeStockIds(parsed.stock || [], normExpenses);
                    const next = {
                      ...DEFAULT_STATE,
                      ...parsed,
                      settings: { ...DEFAULT_STATE.settings, ...(parsed.settings || {}) },
                      stock: normStock,
                      expenses: normExpenses,
                      aiChats: Array.isArray(parsed.aiChats) ? parsed.aiChats : [],
                      activeAiChatId: typeof parsed.activeAiChatId === "string" ? parsed.activeAiChatId : null
                    };
                    setState(next);
                    persistState(next, true);
                    setSettingsOpen(false);
                  } catch (err) {
                    setPromptModal({ message: "Error importing file: " + (err?.message || "Invalid JSON"), onConfirm: () => {} });
                  }
                };
                reader.readAsText(file);
                e.target.value = "";
              }}
            />

            <DeviceExpenseDetailModal
              expIndex={inspectDeviceExpIdx}
              state={state}
              onClose={() => setInspectDeviceExpIdx(null)}
              onEditExpense={idx => setEntityModal({ kind: "exp", index: idx, presetCat: null })}
              onDeleteExpense={idx => handleDeleteEntity("exp", idx)}
              onInspectLinkedStock={devName => { setTab("stock"); setSearchQuery(devName); setAnimTick(c => c + 1); }}
            />

            <ReceiptModal
              jobIndex={receiptJobIdx}
              state={state}
              onClose={() => setReceiptJobIdx(null)}
            />

            <JobInspectModal
              jobIndex={inspectJobIdx}
              state={state}
              onClose={() => setInspectJobIdx(null)}
              onEdit={idx => setEditJobModal({ open: true, index: idx })}
              onOpenInvoice={(url, customerName, jobId) => setInvoiceModal({ url, customerName, jobId })}
              onOpenReceipt={idx => setReceiptJobIdx(idx)}
            />

            <JobEditModal
              open={editJobModal.open}
              jobIndex={editJobModal.index}
              state={state}
              onClose={() => setEditJobModal({ open: false, index: null })}
              onSaveJob={(savedJob, editIdx, deductions) => {
                updateState(prev => {
                  const prevJob = editIdx !== null ? prev.jobs[editIdx] : null;
                  let stock = prev.stock.map(s => ({ ...s }));

                  deductions.forEach(d => {
                    const stItem = stock[d.stockIdx];
                    if (stItem && stItem.qty != null) {
                      stItem.qty = Math.max(0, Number(stItem.qty ?? 0) - d.qtyUsed);
                    }
                  });

                  if (prevJob?.linkedStockId && prevJob.linkedStockId !== savedJob.linkedStockId) {
                    stock = stock.map(s =>
                      s.id === prevJob.linkedStockId ? { ...s, status: "In Stock", sold: 0, linkedJobId: "" } : s
                    );
                  }

                  if (savedJob.linkedStockId) {
                    stock = stock.map(s => {
                      if (s.id !== savedJob.linkedStockId) return s;
                      if (savedJob.status === "Completed") {
                        return { ...s, status: "Sold", sold: Number(savedJob.price) || s.price || 0, linkedJobId: savedJob.id };
                      }
                      if (savedJob.status === "Cancelled") {
                        return { ...s, status: "In Stock", sold: 0, linkedJobId: "" };
                      }
                      return { ...s, status: "Pending", linkedJobId: savedJob.id };
                    });
                  }

                  const jobs = [...prev.jobs];
                  if (editIdx === null) jobs.push(savedJob);
                  else jobs[editIdx] = savedJob;

                  return { ...prev, jobs, stock };
                });
                setEditJobModal({ open: false, index: null });
              }}
              onRequestDelete={handleDeleteJob}
              onOpenInvoice={(url, customerName, jobId) => setInvoiceModal({ url, customerName, jobId })}
            />

            <StockPickerModal
              open={stockPickerOpen}
              onClose={() => setStockPickerOpen(false)}
              onPickPart={() => { setStockPickerOpen(false); setEntityModal({ kind: "stock-part", index: null, presetCat: null }); }}
              onPickDevice={() => { setStockPickerOpen(false); setEntityModal({ kind: "stock-device", index: null, presetCat: null }); }}
              onPickDelivery={() => { setStockPickerOpen(false); setEntityModal({ kind: "stock-delivery", index: null, presetCat: null }); }}
            />

            <EntityEditModal
              kind={entityModal.kind}
              editIndex={entityModal.index}
              presetCat={entityModal.presetCat}
              state={state}
              onClose={() => setEntityModal({ kind: null, index: null, presetCat: null })}
              onSaveEntity={(kind, cleanObj, editIdx, extraOptions) => {
                updateState(prev => {
                  if (kind === "exp") {
                    const expenses = [...prev.expenses];
                    if (editIdx === null) expenses.push(cleanObj);
                    else expenses[editIdx] = cleanObj;

                    let stock = [...prev.stock];

                    if (editIdx !== null && cleanObj.id) {
                      stock = stock.map(s =>
                        s.linkedExpenseId === cleanObj.id
                          ? {
                              ...s,
                              seller: cleanObj.seller || s.seller || "",
                              platform: cleanObj.platform || s.platform || "",
                              extOrderId: cleanObj.extOrderId || s.extOrderId || ""
                            }
                          : s
                      );
                    }

                    if (extraOptions?.autoSplitStock && cleanObj.cat === "Device") {
                      const qty = Math.max(1, Number(cleanObj.unitQty) || 1);
                      const unitDeviceCost = Number(((Number(cleanObj.amount) || 0) / qty).toFixed(2));
                      const unitPartsCost = Number(extraOptions.stockPartsCost) || 0;
                      const estResale = Number(extraOptions.stockEstPrice) || 35;

                      const cleanedTitle = (cleanObj.name || "")
                        .replace(/^\d+\s*x\s+/i, "")
                        .replace(/\s*x\d+\b/i, "")
                        .replace(/\s[-–—]\s[A-Z][a-zA-Z0-9\s.'-]{1,28}$/, "")
                        .trim();
                      const baseTitle = cleanedTitle || (cleanObj.seller ? `${cleanObj.seller} Device` : "Sourced Device");

                      const nowBase = Date.now();
                      const newCards = [];
                      for (let u = 0; u < qty; u++) {
                        const batchLabel = qty > 1 ? `Unit ${u + 1}/${qty}` : "";
                        newCards.push({
                          id: `stk-${nowBase}-${u + 1}-${Math.random().toString(36).slice(2, 5)}`,
                          date: cleanObj.date || todayIso(),
                          name: qty > 1 ? `${baseTitle} (${batchLabel})` : baseTitle,
                          cat: "Device",
                          deviceCost: unitDeviceCost,
                          partsCost: unitPartsCost,
                          price: estResale,
                          predicted: estResale,
                          sold: 0,
                          status: extraOptions.stockInitStatus || "In Stock",
                          eta: "",
                          link: cleanObj.link || "",
                          linkedExpenseId: cleanObj.id,
                          seller: cleanObj.seller || "",
                          platform: cleanObj.platform || "",
                          extOrderId: cleanObj.extOrderId || "",
                          orderBatchLabel: batchLabel
                        });
                      }
                      stock = [...stock, ...newCards];
                    }

                    return { ...prev, expenses, stock };
                  }
                  if (kind === "diary") {
                    const diary = [...prev.diary];
                    if (editIdx === null) diary.push(cleanObj);
                    else diary[editIdx] = cleanObj;
                    return { ...prev, diary };
                  }
                  if (kind === "tests") {
                    const tests = [...prev.tests];
                    if (editIdx === null) tests.push(cleanObj);
                    else tests[editIdx] = cleanObj;
                    return { ...prev, tests };
                  }
                  const stock = [...prev.stock];
                  if (editIdx === null) stock.push(cleanObj);
                  else stock[editIdx] = cleanObj;
                  return { ...prev, stock };
                });
                setEntityModal({ kind: null, index: null, presetCat: null });
              }}
              onRequestDelete={handleDeleteEntity}
            />

            <InvoiceModal invoice={invoiceModal} onClose={() => setInvoiceModal(null)} />

            <SettingsModal
              open={settingsOpen}
              state={state}
              tempMobileMode={tempMobileMode}
              cloudStatus={cloudStatus}
              onClose={() => { persistState(stateRef.current, true); setSettingsOpen(false); }}
              onUpdateSettings={patch => updateState(s => ({ ...s, settings: { ...s.settings, ...patch } }))}
              onSyncNow={() => void persistState(stateRef.current, true)}
              onToggleMobileMode={setTempMobileMode}
              onExportJson={() => {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
                a.download = `second-life-uk-tracker-backup-${todayIso()}.json`;
                a.click();
              }}
              onImportJsonClick={() => fileInputRef.current?.click()}
              onResetDefault={() => {
                setPromptModal({
                  message: "Reset all records back to default demo data?",
                  onConfirm: () => {
                    const next = JSON.parse(JSON.stringify(DEFAULT_STATE));
                    next.expenses = normalizeExpenseIds(next.expenses);
                    next.stock = normalizeStockIds(next.stock, next.expenses);
                    setState(next);
                    persistState(next, true);
                    setSettingsOpen(false);
                  }
                });
              }}
            />

            <ConfirmPromptModal prompt={promptModal} onClose={() => setPromptModal(null)} />
          </Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
