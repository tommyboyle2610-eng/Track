              if (typeof act.reset === "function") await act.reset();
              else if (typeof act.playEffect === "function") {
                await act.playEffect("dual-rumble", { startDelay: 0, duration: 10, weakMagnitude: 0, strongMagnitude: 0 });
              }
              setHapticMsg("Motors stopped.");
            } catch {
              setHapticMsg("Motors stopped.");
            }
            return;
          }

          setActiveHaptic(mode);
          try {
            if (mode === "left" || mode === "right" || mode === "both") {
              const ok = await runGamePadActuatorEffect(act, {
                duration,
                strongMagnitude: mode === "left" || mode === "both" ? strength : 0,
                weakMagnitude: mode === "right" || mode === "both" ? strength : 0
              });
              if (!ok) {
                setHapticMsg("Haptic effect not supported on this browser/controller.");
              } else {
                const label = mode === "left" ? "Left Strong Motor" : mode === "right" ? "Right Weak Motor" : "Dual Motors";
                setHapticMsg(`Tested ${label} at ${Math.round(strength * 100)}%`);
              }
            } else if (mode === "lt" || mode === "rt") {
              await runGamePadActuatorEffect(act, {
                duration,
                leftTrigger: mode === "lt" ? strength : 0,
                rightTrigger: mode === "rt" ? strength : 0
              });
              setHapticMsg(`Tested ${mode === "lt" ? "Left Trigger (LT)" : "Right Trigger (RT)"} haptics at ${Math.round(strength * 100)}%`);
            }
          } catch (err) {
            setHapticMsg(err?.message || "Haptic effect not supported on this browser/controller.");
          } finally {
            hapticCleanupTimerRef.current = setTimeout(() => setActiveHaptic(cur => (cur === mode ? "" : cur)), duration);
          }
        };

        useEffect(() => {
          let rafId = 0;
          let paused = document.hidden;
          const onVis = () => { paused = document.hidden; };
          document.addEventListener("visibilitychange", onVis);

          const TRAIL_LIFE = 550;
          const stepViz = (v, x, y, now) => {
            const k = 0.45;
            v.sx += (x - v.sx) * k;
            v.sy += (y - v.sy) * k;
            if (Math.hypot(v.sx, v.sy) > 0.08) {
              const last = v.trail[v.trail.length - 1];
              if (!last || Math.hypot(v.sx - last.x, v.sy - last.y) > 0.035) {
                v.trail.push({ x: v.sx, y: v.sy, t: now, err: Math.abs(Math.hypot(v.sx, v.sy) - 1) * 100 });
                if (v.trail.length > 60) v.trail.shift();
              }
            }
            while (v.trail.length && now - v.trail[0].t > TRAIL_LIFE) v.trail.shift();
          };

          const drawStickCanvas = (canvas, viz, samples, circErr, now) => {
            if (!canvas) return;
            const x = viz.sx;
            const y = viz.sy;
            const S = 164;
            const dpr = Math.min(1.5, window.devicePixelRatio || 1);
            if (canvas.width !== Math.round(S * dpr)) {
              canvas.width = Math.round(S * dpr);
              canvas.height = Math.round(S * dpr);
              canvas.style.width = `${S}px`;
              canvas.style.height = `${S}px`;
            }
            const ctx = canvas.getContext("2d");
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const cx = S / 2;
            const cy = S / 2;
            const rad = S * 0.4;
            const TAU = Math.PI * 2;
            ctx.clearRect(0, 0, S, S);
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            ctx.strokeStyle = "rgba(148, 163, 184, 0.2)";
            ctx.lineWidth = 1;
            [0.25, 0.5, 0.75].forEach(f => {
              ctx.beginPath();
              ctx.arc(cx, cy, rad * f, 0, TAU);
              ctx.stroke();
            });
            ctx.beginPath();
            ctx.moveTo(cx - rad, cy); ctx.lineTo(cx + rad, cy);
            ctx.moveTo(cx, cy - rad); ctx.lineTo(cx, cy + rad);
            ctx.stroke();

            const SECT = 36;
            const covered = new Array(SECT).fill(false);
            for (let i = 0; i < samples.length; i++) {
              const pt = samples[i];
              const ang = Math.atan2(pt.y, pt.x) + Math.PI;
              covered[Math.min(SECT - 1, Math.floor((ang / TAU) * SECT))] = true;
            }
            const covCount = covered.filter(Boolean).length;
            const ringR = rad + 10;
            ctx.lineWidth = 3.5;
            for (let i = 0; i < SECT; i++) {
              const a0 = (i / SECT) * TAU - Math.PI + 0.025;
              const a1 = ((i + 1) / SECT) * TAU - Math.PI - 0.025;
              ctx.strokeStyle = covered[i] ? "rgba(0, 255, 136, 0.9)" : "rgba(148, 163, 184, 0.16)";
              ctx.beginPath();
              ctx.arc(cx, cy, ringR, a0, a1);
              ctx.stroke();
            }

            ctx.strokeStyle = "rgba(0, 255, 136, 0.55)";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(cx, cy, rad, 0, TAU);
            ctx.stroke();

            const tr = viz.trail;
            if (tr.length > 1) {
              const errColor = (err, a) =>
                err <= 5 ? `rgba(0, 255, 136, ${a})` : err <= 10 ? `rgba(250, 204, 21, ${a})` : `rgba(244, 63, 94, ${a})`;
              for (let i = 1; i < tr.length; i++) {
                const life = 1 - (now - tr[i].t) / TRAIL_LIFE;
                if (life <= 0) continue;
                const a = Math.pow(life, 1.3);
                const x0 = cx + tr[i - 1].x * rad;
                const y0 = cy + tr[i - 1].y * rad;
                const x1 = cx + tr[i].x * rad;
                const y1 = cy + tr[i].y * rad;
                ctx.strokeStyle = errColor(tr[i].err, 0.85 * a);
                ctx.lineWidth = 1.2 + a * 2.2;
                ctx.beginPath();
                ctx.moveTo(x0, y0);
                ctx.lineTo(x1, y1);
                ctx.stroke();
              }
            }

            const dotX = cx + x * rad;
            const dotY = cy + y * rad;
            const mag = Math.hypot(x, y);
            if (mag > 0.03) {
              ctx.strokeStyle = "rgba(0, 255, 136, 0.85)";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(cx, cy);
              ctx.lineTo(dotX, dotY);
              ctx.stroke();
            }

            ctx.fillStyle = "#00ff88";
            ctx.beginPath();
            ctx.arc(dotX, dotY, 5.5, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.6;
            ctx.stroke();

            ctx.fillStyle = "rgba(148, 163, 184, 0.85)";
            ctx.font = "600 9px 'JetBrains Mono', monospace";
            ctx.textAlign = "left";
            ctx.fillText(`${Math.round((covCount / SECT) * 100)}% rim`, 4, S - 4);
          };

          const pollGamepad = () => {
            rafId = requestAnimationFrame(pollGamepad);
            if (paused) return;

            const gps = navigator.getGamepads ? navigator.getGamepads() : [];
            const active = Array.from(gps || []).find(g => g && g.connected);

            if (active) {
              activeGamepadIdxRef.current = active.index;
              setPadInfo(prev => (prev?.id === active.id ? prev : { id: active.id, buttons: active.buttons.length, axes: active.axes.length }));
              const lx = Number((active.axes[0] || 0).toFixed(4));
              const ly = Number((active.axes[1] || 0).toFixed(4));
              const rx = Number((active.axes[2] || 0).toFixed(4));
              const ry = Number((active.axes[3] || 0).toFixed(4));

              const lMag = Math.hypot(lx, ly);
              const rMag = Math.hypot(rx, ry);
              const store = telemetryRef.current;

              if (lMag > 0.75) {
                store.leftSamples.push({ x: lx, y: ly, err: Math.abs(lMag - 1) * 100 });
                if (store.leftSamples.length > 220) store.leftSamples.shift();
              }
              if (rMag > 0.75) {
                store.rightSamples.push({ x: rx, y: ry, err: Math.abs(rMag - 1) * 100 });
                if (store.rightSamples.length > 220) store.rightSamples.shift();
              }

              const leftCircErr = store.leftSamples.length
                ? store.leftSamples.reduce((s, p) => s + p.err, 0) / store.leftSamples.length
                : 0;
              const rightCircErr = store.rightSamples.length
                ? store.rightSamples.reduce((s, p) => s + p.err, 0) / store.rightSamples.length
                : 0;

              const avgCircErr = (store.leftSamples.length && store.rightSamples.length)
                ? (leftCircErr + rightCircErr) / 2
                : (store.leftSamples.length ? leftCircErr : rightCircErr);

              const leftCenterErr = lMag < 0.25 ? lMag * 100 : 0;
              const rightCenterErr = rMag < 0.25 ? rMag * 100 : 0;

              const l2 = active.buttons[6]?.value ?? 0;
              const r2 = active.buttons[7]?.value ?? 0;
              if (l2 > store.l2Peak) store.l2Peak = l2;
              if (r2 > store.r2Peak) store.r2Peak = r2;

              const isXboxPad = /xbox|xinput|045e|microsoft/i.test(active.id || "");
              const BTN_NAMES = isXboxPad
                ? ["A", "B", "X", "Y", "LB", "RB", "LT", "RT", "View", "Menu", "LS", "RS", "D-Up", "D-Down", "D-Left", "D-Right", "Xbox", "Share"]
                : ["Cross", "Circle", "Square", "Triangle", "L1", "R1", "L2", "R2", "Create", "Options", "L3", "R3", "D-Up", "D-Down", "D-Left", "D-Right", "PS", "Touchpad", "Mic Mute"];

              const pressedNow = [];
              const activeIndices = [];
              active.buttons.forEach((b, idx) => {
                if (b.pressed || b.value > 0.2) {
                  store.buttonsTested.add(idx);
                  activeIndices.push(idx);
                  pressedNow.push(BTN_NAMES[idx] || `B${idx}`);
                }
              });

              const currentTouches = !isXboxPad ? (hidTouchRef.current.touches || []) : [];
              if (!isXboxPad && hidMutePressedRef.current && !activeIndices.includes(18)) {
                store.buttonsTested.add(18);
                activeIndices.push(18);
                pressedNow.push("Mic Mute");
              }
              if (!isXboxPad && (hidTouchRef.current.click || currentTouches.length > 0) && !activeIndices.includes(17)) {
                store.buttonsTested.add(17);
                activeIndices.push(17);
                pressedNow.push(hidTouchRef.current.click ? "Touchpad Click" : `Touchpad (${currentTouches.length}F)`);
              }

              const nowTs = performance.now();
              stepViz(vizRef.current.L, lx, ly, nowTs);
              stepViz(vizRef.current.R, rx, ry, nowTs);
              drawStickCanvas(leftCanvasRef.current, vizRef.current.L, store.leftSamples, leftCircErr, nowTs);
              drawStickCanvas(rightCanvasRef.current, vizRef.current.R, store.rightSamples, rightCircErr, nowTs);

              setMetrics({
                lx, ly, rx, ry,
                l2, r2,
                leftCircErr,
                rightCircErr,
                avgCircErr,
                leftCenterErr,
                rightCenterErr,
                buttonsCount: store.buttonsTested.size,
                activeButtons: pressedNow,
                activeIndices,
                testedIndices: Array.from(store.buttonsTested),
                touches: currentTouches
              });
            } else {
              activeGamepadIdxRef.current = null;
              setPadInfo(null);
              const nowTs = performance.now();
              stepViz(vizRef.current.L, 0, 0, nowTs);
              stepViz(vizRef.current.R, 0, 0, nowTs);
              drawStickCanvas(leftCanvasRef.current, vizRef.current.L, [], 0, nowTs);
              drawStickCanvas(rightCanvasRef.current, vizRef.current.R, [], 0, nowTs);
            }
          };

          rafId = requestAnimationFrame(pollGamepad);
          return () => {
            cancelAnimationFrame(rafId);
            document.removeEventListener("visibilitychange", onVis);
            if (hapticCleanupTimerRef.current) clearTimeout(hapticCleanupTimerRef.current);
          };
        }, []);

        const shareAutoVerified = activeLayout === "xbox";
        const verifiedCount = metrics.buttonsCount + (shareAutoVerified && !metrics.testedIndices.includes(17) ? 1 : 0);

        const handleLogBenchmark = () => {
          const ctrlLabel = activeLayout === "xbox" ? "Xbox Controller" : "DualSense Controller";
          const summaryName = `${ctrlLabel} Bench QA (Avg Error: ${metrics.avgCircErr.toFixed(1)}% | L: ${metrics.leftCircErr.toFixed(1)}%, R: ${metrics.rightCircErr.toFixed(1)}%)`;
          const formattedTechNotes = testNotes.trim() ? autoFormatLogText(testNotes) : "";
          const autoNotes = [
            `**Live USB Diagnostics Report (${ctrlLabel})**`,
            `• Overall Average Circularity Error: **${metrics.avgCircErr.toFixed(2)}%**`,
            `• Left Stick Center Drift: **${metrics.leftCenterErr.toFixed(2)}%** | Circularity Error: **${metrics.leftCircErr.toFixed(2)}%**`,
            `• Right Stick Center Drift: **${metrics.rightCenterErr.toFixed(2)}%** | Circularity Error: **${metrics.rightCircErr.toFixed(2)}%**`,
            `• Verified Inputs: **${verifiedCount} buttons** + analog triggers`,
            activeLayout === "dualsense" && micVerified ? "• Microphone Test: **Passed** (live signal detected)" : null,
            formattedTechNotes ? `• Tech Notes: ${formattedTechNotes}` : null
          ].filter(Boolean).join("\n");

          const passed = metrics.leftCircErr <= 9.5 && metrics.rightCircErr <= 9.5 && metrics.leftCenterErr <= 4 && metrics.rightCenterErr <= 4;
          onSaveTestResult({
            job: Number(selectedJobId) || 0,
            date: todayIso(),
            name: summaryName,
            result: passed ? "Passed" : "Partial",
            notes: autoNotes,
            drive: ""
          });
          setSavedBanner(true);
          setTimeout(() => setSavedBanner(false), 3000);
          jobPickedRef.current = false;
          setSelectedJobId(newestJobId);
        };

        const btnVisual = idx => {
          const isActive = metrics.activeIndices.includes(idx);
          const isTested = metrics.testedIndices.includes(idx) || (shareAutoVerified && idx === 17);
          if (isActive) {
            return {
              fill: "#00ff88",
              stroke: "#ffffff",
              strokeWidth: 2.2,
              textFill: "#030705"
            };
          }
          if (isTested) {
            return {
              fill: "#07140d",
              stroke: "rgba(0, 255, 136, 0.45)",
              strokeWidth: 1.8,
              textFill: "rgba(0, 255, 136, 0.72)"
            };
          }
          return {
            fill: "rgba(255, 255, 255, 0.04)",
            stroke: "var(--ac)",
            strokeWidth: 2,
            textFill: "rgba(226, 232, 240, 0.75)"
          };
        };

        const totalTargetInputs = activeLayout === "xbox" ? 18 : 19;
        const testedPct = Math.min(100, Math.round((verifiedCount / totalTargetInputs) * 100));
        const shownPct = useTweenedNumber(testedPct, 600);

        return (
          <Fragment>
            <div className="ah" style={{ marginTop: 0, marginBottom: 16 }}>
              <div className="ph" style={{ margin: 0 }}>
                <h2><span className="gradient-emerald-text">Hardware Bench &amp; Controller Diagnostics</span></h2>
                <p>Plug in a controller and press any button. Test inputs on the map, then check sticks, haptics and mic.</p>
              </div>
              <div className="diag-toolbar">
                <div className="seg" style={{ padding: 3, borderRadius: 9999 }}>
                  {[
                    ["auto", `Auto (${detectedType === "xbox" ? "Xbox" : "PS5"})`],
                    ["dualsense", "DualSense"],
                    ["xbox", "Xbox"]
                  ].map(([k, lbl]) => (
                    <button
                      key={k}
                      type="button"
                      className={layoutOverride === k ? "on" : ""}
                      style={{ padding: "5px 12px", fontSize: 11, borderRadius: 9999 }}
                      onClick={() => setLayoutOverride(k)}
                    >
                      {lbl}
                    </button>
                  ))}
                </div>
                {activeLayout === "dualsense" && (
                  <button
                    type="button"
                    className={`b${hidDeviceInfo ? " on" : " pri"}`}
                    onClick={connectDualSenseHid}
                    title="Connect DualSense via WebHID to unlock vibration motors, adaptive haptic triggers & Mic Mute detection"
                  >
                    <Icon name="link" size={13} /> {hidDeviceInfo ? "DualSense HID Linked" : "Connect DualSense WebHID"}
                  </button>
                )}
                {activeLayout === "dualsense" && hidBlocked && !hidDeviceInfo && (
                  <button
                    type="button"
                    className="b pri"
                    onClick={openFullTab}
                    title="Google Sites blocks WebHID inside embedded pages. Open the tracker in its own tab to connect the DualSense."
                  >
                    <Icon name="link" size={13} /> Open Full Tab
                  </button>
                )}
                {activeLayout === "dualsense" && hidBlocked && !hidDeviceInfo && (
                  <small style={{ color: "var(--wn, #f5a623)", flexBasis: "100%" }}>
                    WebHID is blocked inside Google Sites embeds. Open the hosted tracker directly (not embedded) to use motors, triggers &amp; calibration.
                  </small>
                )}
                <span className={`chip ${padInfo ? "Completed" : "Pending"}`}>
                  <Icon name="gamepad" size={13} /> {padInfo ? "USB / BT Live" : "Waiting for Controller…"}
                </span>
                <button type="button" className="b" onClick={resetBench}>
                  <Icon name="undo" size={14} /> Reset Bench
                </button>
              </div>
            </div>

            {(() => {
              const stickOk = metrics.avgCircErr <= 7.5;
              const allDone = verifiedCount >= totalTargetInputs;
              const verdict = !padInfo ? ["Waiting", ""] : (stickOk && allDone) ? ["PASS", "ok"] : !stickOk ? ["CHECK STICKS", "warn"] : ["IN PROGRESS", ""];
              const tile = (label, value, cls) => (
                <div className={`diag-kpi ${cls || ""}`}><small>{label}</small><b>{value}</b></div>

              return (
                <div className="diag-kpis">
                  {tile("Bench Verdict", verdict[0], `verdict ${verdict[1]}`)}
                  {tile("Inputs Verified", `${verifiedCount}/${totalTargetInputs}`, allDone ? "ok" : "")}
                  {tile("Left Stick Error", `${metrics.leftCircErr.toFixed(1)}%`, metrics.leftCircErr <= 7.5 ? "ok" : "warn")}
                  {tile("Right Stick Error", `${metrics.rightCircErr.toFixed(1)}%`, metrics.rightCircErr <= 7.5 ? "ok" : "warn")}
                </div>
              );
            })()}

            <div className="diag-studio-grid">
              <div className="diag-stage-card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
                  <div>
                    <h3 style={{ color: "var(--ac)" }}>
                      {activeLayout === "xbox" ? "Xbox Series X|S Input Map" : "PS5 DualSense Input Map"}
                    </h3>
                    <small style={{ color: "var(--mu)", fontSize: 11.5 }}>
                      {padInfo ? padInfo.id : "Plug in via USB & press any button to wake sensors"}
                    </small>
                  </div>
                  <div className="leg" style={{ margin: 0, fontSize: 11, gap: 10 }}>
                    <span><u style={{ background: "transparent", border: "1.5px solid var(--ac)" }} />Untested</span>
                    <span><u style={{ background: "#00ff88" }} />Pressed</span>
                    <span><u style={{ background: "#07140d", border: "1.5px solid rgba(0,255,136,0.45)" }} />Tested</span>
                  </div>

                <div style={{ marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, fontFamily: "'JetBrains Mono', monospace", marginBottom: 4 }}>
                    <span style={{ color: "var(--mu)" }}>

                {activeLayout === "dualsense" ? (

                    <g>

                      <text x="159" y="61" textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize="11" fontWeight="800" fill={btnVisual(6).textFill}>L2</text>

                    <path

                      <text x="320" y="164" textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize="10" fontWeight="700" fill={metrics.touches.length > 0 && !hidTouchRef.current.click ? "#00ff88" : btnVisual(17).textFill}>

                      {metrics.touches.map((pt, idx) => {

                            <circle cx={tx} cy={ty} r="10" fill="rgba(0, 255, 136, 0.28)" />

                    {[296, 308, 320, 332, 344].map(cx => (

                        <b style={{ color: metrics.activeIndices.includes(18) ? "#00ff88" : "var(--mu)" }}>
                          {metrics.activeIndices.includes(18) ? "PRESSED" : metrics.testedIndices.includes(18) ? "tested ✓" : hidDeviceInfo ? "untested" : "needs WebHID"}

                      {micState === "live" ? (

                      <button type="button" className={`b haptic-btn${micRecState === "recording" ? " rec" : ""}`} disabled={micState !== "live" || micRecState === "recording"} onClick={recordMicClip}>

              <select value={selectedJobId} onChange={e => { jobPickedRef.current = true; setSelectedJobId(e.target.value); }} aria-label="Target job ticket">

      // =========================================================================
      // UK HMRC SOLE TRADER TAX-YEAR, TRADING ALLOWANCE & SET-ASIDE ESTIMATOR
      // =========================================================================
      const TaxView = ({ state, searchQuery, onExportHmrcCsv }) => {
        const cur = state.settings.currency || "£";
        const [ledgerFilter, setLedgerFilter] = useState("All");
        const currentTaxYear = getUkTaxYear(todayIso());

        const availableYears = useMemo(() => {
          const set = new Set(["2026/27", "2027/28", currentTaxYear]);
          state.jobs.forEach(j => { if (j.date) set.add(getUkTaxYear(j.date)); });
          state.expenses.forEach(e => { if (e.date) set.add(getUkTaxYear(e.date)); });
          return [...set].sort().reverse();
        }, [state.jobs, state.expenses, currentTaxYear]);

        const [taxYear, setTaxYear] = useState(currentTaxYear);
        const startYearNum = Number(taxYear.split("/")[0]) || 2026;
        const periodLabel = `6 Apr ${startYearNum} – 5 Apr ${startYearNum + 1}`;
        const tradingAllowanceLimit = startYearNum >= 2027 ? 3000 : 1000;
        const allowanceLabel = `${cur}${tradingAllowanceLimit.toLocaleString()}`;

        const yearJobs = state.jobs.filter(j => j.status === "Completed" && getUkTaxYear(j.date) === taxYear);
        const yearExpenses = state.expenses.filter(e => getUkTaxYear(e.date) === taxYear);

        const grossTurnover = yearJobs.reduce((s, j) => s + (+j.price || 0), 0);
        const allowableExpenses = yearExpenses.reduce((s, e) => s + (+e.amount || 0), 0);

        const expByCategory = { Parts: 0, Device: 0, Equipment: 0, General: 0 };
        yearExpenses.forEach(e => {
          const cat = expByCategory[e.cat] !== undefined ? e.cat : "General";
          expByCategory[cat] += +e.amount || 0;
        });

        const taxableWithExpenses = Math.max(0, grossTurnover - allowableExpenses);
        const taxableWithAllowance = Math.max(0, grossTurnover - tradingAllowanceLimit);
        const useTradingAllowance = tradingAllowanceLimit > allowableExpenses;
        const bestTaxableProfit = useTradingAllowance ? taxableWithAllowance : taxableWithExpenses;
        const recommendedMethod = useTradingAllowance ? `${allowanceLabel} Trading Allowance` : "Actual Expenses";
        const saving = Math.abs(taxableWithExpenses - taxableWithAllowance);
        const needsSA = grossTurnover > tradingAllowanceLimit;

        const profit = bestTaxableProfit;
        const personalAllowance = profit > 125140 ? 0 : profit > 100000 ? Math.max(0, 12570 - (profit - 100000) / 2) : 12570;
        const taxableIncome = Math.max(0, profit - personalAllowance);
        const basicAmt = Math.min(taxableIncome, 37700);
        const higherAmt = Math.min(Math.max(0, taxableIncome - 37700), 125140 - 37700);
        const addAmt = Math.max(0, taxableIncome - 125140);
        const incomeTax = basicAmt * 0.2 + higherAmt * 0.4 + addAmt * 0.45;
        const class4 = Math.max(0, Math.min(profit, 50270) - 12570) * 0.06 + Math.max(0, profit - 50270) * 0.02;
        const totalTax = needsSA ? incomeTax + class4 : 0;
        const cashAfterTax = grossTurnover - allowableExpenses - totalTax;
        const effRate = profit > 0 && needsSA ? (totalTax / profit) * 100 : 0;
        const setAsidePerMonth = totalTax / 12;

        const regDeadline = `5 Oct ${startYearNum + 1}`;
        const fileDeadline = `31 Jan ${startYearNum + 2}`;
        const daysToFile = Math.ceil((Date.UTC(startYearNum + 2, 0, 31) - Date.now()) / 864e5);

        const monthKeys = Array.from({ length: 12 }, (_, i) => {
          const mIdx = (3 + i) % 12;
          const y = startYearNum + (3 + i >= 12 ? 1 : 0);
          return `${y}-${String(mIdx + 1).padStart(2, "0")}`;
        });
        const monthly = {};
        monthKeys.forEach(k => { monthly[k] = { inc: 0, exp: 0, n: 0 }; });
        const bucketFor = d => {
          const k = (d || "").slice(0, 7);
          if (monthly[k]) return monthly[k];
          return k === `${startYearNum + 1}-04` ? monthly[monthKeys[11]] : null;
        };
        yearJobs.forEach(j => { const b = bucketFor(j.date); if (b) { b.inc += +j.price || 0; b.n++; } });
        yearExpenses.forEach(e => { const b = bucketFor(e.date); if (b) { b.exp += +e.amount || 0; } });
        const maxBar = Math.max(1, ...monthKeys.map(k => Math.max(monthly[k].inc, monthly[k].exp)));

        const splitParts = [
          { l: "Allowable Expenses", v: allowableExpenses, c: "#22d3ee" },
          { l: "Income Tax", v: needsSA ? incomeTax : 0, c: "#f59e0b" },
          { l: "Class 4 NI", v: needsSA ? class4 : 0, c: "#f43f5e" },
          { l: "Left In Your Pocket", v: Math.max(0, cashAfterTax), c: "var(--ac)" }
        ];
        const splitTotal = splitParts.reduce((s, p) => s + p.v, 0);
        let accPct = 0;
        const donutGradient = splitTotal > 0 ? splitParts.map(p => {
          const pct = (p.v / splitTotal) * 100;
          const start = accPct;
          accPct += pct;
          return `${p.c} ${start.toFixed(2)}% ${accPct.toFixed(2)}%`;
        }).join(", ") : "";

        const boxes = [
          { l: "Cost of Goods / Parts", sub: "Parts + refurb devices", v: expByCategory.Parts + expByCategory.Device, c: "var(--ac)" },
          { l: "Tools, Microscopes & Equipment", sub: "Capital · cash basis", v: expByCategory.Equipment, c: "#22d3ee" },
          { l: "Postage, Packaging & Admin", sub: "General overheads", v: expByCategory.General, c: "#f59e0b" }
        ];
        const maxBox = Math.max(1, ...boxes.map(b => b.v));

        const ledgerAll = [
          ...yearJobs.map(j => ({ date: j.date, kind: "Income", ref: `Job #${j.id} · ${j.type}`, cat: "", desc: `${j.customer} — ${j.device}`, inc: +j.price || 0, exp: 0 })),
          ...yearExpenses.map(e => ({ date: e.date, kind: "Expense", ref: e.cat || "General", cat: (e.cat || "General").trim(), desc: e.name, inc: 0, exp: +e.amount || 0 }))
        ].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
        const ledger = ledgerAll
          .filter(r => matchesQuery(r, searchQuery))
          .filter(r => ledgerFilter === "All" || r.kind === (ledgerFilter === "Income" ? "Income" : "Expense"));

        const expTotalPct = grossTurnover > 0 ? Math.min(100, (allowableExpenses / grossTurnover) * 100) : 0;
        const allowanceFill = Math.min(100, (grossTurnover / Math.max(1, tradingAllowanceLimit)) * 100);

        return (

                <p>Cash-basis sole trader ledger ({periodLabel}), allowance optimiser &amp; tax set-aside estimate.</p>
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <div className="pills" style={{ margin: 0 }}>
                  {availableYears.map(yr => (
                    <button key={yr} type="button" className={`b${taxYear === yr ? " on" : ""}`} onClick={() => setTaxYear(yr)}>{yr}</button>
                  ))}
                </div>
                <button type="button" className="b pri" onClick={() => onExportHmrcCsv(taxYear)}>
                  <Icon name="down" size={14} /> Export HMRC CSV
                </button>
              </div>
            </div>

            <div className="stat-hero-grid">
              <div className="hero-stat-card">
                <div className="hero-stat-top">
                  <small>Gross Turnover ({yearJobs.length} Jobs)</small>
                  <span className={`chip ${needsSA ? "Pending" : "Completed"}`}>{needsSA ? "Above Allowance" : "Within Allowance"}</span>
                </div>
                <div className="hero-stat-val gradient-emerald-text">{fmtMoney(grossTurnover, cur)}</div>
                <div className="mini-bar-track"><div className="mini-bar-fill" style={{ width: `${Math.max(4, allowanceFill)}%` }} /></div>
                <div className="hero-stat-foot">
                  <span>Allowance: <strong style={{ color: "var(--tx)" }}>{allowanceLabel}</strong></span>
                  <span>{needsSA ? "Over by" : "Headroom"}: <strong style={{ color: "var(--ac)" }}>{fmtMoney(Math.abs(grossTurnover - tradingAllowanceLimit), cur)}</strong></span>
                </div>
              </div>

              <div className="hero-stat-card">
                <div className="hero-stat-top">
                  <small>Allowable Expenses ({yearExpenses.length})</small>
                  <span className="chip Completed">{expTotalPct.toFixed(0)}% of turnover</span>
                </div>
                <div className="hero-stat-val gradient-emerald-text">{fmtMoney(allowableExpenses, cur)}</div>
                <div className="mini-bar-track"><div className="mini-bar-fill" style={{ width: `${Math.max(4, expTotalPct)}%` }} /></div>
                <div className="hero-stat-foot">
                  <span>Parts &amp; Devices: <strong style={{ color: "var(--tx)" }}>{fmtMoney(expByCategory.Parts + expByCategory.Device, cur)}</strong></span>
                  <span>Equipment: <strong style={{ color: "var(--ac)" }}>{fmtMoney(expByCategory.Equipment, cur)}</strong></span>
                </div>
              </div>

              <div className="hero-stat-card">
                <div className="hero-stat-top">
                  <small>Taxable Profit</small>
                  <span className="chip Completed">{useTradingAllowance ? "Allowance Wins" : "Expenses Win"}</span>
                </div>
                <div className="hero-stat-val gradient-emerald-text">{fmtMoney(bestTaxableProfit, cur)}</div>
                <div className="mini-bar-track"><div className="mini-bar-fill" style={{ width: `${Math.max(4, grossTurnover > 0 ? Math.min(100, (bestTaxableProfit / grossTurnover) * 100) : 0)}%` }} /></div>
                <div className="hero-stat-foot">
                  <span>Method: <strong style={{ color: "var(--tx)" }}>{recommendedMethod}</strong></span>
                  <span>Saves: <strong style={{ color: "var(--ac)" }}>{fmtMoney(saving, cur)}</strong></span>
                </div>
              </div>

              <div className="hero-stat-card">
                <div className="hero-stat-top">
                  <small>Est. Tax Bill</small>
                  <span className={`chip ${totalTax <= 0 ? "Completed" : effRate < 20 ? "Pending" : "Cancelled"}`}>{effRate.toFixed(1)}% effective</span>
                </div>
                <div className="hero-stat-val gradient-emerald-text">{fmtMoney(totalTax, cur)}</div>
                <div className="mini-bar-track"><div className="mini-bar-fill" style={{ width: `${Math.max(4, Math.min(100, effRate * 2.5))}%` }} /></div>
                <div className="hero-stat-foot">
                  <span>Income Tax: <strong style={{ color: "var(--tx)" }}>{fmtMoney(needsSA ? incomeTax : 0, cur)}</strong></span>
                  <span>Class 4 NI: <strong style={{ color: "var(--ac)" }}>{fmtMoney(needsSA ? class4 : 0, cur)}</strong></span>
                </div>
              </div>
            </div>

            <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))" }}>
              <div className="card stat"><div className="sic"><Icon name="dollar" size={22} /></div><div><small>Cash After Costs &amp; Tax</small><b>{fmtMoney(cashAfterTax, cur)}</b></div></div>
              <div className="card stat"><div className="sic"><Icon name="cal" size={22} /></div><div><small>Set Aside / Month</small><b>{fmtMoney(setAsidePerMonth, cur)}</b></div></div>
              <div className="card stat">
                <div className="sic"><Icon name="shield" size={22} /></div>
                <div>
                  <small>Self Assessment</small>
                  <b style={{ fontSize: 16, marginTop: 4 }} className={needsSA ? "amb" : "pos"}>{needsSA ? "Registration Required" : "Not Required"}</b>
                  <div style={{ fontSize: "10.5px", color: "var(--mu)", marginTop: 2, fontFamily: "'JetBrains Mono', monospace" }}>{needsSA ? `Register by ${regDeadline}` : `Under ${allowanceLabel} gross`}</div>
                </div>
              </div>
              <div className="card stat">
                <div className="sic"><Icon name="landmark" size={22} /></div>
                <div>
                  <small>Return &amp; Payment Due</small>
                  <b style={{ fontSize: 16, marginTop: 4 }}>{fileDeadline}</b>
                  <div style={{ fontSize: "10.5px", color: "var(--mu)", marginTop: 2, fontFamily: "'JetBrains Mono', monospace" }}>{daysToFile > 0 ? `${daysToFile} days left` : "Deadline passed"}</div>
                </div>
              </div>
            </div>

            <div className="grid g2" style={{ margin: "14px 0 18px" }}>
              <div className="card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6, flexWrap: "wrap", gap: 8 }}>
                  <div>
                    <h3 style={{ color: "var(--ac)" }}>Monthly Income vs Expenses</h3>
                    <small>Cash-basis, April → March · hover a month for detail</small>
                  </div>
                  <div className="leg" style={{ margin: 0 }}>
                    <span><u style={{ background: "var(--ac)" }} />Income</span>
                    <span><u style={{ background: "rgba(244,63,94,0.8)" }} />Expenses</span>
                  </div>
                </div>
                <div className="chart-bars-wrap">
                  {monthKeys.map(k => {
                    const row = monthly[k];
                    const iH = row.inc > 0 ? Math.max(4, (row.inc / maxBar) * 100) : 0;
                    const eH = row.exp > 0 ? Math.max(4, (row.exp / maxBar) * 100) : 0;
                    const lbl = new Date(k + "-01").toLocaleString("en-GB", { month: "short", year: "2-digit" });
                    return (
                      <div key={k} className="chart-col" style={{ cursor: "default" }}>
                        <div className="chart-tooltip">
                          <div style={{ color: "var(--ac)", fontWeight: 800, marginBottom: 3 }}>{lbl} ({row.n} Jobs)</div>
                          <div>Income: <b>{fmtMoney(row.inc, cur)}</b></div>
                          <div>Expenses: <b style={{ color: "var(--red)" }}>{fmtMoney(row.exp, cur)}</b></div>
                          <div>Net: <b style={{ color: "#22d3ee" }}>{fmtMoney(row.inc - row.exp, cur)}</b></div>
                        </div>
                        <div className="chart-bars-group">
                          {iH > 0 && <div className="chart-bar rev" style={{ height: `${iH}%` }} />}
                          {eH > 0 && <div className="chart-bar exp" style={{ height: `${eH}%` }} />}
                        </div>
                        <small style={{ marginTop: 6, fontFamily: "'JetBrains Mono', monospace", fontSize: "10.5px", color: "var(--mu)", fontWeight: 600 }}>
                          {new Date(k + "-01").toLocaleString("en-GB", { month: "short" })}
                        </small>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                  <div>
                    <h3 style={{ color: "var(--ac)" }}>Where Your Turnover Goes</h3>
                    <small>Costs, estimated tax &amp; what you keep</small>
                  </div>
                  <span className="chip Completed">{fmtMoney(grossTurnover, cur)} gross</span>
                </div>
                <div className="donut" style={{ marginBottom: 16 }}>
                  <div className="ring" data-c={`${effRate.toFixed(0)}%`} style={{ width: 112, height: 112, background: `conic-gradient(${donutGradient || "var(--line) 0 100%"})` }} />
                  <div style={{ flex: 1 }}>
                    {splitParts.map(p => (
                      <div key={p.l} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "6px 0", fontSize: "12.5px" }}>
                        <span>
                          <u style={{ display: "inline-block", width: 9, height: 9, borderRadius: 3, marginRight: 7, background: p.c, textDecoration: "none" }} />
                          {p.l} <span style={{ color: "var(--mu)", fontSize: 11 }}>({splitTotal ? ((p.v / splitTotal) * 100).toFixed(0) : 0}%)</span>
                        </span>
                        <b style={{ fontSize: 13 }}>{fmtMoney(p.v, cur)}</b>
                      </div>
                    ))}
                  </div>
                </div>
                <p className="note" style={{ borderTop: "1px solid var(--line)", paddingTop: 10, margin: 0 }}>
                  Centre = effective tax rate on profit. Estimate for England, Wales &amp; NI assuming no other income, student loan or payments on account — not tax advice.
                </p>
              </div>
            </div>

            <div className="grid g2" style={{ marginBottom: 18 }}>
              <div className="card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexWrap: "wrap", gap: 8 }}>
                  <div>
                    <h3 style={{ color: "var(--ac)" }}>Trading Allowance vs Actual Expenses</h3>
                    <small>Deduction comparison for {taxYear}</small>
                  </div>
                  <span className="chip Completed">{recommendedMethod} Wins</span>
                </div>
                <div className="bx" style={{ marginTop: 0 }}>
                  <div>
                    <small>Option A: Actual Expenses</small>
                    <b className={!useTradingAllowance ? "pos" : ""}>{fmtMoney(allowableExpenses, cur)}</b>
                    <small style={{ marginTop: 4, textTransform: "none" }}>Taxable: {fmtMoney(taxableWithExpenses, cur)}</small>
                  </div>
                  <div>
                    <small>Option B: Flat Allowance</small>
                    <b className={useTradingAllowance ? "pos" : ""}>{fmtMoney(tradingAllowanceLimit, cur)}</b>
                    <small style={{ marginTop: 4, textTransform: "none" }}>Taxable: {fmtMoney(taxableWithAllowance, cur)}</small>
                  </div>
                </div>
                <p className="note" style={{ marginTop: 10 }}>
                  {!needsSA
                    ? `Gross turnover (${fmtMoney(grossTurnover, cur)}) is within the ${allowanceLabel} Trading Allowance — no Self Assessment return is normally needed unless you choose to register.`
                    : `Turnover is over ${allowanceLabel}, so register for Self Assessment by ${regDeadline}. Claiming ${recommendedMethod} brings taxable profit down to ${fmtMoney(bestTaxableProfit, cur)} and saves you ${fmtMoney(saving, cur)} of taxable profit.`}
                  {grossTurnover >= 50000 && " Turnover is over £50,000, so Making Tax Digital for Income Tax may apply to you."}
                </p>
              </div>

              <div className="card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                  <div>
                    <h3 style={{ color: "var(--ac)" }}>SA103S Allowable Expense Boxes</h3>
                    <small>Cash-basis categorisation for your return</small>
                  </div>
                  <span className="chip">{fmtMoney(allowableExpenses, cur)} Total</span>
                </div>
                {boxes.map(b => (
                  <div key={b.l} className="hb" style={{ margin: "10px 0" }}>
                    <div>
                      <span style={{ fontWeight: 700, fontSize: 12 }}>{b.l} <span style={{ color: "var(--mu)", fontSize: 11 }}>({b.sub})</span></span>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12, fontWeight: 700, color: b.c }}>{fmtMoney(b.v, cur)}</span>

                    <i style={{ width: `${Math.max(2, (b.v / maxBox) * 100)}%`, background: b.c }} />

            <div className="ah" style={{ marginTop: 20, marginBottom: 14 }}>
              <div className="pills" style={{ margin: 0 }}>
                {[["All", ledgerAll.length], ["Income", yearJobs.length], ["Expenses", yearExpenses.length]].map(([f, n]) => (

              {ledger.length === 0 ? (

                    </b>
                  </div>
                </div>
              ))}
            </div>
          </Fragment>

      // AI Analyst View
      const AIView = ({ state, streamingChatId, onSendMessage, onSelectChat, onNewChat, onDeleteChat, onOpenSettings, onApplyAiAction }) => {
        const [input, setInput] = useState("");
        const [showHist, setShowHist] = useState(true);
        const [depth, setDepth] = useState(state.settings.aiThinkingDepth || "fast");
        const feedRef = useRef(null);

        const chats = useMemo(() => [...(state.aiChats || [])].sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || "")), [state.aiChats]);
        const activeChat = useMemo(() => chats.find(c => c.id === state.activeAiChatId) || null, [chats, state.activeAiChatId]);
        const msgs = activeChat?.messages || [];
        const busy = !!streamingChatId;
