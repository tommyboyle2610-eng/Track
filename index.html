                </div>
              </div>

              <div className="card">
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                  <div>
                    <h3 style={{ color: "var(--ac)" }}>Capital &amp; Expense Allocation</h3>
                    <small>Breakdown of workshop investments &amp; stock value</small>
                  </div>
                  <span className="chip">{fmtMoney(totalExp, cur)} Outlay</span>
                </div>
                <div className="bx" style={{ marginTop: 0 }}>
                  <div><small>Parts Purchased</small><b style={{ color: "var(--ac)" }}>{fmtMoney(expCats.Parts, cur)}</b></div>
                  <div><small>Refurb Devices Bought</small><b style={{ color: "#a3e635" }}>{fmtMoney(expCats.Device, cur)}</b></div>
                  <div><small>Workshop Equipment</small><b style={{ color: "#22d3ee" }}>{fmtMoney(expCats.Equipment, cur)}</b></div>
                  <div><small>Active Stock Value</small><b className="pos">{fmtMoney(totalInvVal, cur)}</b></div>
                </div>
                <div style={{ marginTop: 14 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, marginBottom: 6 }}>
                    <span style={{ color: "var(--mu)", fontWeight: 700 }}>Expense Recovery &amp; Breakeven Progress</span>
                    <span style={{ fontFamily: "'JetBrains Mono', monospace", fontWeight: 800, color: "var(--ac)" }}>
                      {totalExp ? Math.min(999, (rev / totalExp) * 100).toFixed(0) : 100}% Recovered
                    </span>
                  </div>
                  <div className="mini-bar-track" style={{ height: 10 }}>
                    <div className="mini-bar-fill" style={{ width: `${totalExp ? Math.min(100, (rev / totalExp) * 100) : 100}%` }} />
                  </div>
                  <p className="note" style={{ marginTop: 8 }}>
                    Total completed revenue covers <b>{totalExp ? (rev / totalExp).toFixed(2) : "1.00"}x</b> of all historical parts, device, and microscope/tool investments.
                  </p>
                </div>
              </div>
            </div>

            <div className="card" style={{ marginBottom: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
                <div>
                  <h3 style={{ margin: 0, color: "var(--ac)" }}>Monthly Revenue &amp; Profit Ledger</h3>
                  <p style={{ margin: "2px 0 0", color: "var(--mu)", fontSize: 12 }}>Complete monthly breakdown of gross income, component costs, store expenses, and MoM trajectory</p>
                </div>
                <span className="chip Completed">{sortedMonths.length} Months Tracked</span>
              </div>
              <div className="wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Month</th>
                      <th>Jobs</th>
                      <th>Revenue</th>
                      <th>Job Costs</th>
                      <th>Expenses</th>
                      <th>Job Net Profit</th>
                      <th>Margin</th>
                      <th>Performance &amp; MoM</th>
                    </tr>
                  </thead>
                  <tbody>
                    {sortedMonths.length === 0 ? (
                      <tr><td colSpan={8}>Nothing logged here yet.</td></tr>
                    ) : [...sortedMonths].reverse().map((m, idx, arr) => {
                      const row = monthly[m];
                      const prevRow = arr[idx + 1] ? monthly[arr[idx + 1]] : null;
                      const momDelta = prevRow && prevRow.p ? ((row.p - prevRow.p) / Math.abs(prevRow.p)) * 100 : null;
                      const jobCosts = row.r - row.p;
                      const marginStr = row.r ? ((row.p / row.r) * 100).toFixed(1) : "0.0";
                      const maxProfit = Math.max(1, ...sortedMonths.map(k => monthly[k].p));
                      const barW = Math.max(4, Math.min(100, (row.p / maxProfit) * 100));

                      return (
                        <tr key={m} style={{ cursor: "pointer" }} title="Click to filter dashboard to this month" onClick={() => setRange(r => r === "mo:" + m ? "all" : "mo:" + m)}>
                          <td><b>{new Date(m + "-01").toLocaleString("en-GB", { month: "long", year: "numeric" })}</b></td>
                          <td><span className="chip">{row.n}</span></td>
                          <td><b>{fmtMoney(row.r, cur)}</b></td>
                          <td style={{ color: "var(--mu)" }}>{fmtMoney(jobCosts, cur)}</td>
                          <td style={{ color: "var(--red)" }}>{fmtMoney(row.exp, cur)}</td>
                          <td className={row.p >= 0 ? "pos" : "neg"}><b>{fmtMoney(row.p, cur)}</b></td>
                          <td><b className={+marginStr >= 50 ? "pos" : +marginStr >= 25 ? "amb" : "neg"}>{marginStr}%</b></td>
                          <td style={{ minWidth: 170 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                              <div className="hb" style={{ margin: 0, flex: 1 }}><i style={{ width: `${barW}%` }} /></div>
                              {momDelta != null && (
                                <span style={{ fontSize: 11, fontWeight: 700, fontFamily: "'JetBrains Mono'" }} className={momDelta >= 0 ? "pos" : "neg"}>
                                  {momDelta >= 0 ? "▲" : "▼"}{Math.abs(momDelta).toFixed(0)}%
                                </span>
                              )}
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </Fragment>
        );
      };

      // =========================================================================
      // EXPENSES VIEW — REDEFINED WITH DEVICES (BY SELLER) & OTHER EXPENSES TABS
      // =========================================================================
      const CAT_COLORS = { Parts: "var(--ac)", Equipment: "#22d3ee", Device: "#a3e635", General: "#f59e0b" };
      const ExpensesView = ({ state, searchQuery, onAddDevicePurchase, onEditExpense, onDeleteExpense, onInspectLinkedStock, onInspectDeviceExpense, onRenameSeller }) => {
        const [expTab, setExpTab] = useState("devices"); // "devices" | "other"
        const [catFilter, setCatFilter] = useState("All");
        const [sellerFilter, setSellerFilter] = useState("All");
        const [copiedOrderId, setCopiedOrderId] = useState("");
        const cur = state.settings.currency || "£";

        const allWithIdx = useMemo(() => {
          const indexed = state.expenses.map((e, idx) => ({ ...e, _i: idx }));
          const asc = state.settings.sortOrder === "date-asc";
          return indexed.sort((a, b) => {
            const cmp = asc
              ? (a.date || "").localeCompare(b.date || "")
              : (b.date || "").localeCompare(a.date || "");
            if (cmp !== 0) return cmp;
            return asc ? a._i - b._i : b._i - a._i;
          });
        }, [state.expenses, state.settings.sortOrder]);

        const devicePurchases = useMemo(
          () => allWithIdx.filter(e => (e.cat || "General").trim() === "Device"),
          [allWithIdx]
        );
        const otherPurchases = useMemo(
          () => allWithIdx.filter(e => (e.cat || "General").trim() !== "Device"),
          [allWithIdx]
        );

        const totalDeviceSpend = useMemo(
          () => devicePurchases.reduce((s, e) => s + (+e.amount || 0), 0),
          [devicePurchases]
        );
        const totalDeviceUnits = useMemo(
          () => devicePurchases.reduce((s, e) => s + Math.max(1, Number(e.unitQty) || inferUnitQtyFromName(e.name)), 0),
          [devicePurchases]
        );
        const avgDeviceUnitCost = totalDeviceUnits > 0 ? totalDeviceSpend / totalDeviceUnits : 0;

        const filteredDevicePurchases = useMemo(
          () => devicePurchases.filter(e => matchesQuery(e, searchQuery)),
          [devicePurchases, searchQuery]
        );

        const sellerGroups = useMemo(() => {
          const map = new Map();
          filteredDevicePurchases.forEach(item => {
            const sellerKey = (item.seller || "").trim() || "Unassigned / Direct";
            if (!map.has(sellerKey)) {
              map.set(sellerKey, {
                seller: sellerKey,
                orders: [],
                totalSpend: 0,
                totalUnits: 0,
                platforms: new Set(),
                latestDate: item.date || "",
                latestIdx: item._i ?? 0
              });
            }
            const g = map.get(sellerKey);
            g.orders.push(item);
            g.totalSpend += +item.amount || 0;
            g.totalUnits += Math.max(1, Number(item.unitQty) || inferUnitQtyFromName(item.name));
            if (item.platform) g.platforms.add(item.platform);
            if ((item.date || "") > g.latestDate) {
              g.latestDate = item.date || "";
              g.latestIdx = item._i ?? 0;
            } else if ((item.date || "") === g.latestDate && (item._i ?? 0) > g.latestIdx) {
              g.latestIdx = item._i ?? 0;
            }
          });
          const asc = state.settings.sortOrder === "date-asc";
          return Array.from(map.values()).sort((a, b) => {
            const cmp = asc
              ? a.latestDate.localeCompare(b.latestDate)
              : b.latestDate.localeCompare(a.latestDate);
            if (cmp !== 0) return cmp;
            return asc ? a.latestIdx - b.latestIdx : b.latestIdx - a.latestIdx;
          });
        }, [filteredDevicePurchases, state.settings.sortOrder]);

        const sellerNames = useMemo(() => ["All", ...sellerGroups.map(g => g.seller)], [sellerGroups]);
        const visibleSellerGroups = useMemo(
          () => (sellerFilter === "All" ? sellerGroups : sellerGroups.filter(g => g.seller === sellerFilter)),
          [sellerGroups, sellerFilter]
        );

        const otherTotal = useMemo(
          () => otherPurchases.reduce((s, e) => s + (+e.amount || 0), 0),
          [otherPurchases]
        );
        const byOtherCat = useMemo(() => {
          const acc = {};
          otherPurchases.forEach(e => {
            const c = (e.cat || "General").trim();
            acc[c] = (acc[c] || 0) + (+e.amount || 0);
          });
          return acc;
        }, [otherPurchases]);
        const sortedCats = useMemo(
          () => Object.entries(byOtherCat).sort((a, b) => b[1] - a[1]),
          [byOtherCat]
        );
        const topOtherCat = sortedCats[0]?.[0] || "—";
        const otherMonthsCount = useMemo(
          () => new Set(otherPurchases.map(e => (e.date || "").slice(0, 7)).filter(Boolean)).size || 1,
          [otherPurchases]
        );
        const avgOtherMonth = otherTotal / otherMonthsCount;
        const largestOther = useMemo(
          () => otherPurchases.reduce((max, e) => ((+e.amount || 0) > (+max.amount || 0) ? e : max), { amount: 0 }),
          [otherPurchases]
        );
        const otherCats = useMemo(() => ["All", ...sortedCats.map(([c]) => c)], [sortedCats]);
        const filteredOther = useMemo(
          () => otherPurchases.filter(e => (catFilter === "All" || (e.cat || "General").trim() === catFilter) && matchesQuery(e, searchQuery)),
          [otherPurchases, catFilter, searchQuery]
        );

        let accStop = 0;
        const gradStops = sortedCats.map(([c, val]) => {
          const start = accStop;
          accStop += (val / (otherTotal || 1)) * 100;
          return `${CAT_COLORS[c] || "#94a3b8"} ${start}% ${accStop}%`;
        }).join(", ");

        const getHostLabel = url => {
          try {
            const u = new URL(url);
            const h = u.hostname.replace(/^www\./, "");
            if (h.includes("aliexpress")) return "AliExpress Order";
            if (h.includes("amazon")) return "Amazon Order";
            if (h.includes("ebay")) return "eBay Order";
            if (h.includes("messenger") || h.includes("facebook")) return "FB Marketplace";
            if (h.includes("vinted")) return "Vinted Order";
            return h;
          } catch {
            return "External Link";
          }
        };

        const handleCopyOrder = async orderId => {
          if (!orderId) return;
          const ok = await copyTextSafe(orderId);
          if (ok) {
            setCopiedOrderId(orderId);
            setTimeout(() => setCopiedOrderId(""), 1800);
          }
        };

        return (
          <Fragment>
            <div className="ah" style={{ marginTop: 0, marginBottom: 18 }}>
              <div className="ph" style={{ margin: 0 }}>
                <h2><span className="gradient-emerald-text">Expenses &amp; Device Sourcing</span></h2>
                <p>Track controller purchases grouped by seller &amp; external order ID, plus parts &amp; workshop equipment.</p>
              </div>
              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                <div className="seg" style={{ padding: 4, borderRadius: 9999 }}>
                  <button
                    type="button"
                    className={expTab === "devices" ? "on" : ""}
                    style={{ padding: "7px 15px", fontSize: 12, borderRadius: 9999 }}
                    onClick={() => setExpTab("devices")}
                  >
                    Devices (by Seller) · {devicePurchases.length}
                  </button>
                  <button
                    type="button"
                    className={expTab === "other" ? "on" : ""}
                    style={{ padding: "7px 15px", fontSize: 12, borderRadius: 9999 }}
                    onClick={() => setExpTab("other")}
                  >
                    Other Expenses · {otherPurchases.length}
                  </button>
                </div>
                {expTab === "devices" && (
                  <button type="button" className="b pri" onClick={onAddDevicePurchase}>
                    <Icon name="plus" size={14} /> Log Device Purchase
                  </button>
                )}
              </div>
            </div>

            {expTab === "devices" ? (
              <Fragment>
                <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))" }}>
                  <div className="card stat">
                    <div className="sic"><Icon name="dollar" size={22} /></div>
                    <div><small>Device Sourcing Spend</small><b>{fmtMoney(totalDeviceSpend, cur)}</b></div>
                  </div>
                  <div className="card stat">
                    <div className="sic"><Icon name="gamepad" size={22} /></div>
                    <div><small>Total Units Sourced</small><b>{totalDeviceUnits} units</b></div>
                  </div>
                  <div className="card stat">
                    <div className="sic"><Icon name="target" size={22} /></div>
                    <div><small>Avg Cost / Unit</small><b>{fmtMoney(avgDeviceUnitCost, cur)}</b></div>
                  </div>
                  <div className="card stat">
                    <div className="sic"><Icon name="user" size={22} /></div>
                    <div><small>Unique Sellers</small><b>{sellerGroups.length} sellers</b></div>
                  </div>
                </div>

                <div className="ah" style={{ marginTop: 14, marginBottom: 14 }}>
                  <div className="pills" style={{ margin: 0 }}>
                    {sellerNames.map(sName => (
                      <button
                        key={sName}
                        type="button"
                        className={`b${sellerFilter === sName ? " on" : ""}`}
                        onClick={() => setSellerFilter(sName)}
                      >
                        {sName !== "All" && <Icon name="user" size={12} />} {sName}
                      </button>
                    ))}
                  </div>
                  <span className="chip Completed">
                    {filteredDevicePurchases.length} Purchase Orders · {visibleSellerGroups.length} Sellers
                  </span>
                </div>

                {visibleSellerGroups.length === 0 ? (
                  <div className="card" style={{ textAlign: "center", padding: 30, color: "var(--mu)" }}>
                    No device purchases match your current seller filter or search query.
                  </div>
                ) : visibleSellerGroups.map(group => {
                  const initials = group.seller
                    .split(/\s+/)
                    .map(w => w[0])
                    .join("")
                    .slice(0, 2)
                    .toUpperCase();
                  const platformsList = Array.from(group.platforms);

                  return (
                    <div key={group.seller} className="seller-group-card">
                      <div className="seller-group-head">
                        <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
                          <div className="seller-avatar">{initials || "?"}</div>
                          <div>
                            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                              <h3 style={{ color: "var(--tx)", textTransform: "none", letterSpacing: "-0.01em", fontSize: 16 }}>
                                {group.seller}
                              </h3>
                              {onRenameSeller && (
                                <button
                                  type="button"
                                  className="ib"
                                  style={{ width: 26, height: 26 }}
                                  title={group.seller === "Unassigned / Direct" ? "Assign a seller name to these orders" : `Rename seller "${group.seller}"`}
                                  onClick={() => onRenameSeller(group.seller)}
                                >
                                  <Icon name="pencil" size={12} />
                                </button>
                              )}
                              {platformsList.map(pl => (
                                <span key={pl} className="platform-pill">{pl}</span>
                              ))}
                            </div>
                            <small style={{ color: "var(--mu)", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, marginTop: 3 }}>
                              {group.orders.length} order{group.orders.length === 1 ? "" : "s"} · {group.totalUnits} unit{group.totalUnits === 1 ? "" : "s"} · Avg {fmtMoney(group.totalUnits ? group.totalSpend / group.totalUnits : 0, cur)}/unit
                            </small>
                          </div>
                        </div>
                        <div className="seller-spend-box">
                          <small style={{ color: "var(--mu)", fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, textTransform: "uppercase", fontWeight: 800 }}>
                            Total Seller Spend
                          </small>
                          <b style={{ fontSize: 20, color: "var(--ac)", fontFamily: "'JetBrains Mono', monospace" }}>
                            {fmtMoney(group.totalSpend, cur)}
                          </b>
                        </div>
                      </div>

                      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                        {group.orders.map(item => {
                          const qty = Math.max(1, Number(item.unitQty) || inferUnitQtyFromName(item.name));
                          const perUnit = (+item.amount || 0) / qty;
                          const linkedDevices = state.stock.filter(s => s.cat !== "Parts" && s.linkedExpenseId && s.linkedExpenseId === item.id);
                          const hasUrl = Boolean(item.link && item.link.trim());

                          return (
                            <div
                              key={item._i}
                              className="seller-order-subcard"
                              style={{ cursor: "pointer" }}
                              title="Click to view full device purchase & linked stock details"
                              onClick={e => {
                                if (!e.target.closest("button, a, input, select, textarea")) {
                                  onInspectDeviceExpense?.(item._i);
                                }
                              }}
                            >
                              <div className="exp-meta">
                                <div className="exp-title">
                                  <span dangerouslySetInnerHTML={{ __html: formatRich(item.name) }} />
                                  <span className="exp-cat-badge Device">{qty} unit{qty === 1 ? "" : "s"} ({fmtMoney(perUnit, cur)}/ea)</span>
                                </div>

                                {(item.platform || item.extOrderId || hasUrl || linkedDevices.length > 0) && (
                                  <div className="seller-order-badges">
                                    {item.platform && <span className="platform-pill">{item.platform}</span>}

                                    {item.extOrderId && (
                                      hasUrl ? (
                                        <a
                                          href={item.link}
                                          target="_blank"
                                          rel="noopener noreferrer"
                                          className="order-id-pill"
                                          style={{ textDecoration: "none" }}
                                          title="Open external order link"
                                        >
                                          <Icon name="tag" size={11} /> Order #{item.extOrderId}
                                        </a>
                                      ) : (
                                        <button
                                          type="button"
                                          className="order-id-pill"
                                          title="Click to copy External Order ID"
                                          onClick={() => handleCopyOrder(item.extOrderId)}
                                        >
                                          <Icon name="copy" size={11} /> {copiedOrderId === item.extOrderId ? `Copied #${item.extOrderId}!` : `Order #${item.extOrderId}`}
                                        </button>
                                      )
                                    )}

                                    {!item.extOrderId && hasUrl && (
                                      <a href={item.link} target="_blank" rel="noopener noreferrer" className="exp-link-btn">
                                        <Icon name="tag" size={12} /> {getHostLabel(item.link)}
                                      </a>
                                    )}

                                    {linkedDevices.map((dev, idx) => (
                                      <button
                                        key={dev.id || idx}
                                        type="button"
                                        className="linked-pill"
                                        style={{ cursor: "pointer" }}
                                        title="Click to inspect linked Stock Device"
                                        onClick={() => onInspectLinkedStock(dev.name)}
                                      >
                                        <Icon name="link" size={11} /> {dev.name} · {dev.status || "In Stock"}
                                      </button>
                                    ))}
                                  </div>
                                )}

                                <small style={{ color: "var(--mu)", fontWeight: 600, fontFamily: "'JetBrains Mono', monospace", marginTop: 2 }}>
                                  Purchased {fmtDate(item.date)}
                                  {linkedDevices.length === 0 ? " · Not yet linked to stock cards" : ` · ${linkedDevices.length} stock card${linkedDevices.length === 1 ? "" : "s"} linked`}
                                </small>
                              </div>

                              <div className="seller-order-right">
                                <div className="exp-amount-box">
                                  <small>Amount</small>
                                  <b>{fmtMoney(item.amount, cur)}</b>
                                </div>
                                <div className="ja" style={{ flex: "none" }}>
                                  <button type="button" className="ib" title="Edit Expense" onClick={() => onEditExpense(item._i)}>
                                    <Icon name="pencil" size={15} />
                                  </button>
                                  <button type="button" className="ib dg" title="Delete Expense" onClick={() => onDeleteExpense(item._i)}>
                                    <Icon name="trash" size={15} />
                                  </button>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </Fragment>
            ) : (
              <Fragment>
                <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))" }}>
                  <div className="card stat">
                    <div className="sic"><Icon name="dollar" size={22} /></div>
                    <div><small>Other Expenses Total</small><b>{fmtMoney(otherTotal, cur)}</b></div>
                  </div>
                  <div className="card stat">
                    <div className="sic"><Icon name="tag" size={22} /></div>
                    <div><small>Top Category</small><b>{topOtherCat}</b></div>
                  </div>
                  <div className="card stat">
                    <div className="sic"><Icon name="trend" size={22} /></div>
                    <div><small>Avg / Active Month</small><b>{fmtMoney(avgOtherMonth, cur)}</b></div>
                  </div>
                  <div className="card stat">
                    <div className="sic"><Icon name="layers" size={22} /></div>
                    <div><small>Largest Purchase</small><b>{fmtMoney(largestOther.amount || 0, cur)}</b></div>
                  </div>
                </div>

                {otherTotal > 0 && (
                  <div className="card" style={{ marginBottom: 16 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                      <div>
                        <h3 style={{ color: "var(--ac)" }}>Category Spend Breakdown</h3>
                        <small>Parts, equipment &amp; general workshop costs</small>
                      </div>
                      <span className="chip">{otherPurchases.length} Records</span>
                    </div>
                    <div className="donut">
                      <div className="ring" data-c={`${sortedCats.length}`} style={{ width: 96, height: 96, background: `conic-gradient(${gradStops || "var(--line) 0 100%"})` }} />
                      <div style={{ flex: 1 }}>
                        {sortedCats.map(([c, val]) => (
                          <div key={c} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "5px 0", fontSize: "12.5px" }}>
                            <span>
                              <u style={{ display: "inline-block", width: 9, height: 9, borderRadius: 3, marginRight: 7, background: CAT_COLORS[c] || "#94a3b8", textDecoration: "none" }} />
                              {c} <span style={{ color: "var(--mu)", fontSize: 11 }}>({otherTotal ? ((val / otherTotal) * 100).toFixed(0) : 0}%)</span>
                            </span>
                            <b style={{ fontSize: 13 }}>{fmtMoney(val, cur)}</b>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                <div className="pills" style={{ marginTop: 12, marginBottom: 14 }}>
                  {otherCats.map(c => (
                    <button key={c} type="button" className={`b${catFilter === c ? " on" : ""}`} onClick={() => setCatFilter(c)}>
                      {c}
                    </button>
                  ))}
                </div>

                {filteredOther.length === 0 ? (
                  <div className="card" style={{ textAlign: "center", padding: 30, color: "var(--mu)" }}>No other expenses match your current filter.</div>
                ) : filteredOther.map(item => {
                  const catName = (item.cat || "General").trim();
                  const hasUrl = Boolean(item.link && item.link.trim());
                  return (
                    <div key={item._i} className="exp-card-item">
                      <div className="exp-meta">
                        <div className="exp-title">
                          <span dangerouslySetInnerHTML={{ __html: formatRich(item.name) }} />
                          <span className={`exp-cat-badge ${catName}`}>{catName}</span>
                          {hasUrl && (
                            <a href={item.link} target="_blank" rel="noopener noreferrer" className="exp-link-btn">
                              <Icon name="tag" size={12} /> {getHostLabel(item.link)}
                            </a>
                          )}
                        </div>
                        <small style={{ color: "var(--mu)", fontWeight: 600, fontFamily: "'JetBrains Mono', monospace" }}>
                          Purchased {fmtDate(item.date)}
                          {item.seller ? ` · ${item.seller}` : ""}
                          {item.extOrderId ? ` · Order #${item.extOrderId}` : ""}
                        </small>
                      </div>
                      <div className="exp-amount-box">
                        <small>Amount</small>
                        <b>{fmtMoney(item.amount, cur)}</b>
                      </div>
                      <div className="ja" style={{ flex: "none" }}>
                        <button type="button" className="ib" title="Edit Expense" onClick={() => onEditExpense(item._i)}>
                          <Icon name="pencil" size={15} />
                        </button>
                        <button type="button" className="ib dg" title="Delete Expense" onClick={() => onDeleteExpense(item._i)}>
                          <Icon name="trash" size={15} />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </Fragment>
            )}
          </Fragment>
        );
      };

      // =========================================================================
      // STOCK INVENTORY VIEW (PARTS, INBOUND DELIVERIES, DEVICES & SELLER GROUPING)
      // =========================================================================
      const StockView = ({
        state,
        searchQuery,
        onEditStock,
        onDeleteStock,
        onAdjustQty,
        onSetDeviceStatus,
        onToggleHideSold,
        onAddDeliveryDevice,
        onJumpToExpense,
        onJumpToJob
      }) => {
        const [scope, setScope] = useState("all"); // "all" | "parts" | "devices" | "inbound"
        const [groupBySeller, setGroupBySeller] = useState(false);
        const cur = state.settings.currency || "£";
        const hideSold = !!state.settings.hideSold;

        const allWithIdx = useMemo(
          () => state.stock.map((item, idx) => ({ ...item, _i: idx })).filter(item => matchesQuery(item, searchQuery)),
          [state.stock, searchQuery]
        );

        const partsList = useMemo(() => allWithIdx.filter(item => item.cat === "Parts"), [allWithIdx]);
        const inboundDevices = useMemo(
          () => allWithIdx.filter(item => item.cat !== "Parts" && item.status === "Awaiting Delivery"),
          [allWithIdx]
        );
        const nonInboundDevices = useMemo(
          () => allWithIdx.filter(item => item.cat !== "Parts" && item.status !== "Awaiting Delivery"),
          [allWithIdx]
        );

        const devPending = useMemo(() => nonInboundDevices.filter(d => d.status === "Pending"), [nonInboundDevices]);
        const devInStock = useMemo(() => nonInboundDevices.filter(d => d.status === "In Stock"), [nonInboundDevices]);
        const devSold = useMemo(() => nonInboundDevices.filter(d => d.status === "Sold"), [nonInboundDevices]);

        const partsStockCostVal = useMemo(
          () => state.stock.filter(s => s.cat === "Parts").reduce((sum, s) => sum + (Number(s.qty) || 0) * (Number(s.unitCost) || 0), 0),
          [state.stock]
        );
        const activeDevices = useMemo(
          () => state.stock.filter(s => s.cat !== "Parts" && s.status !== "Sold"),
          [state.stock]
        );
        const activeDeviceCostVal = useMemo(
          () => activeDevices.reduce((sum, s) => sum + (Number(s.deviceCost) || 0) + (Number(s.partsCost) || 0), 0),
          [activeDevices]
        );
        const estResaleVal = useMemo(
          () => activeDevices.reduce((sum, s) => sum + (Number(s.price) || Number(s.predicted) || 0), 0),
          [activeDevices]
        );
        const lowStockCount = useMemo(
          () => state.stock.filter(s => s.cat === "Parts" && Number(s.qty) <= Number(s.low || 0)).length,
          [state.stock]
        );

        const groupedDevices = useMemo(() => {
          const sourceDevs = scope === "inbound" ? inboundDevices : allWithIdx.filter(item => item.cat !== "Parts");
          const map = new Map();
          sourceDevs.forEach(dev => {
            const sellerKey = (dev.seller || "").trim() || "Unassigned / Direct";
            if (!map.has(sellerKey)) {
              map.set(sellerKey, {
                seller: sellerKey,
                platform: dev.platform || "",
                extOrderId: dev.extOrderId || "",
                devices: [],
                totalCost: 0
              });
            }
            const grp = map.get(sellerKey);
            grp.devices.push(dev);
            grp.totalCost += (Number(dev.deviceCost) || 0) + (Number(dev.partsCost) || 0);
          });
          return Array.from(map.values()).sort((a, b) => {
            if (a.seller === "Unassigned / Direct") return 1;
            if (b.seller === "Unassigned / Direct") return -1;
            return a.seller.localeCompare(b.seller);
          });
        }, [scope, inboundDevices, allWithIdx]);

        const renderDeviceCard = dev => {
          const st = dev.status || "In Stock";
          const stCls = st.replace(/\s+/g, "");
          const cardCls = st === "Awaiting Delivery" ? "sc-delivery" : st === "Pending" ? "sc-pending" : st === "In Stock" ? "sc-instock" : "";
          const totalUnitCost = (Number(dev.deviceCost) || 0) + (Number(dev.partsCost) || 0);
          const targetPrice = st === "Sold" ? (Number(dev.sold) || Number(dev.price) || 0) : (Number(dev.price) || Number(dev.predicted) || 0);
          const estProfit = targetPrice - totalUnitCost;
          const linkedExp = dev.linkedExpenseId ? state.expenses.find(e => e.id === dev.linkedExpenseId) : null;
          const linkedJob = dev.linkedJobId ? state.jobs.find(j => j.id == dev.linkedJobId) : null;

          return (
            <div key={dev.id || dev._i} className={`sc ${cardCls}`}>
              <div className="top">
                <span className={`pill ${stCls}`}>{st}</span>
                <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                  {dev.orderBatchLabel && <span className="tg" style={{ margin: 0 }}>{dev.orderBatchLabel}</span>}
                  <span className="tg" style={{ margin: 0 }}>Device</span>
                </div>
              </div>

              <h4><span dangerouslySetInnerHTML={{ __html: formatRich(dev.name) }} /></h4>

              {(dev.seller || dev.platform || dev.extOrderId) && (
                <div className="seller-order-badges" style={{ marginBottom: 6 }}>
                  {dev.seller && (
                    <span className="exp-cat-badge Device">
                      <Icon name="user" size={11} /> {dev.seller}
                    </span>
                  )}
                  {dev.platform && <span className="platform-pill">{dev.platform}</span>}
                  {dev.extOrderId && <span className="order-id-pill">#{dev.extOrderId}</span>}
                </div>
              )}

              <div style={{ fontSize: 11.5, color: "var(--mu)", fontFamily: "'JetBrains Mono', monospace", display: "flex", flexDirection: "column", gap: 3 }}>
                <span>Logged {fmtDate(dev.date)}</span>
                {dev.eta && <span style={{ color: "#818cf8" }}>ETA / Tracking: {dev.eta}</span>}
                {linkedExp && (
                  <button
                    type="button"
                    className="linked-pill"
                    style={{ cursor: "pointer", alignSelf: "flex-start", marginTop: 2 }}
                    onClick={() => onJumpToExpense(linkedExp.name)}
                  >
                    <Icon name="link" size={11} /> Expense: {linkedExp.name}
                  </button>
                )}
                {linkedJob && (
                  <button
                    type="button"
                    className="linked-pill"
                    style={{ cursor: "pointer", alignSelf: "flex-start", marginTop: 2 }}
                    onClick={() => onJumpToJob(linkedJob.id)}
                  >
                    <Icon name="link" size={11} /> Job #{linkedJob.id} ({linkedJob.customer})
                  </button>
                )}
              </div>

              <div className="bx">
                <div>
                  <small>Unit Cost</small>
                  <b>{fmtMoney(totalUnitCost, cur)}</b>
                  <small style={{ marginTop: 2, textTransform: "none", fontSize: 9.5 }}>
                    Dev {fmtMoney(dev.deviceCost, cur)} + Parts {fmtMoney(dev.partsCost, cur)}
                  </small>
                </div>
                <div>
                  <small>{st === "Sold" ? "Sold For" : "Target Sale"}</small>
                  <b className={estProfit >= 0 ? "pos" : "neg"}>{fmtMoney(targetPrice, cur)}</b>
                  <small style={{ marginTop: 2, textTransform: "none", fontSize: 9.5, color: estProfit >= 0 ? "var(--ac)" : "var(--red)" }}>
                    {estProfit >= 0 ? `+${fmtMoney(estProfit, cur)} est.` : `${fmtMoney(estProfit, cur)} est.`}
                  </small>
                </div>
              </div>

              <div className="ja" style={{ marginTop: 10 }}>
                {st !== "Sold" ? (
                  <button type="button" className="b pri" onClick={() => onSetDeviceStatus(dev._i, "Sold")}>
                    <Icon name="check" size={13} /> Mark Sold
                  </button>
                ) : (
                  <button type="button" className="b" onClick={() => onSetDeviceStatus(dev._i, "In Stock")}>
                    <Icon name="undo" size={13} /> Relist In Stock
                  </button>
                )}
                {st === "In Stock" && (
                  <button type="button" className="b amb-btn" onClick={() => onSetDeviceStatus(dev._i, "Pending")}>
                    <Icon name="clock" size={13} /> Pending
                  </button>
                )}
                {st === "Pending" && (
                  <button type="button" className="b" onClick={() => onSetDeviceStatus(dev._i, "In Stock")}>
                    <Icon name="box" size={13} /> In Stock
                  </button>
                )}
                {st === "Awaiting Delivery" && (
                  <button type="button" className="b deliv-btn" onClick={() => onSetDeviceStatus(dev._i, "In Stock")}>
                    <Icon name="box" size={13} /> Received
                  </button>
                )}
                <button type="button" className="ib" title="Edit Device" onClick={() => onEditStock(dev._i)}>
                  <Icon name="pencil" size={15} />
                </button>
                <button type="button" className="ib dg" title="Delete Device" onClick={() => onDeleteStock(dev._i)}>
                  <Icon name="trash" size={15} />
                </button>
              </div>
            </div>
          );
        };

        return (
          <Fragment>
            <div className="ah" style={{ marginTop: 0, marginBottom: 18 }}>
              <div className="ph" style={{ margin: 0 }}>
                <h2><span className="gradient-emerald-text">Stock &amp; Hardware Inventory</span></h2>
                <p>Track TMR/Hall Effect stick quantities, inbound deliveries, and refurbished controller stock.</p>
              </div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                <button type="button" className={`b${groupBySeller ? " on" : ""}`} onClick={() => setGroupBySeller(g => !g)}>
                  <Icon name="user" size={13} /> {groupBySeller ? "Grouped by Seller" : "Group by Seller"}
                </button>
                <button type="button" className={`b${hideSold ? " on" : ""}`} onClick={onToggleHideSold}>
                  {hideSold ? "Showing Active Only" : "Hide Sold"}
                </button>
                <button type="button" className="b deliv-btn" onClick={onAddDeliveryDevice}>
                  <Icon name="truck" size={13} /> + Inbound Device
                </button>
              </div>
            </div>

            <div className="grid" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))" }}>
              <div className="card stat">
                <div className="sic"><Icon name="box" size={22} /></div>
                <div><small>Parts Stock Value</small><b>{fmtMoney(partsStockCostVal, cur)}</b></div>
              </div>
              <div className="card stat">
                <div className="sic"><Icon name="gamepad" size={22} /></div>
                <div><small>Active Device Cost</small><b>{fmtMoney(activeDeviceCostVal, cur)}</b></div>
              </div>
              <div className="card stat">
                <div className="sic"><Icon name="trend" size={22} /></div>
                <div><small>Est. Device Resale</small><b>{fmtMoney(estResaleVal, cur)}</b></div>
              </div>
              <div className="card stat">
                <div className="sic" style={{ color: lowStockCount > 0 ? "var(--amb)" : "var(--ac)" }}><Icon name="tag" size={22} /></div>
                <div><small>Low Stock Alerts</small><b className={lowStockCount > 0 ? "amb" : "pos"}>{lowStockCount} Parts</b></div>
              </div>
            </div>

            <div className="pills" style={{ marginTop: 14, marginBottom: 18 }}>
              {[
                ["all", `All Stock (${allWithIdx.length})`],
                ["devices", `Devices (${nonInboundDevices.length})`],
                ["parts", `Parts (${partsList.length})`],
                ["inbound", `Awaiting Delivery (${inboundDevices.length})`]
              ].map(([k, lbl]) => (
                <button key={k} type="button" className={`b${scope === k ? " on" : ""}`} onClick={() => setScope(k)}>
                  {lbl}
                </button>
              ))}
            </div>

            {(scope === "all" || scope === "parts") && partsList.length > 0 && (
              <Fragment>
                <div className="sep" style={{ margin: "14px 0 12px" }}>Components &amp; Parts · {partsList.length}</div>
                <div className="cg" style={{ marginBottom: 22 }}>
                  {partsList.map(pt => {
                    const qty = Number(pt.qty) || 0;
                    const low = Number(pt.low) || 0;
                    const isLow = qty <= low;
                    const unitCost = Number(pt.unitCost) || 0;
                    const totalVal = qty * unitCost;
                    return (
                      <div key={pt.id || pt._i} className={`sc${isLow ? " sc-pending" : ""}`}>
                        <div className="top">
                          <span className={`pill ${isLow ? "Pending" : "Completed"}`}>{isLow ? "Low Stock" : "Healthy"}</span>
                          <span className="tg" style={{ margin: 0 }}>Parts</span>
                        </div>
                        <h4><span dangerouslySetInnerHTML={{ __html: formatRich(pt.name) }} /></h4>
                        <div style={{ fontSize: 11.5, color: "var(--mu)", fontFamily: "'JetBrains Mono', monospace", marginTop: 2 }}>
                          Unit: {fmtMoney(unitCost, cur)} · Bought: {pt.bought ?? 0} · Alert ≤ {low}
                        </div>
                        <div className="bx">
                          <div>
                            <small>In Stock</small>
                            <b className={isLow ? "amb" : "pos"}>{qty} pcs</b>
                          </div>
                          <div>
                            <small>Stock Value</small>
                            <b>{fmtMoney(totalVal, cur)}</b>
                          </div>
                        </div>
                        <div className="ja" style={{ marginTop: 10 }}>
                          <button type="button" className="b" onClick={() => onAdjustQty(pt._i, -1)} disabled={qty <= 0}>-1</button>
                          <button type="button" className="b pri" onClick={() => onAdjustQty(pt._i, 1)}>+1</button>
                          <button type="button" className="ib" title="Edit Part" onClick={() => onEditStock(pt._i)}><Icon name="pencil" size={15} /></button>
                          <button type="button" className="ib dg" title="Delete Part" onClick={() => onDeleteStock(pt._i)}><Icon name="trash" size={15} /></button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </Fragment>
            )}

            {scope !== "parts" && (
              groupBySeller ? (
                groupedDevices.length === 0 ? (
                  <div className="card" style={{ textAlign: "center", padding: 30, color: "var(--mu)" }}>No devices match your current filter.</div>
                ) : groupedDevices.map(grp => (
                  <div key={grp.seller} className="seller-group-card">
                    <div className="seller-group-head">
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <div className="seller-avatar">
                          {grp.seller.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?"}
                        </div>
                        <div>
                          <h3 style={{ color: "var(--tx)", textTransform: "none", fontSize: 16 }}>{grp.seller}</h3>
                          <small style={{ color: "var(--mu)", fontFamily: "'JetBrains Mono', monospace", fontSize: 11 }}>
                            {grp.devices.length} device card{grp.devices.length === 1 ? "" : "s"}
                          </small>
                        </div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <small style={{ color: "var(--mu)", fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, textTransform: "uppercase", fontWeight: 800 }}>
                          Group Cost Basis
                        </small>
                        <b style={{ fontSize: 18, color: "var(--ac)", fontFamily: "'JetBrains Mono', monospace" }}>
                          {fmtMoney(grp.totalCost, cur)}
                        </b>
                      </div>
                    </div>
                    <div className="cg">{grp.devices.map(renderDeviceCard)}</div>
                  </div>
                ))
              ) : (
                <Fragment>
                  {scope === "all" && inboundDevices.length > 0 && (
                    <Fragment>
                      <div className="sep sep-delivery" style={{ margin: "18px 0 12px" }}>Awaiting Delivery · Inbound Hardware · {inboundDevices.length}</div>
                      <div className="cg">{inboundDevices.map(renderDeviceCard)}</div>
                    </Fragment>
                  )}

                  {scope === "inbound" && inboundDevices.length > 0 && (
                    <Fragment>
                      <div className="sep sep-delivery" style={{ margin: "18px 0 12px" }}>Awaiting Delivery · {inboundDevices.length}</div>
                      <div className="cg">{inboundDevices.map(renderDeviceCard)}</div>
                    </Fragment>
                  )}

                  {devPending.length > 0 && (
                    <Fragment>
                      <div className="sep sep-pending" style={{ margin: "18px 0 12px" }}>Pending · Reserved / Awaiting Action · {devPending.length}</div>
                      <div className="cg">{devPending.map(renderDeviceCard)}</div>
                    </Fragment>
                  )}

                  {devInStock.length > 0 && (
                    <Fragment>
                      <div className="sep" style={{ margin: "18px 0 12px" }}>In Stock · Ready to Sell · {devInStock.length}</div>
                      <div className="cg">{devInStock.map(renderDeviceCard)}</div>
                    </Fragment>
                  )}

                  {!hideSold && devSold.length > 0 && (
                    <Fragment>
                      <div className="sep" style={{ margin: "18px 0 12px" }}>Sold · {devSold.length}</div>
                      <div className="cg">{devSold.map(renderDeviceCard)}</div>
                    </Fragment>
                  )}

      // =========================================================================

      const useTweenedNumber = (target, ms = 600) => {
        const [val, setVal] = useState(target);
        useEffect(() => {
          const from = val;
          const to = Number(target) || 0;
          if (Math.abs(to - from) < 0.01) { setVal(to); return; }
          let raf = 0;
          const t0 = performance.now();
          const tick = now => {
            const p = Math.min(1, (now - t0) / ms);
            const ease = 1 - Math.pow(1 - p, 3);
            setVal(from + (to - from) * ease);
            if (p < 1) raf = requestAnimationFrame(tick);
          };
          raf = requestAnimationFrame(tick);
          return () => cancelAnimationFrame(raf);
        }, [target, ms]);
        return val;
      };

      const isDualSenseMic = d => /dualsense|wireless controller|054c/i.test(d?.label || "");

      const DeviceDiagnosticsView = ({ state, onSaveTestResult }) => {
        const [layoutOverride, setLayoutOverride] = useState("auto");
        const [rightTab, setRightTab] = useState("sticks");
        const [padInfo, setPadInfo] = useState(null);
        const [hidDeviceInfo, setHidDeviceInfo] = useState(null);
        const [hidBlocked, setHidBlocked] = useState(false);
        const [hapticIntensity, setHapticIntensity] = useState(0.8);
        const [activeHaptic, setActiveHaptic] = useState("");
        const [hapticMsg, setHapticMsg] = useState("Press any button on your controller to connect. Use DualSense WebHID for motors, L2/R2 stiff triggers & calibration.");

        const [calStep, setCalStep] = useState("idle"); // "idle" | "center-guided" | "range"
        const [calCornerIdx, setCalCornerIdx] = useState(0);
        const [calHasUnsaved, setCalHasUnsaved] = useState(false);
        const [calMsg, setCalMsg] = useState("Connect DualSense via USB WebHID to calibrate stick center & range.");

        const [micState, setMicState] = useState("idle"); // "idle" | "starting" | "live" | "error"
        const [micDevices, setMicDevices] = useState([]);
        const [micDeviceId, setMicDeviceId] = useState("");
        const [micDb, setMicDb] = useState(-90);
        const [micPeakDb, setMicPeakDb] = useState(-90);
        const [micMonitor, setMicMonitor] = useState(false);
        const [micRecState, setMicRecState] = useState("idle"); // "idle" | "recording" | "ready"
        const [micClipUrl, setMicClipUrl] = useState("");
        const [micVerified, setMicVerified] = useState(false);
        const [micMsg, setMicMsg] = useState("Plug in the DualSense by USB and start the mic test to check the built-in microphone & grille.");
        const micCanvasRef = useRef(null);
        const micRef = useRef({ stream: null, ctx: null, analyser: null, gain: null, recorder: null, raf: 0, lastUi: 0, hot: 0, peak: -90 });

        const refreshMicDevices = useCallback(async () => {
          if (!navigator.mediaDevices?.enumerateDevices) return [];
          try {
            const list = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput");
            setMicDevices(list);
            setMicDeviceId(prev => prev || list.find(isDualSenseMic)?.deviceId || list[0]?.deviceId || "");
            return list;
          } catch {
            return [];
          }
        }, []);

        const scanMics = async () => {
          if (!navigator.mediaDevices?.getUserMedia) {
            setMicMsg("Microphone scanning isn't available in this browser.");
            return;
          }
          try {
            const s = await navigator.mediaDevices.getUserMedia({ audio: true });
            s.getTracks().forEach(t => t.stop());
          } catch {}
          const list = await refreshMicDevices();
          const ds = list.find(isDualSenseMic);
          if (ds) setMicDeviceId(ds.deviceId);
          setMicMsg(list.length
            ? `Found ${list.length} microphone${list.length === 1 ? "" : "s"}${ds ? ` (selected “${ds.label}”)` : ""}.`
            : "No microphones found.");
        };

        const isEmbedded = useMemo(() => {
          try { return window.self !== window.top; } catch { return true; }
        }, []);
        const hidPolicyBlocked = () => {
          try {
            if (typeof document.featurePolicy?.allowsFeature === "function" && !document.featurePolicy.allowsFeature("hid")) return true;
            if (typeof document.permissionsPolicy?.allowsFeature === "function" && !document.permissionsPolicy.allowsFeature("hid")) return true;
          } catch {}
          return false;
        };
        const openFullTab = () => {
          try { window.open(window.location.href, "_blank", "noopener,noreferrer"); } catch {}
        };
        const pendingGestureRef = useRef(false);

        const newestJobId = useMemo(() => (state.jobs.length ? String(state.jobs[state.jobs.length - 1].id) : "0"), [state.jobs]);
        const [selectedJobId, setSelectedJobId] = useState(newestJobId);
        const jobPickedRef = useRef(false);
        useEffect(() => { if (!jobPickedRef.current) setSelectedJobId(newestJobId); }, [newestJobId]);
        const [testNotes, setTestNotes] = useState("");
        const [savedBanner, setSavedBanner] = useState(false);

        const activeGamepadIdxRef = useRef(null);
        const hapticIntensityRef = useRef(0.8);
        const hapticCleanupTimerRef = useRef(null);
        const hidDeviceRef = useRef(null);
        const hidMutePressedRef = useRef(false);
        const hidTouchRef = useRef({ click: false, touches: [] });

        const stopMicTest = useCallback(() => {
          const m = micRef.current;
          if (m.raf) cancelAnimationFrame(m.raf);
          m.raf = 0;
          try { if (m.recorder && m.recorder.state !== "inactive") m.recorder.stop(); } catch {}
          m.recorder = null;
          try { m.stream?.getTracks().forEach(t => t.stop()); } catch {}
          try { m.ctx?.close(); } catch {}
          m.stream = null; m.ctx = null; m.analyser = null; m.gain = null; m.hot = 0; m.peak = 0;
          setMicState(st => (st === "error" ? st : "idle"));
          setMicMonitor(false);
          setMicRecState(st => (st === "recording" ? "idle" : st));
          setMicDb(-90);
          const c = micCanvasRef.current;
          if (c) c.getContext("2d")?.clearRect(0, 0, c.width, c.height);
        }, []);
        const stopMicRef = useRef(stopMicTest);
        stopMicRef.current = stopMicTest;

        const startMicTest = async requestedId => {
          if (!navigator.mediaDevices?.getUserMedia) {
            setMicState("error");
            setMicMsg("This browser can't open the microphone here — it needs a secure (https / localhost) page.");
            return;
          }
          stopMicTest();
          setMicState("starting");
          setMicMsg("Requesting microphone access…");
          const open = id => navigator.mediaDevices.getUserMedia({
            audio: {
              deviceId: id ? { exact: id } : undefined,
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });
          try {
            let stream = await open(requestedId);
            let inputs = await refreshMicDevices();
            let chosen = stream.getAudioTracks()[0]?.getSettings?.().deviceId || requestedId || "";

            if (!requestedId) {
              const ds = inputs.find(isDualSenseMic);
              if (ds && ds.deviceId !== chosen) {
                stream.getTracks().forEach(t => t.stop());
                stream = await open(ds.deviceId);
                chosen = ds.deviceId;
              }
            }
            setMicDeviceId(chosen);

            const AC = window.AudioContext || window.webkitAudioContext;
            const ctx = new AC();
            if (ctx.state === "suspended") await ctx.resume();
            const src = ctx.createMediaStreamSource(stream);
            const analyser = ctx.createAnalyser();
            analyser.fftSize = 1024;
            analyser.smoothingTimeConstant = 0.55;
            const gain = ctx.createGain();
            gain.gain.value = 0;
            src.connect(analyser);
            src.connect(gain);
            gain.connect(ctx.destination);

            const m = micRef.current;
            m.stream = stream; m.ctx = ctx; m.analyser = analyser; m.gain = gain; m.hot = 0; m.peak = 0;

            const label = stream.getAudioTracks()[0]?.label || "microphone";
            setMicState("live");
            setMicMonitor(false);
            setMicMsg(isDualSenseMic({ label })
              ? `Listening on “${label}” — speak, clap or tap the controller's mic grille.`
              : `Listening on “${label}”. That doesn't look like the DualSense — pick it from the list (USB connection required).`);

            const buf = new Float32Array(analyser.fftSize);
            const accent = (getComputedStyle(document.documentElement).getPropertyValue("--ac") || "#00ff88").trim() || "#00ff88";
            const draw = () => {
              const mm = micRef.current;
              if (!mm.analyser) return;
              mm.analyser.getFloatTimeDomainData(buf);
              let sum = 0, pk = 0;
              for (let i = 0; i < buf.length; i++) { const v = buf[i]; sum += v * v; if (Math.abs(v) > pk) pk = Math.abs(v); }
              const rms = Math.sqrt(sum / buf.length);
              const db = rms > 0 ? Math.max(-90, 20 * Math.log10(rms)) : -90;
              mm.peak = Math.max(db, mm.peak - 0.35);

              if (rms > 0.012) mm.hot++; else mm.hot = Math.max(0, mm.hot - 1);
              if (mm.hot === 8) setMicVerified(true);

              const c = micCanvasRef.current;
              if (c) {
                const g = c.getContext("2d");
                const W = c.width, H = c.height;
                g.clearRect(0, 0, W, H);
                g.strokeStyle = "rgba(255,255,255,0.08)";
                g.lineWidth = 1;
                g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
                g.strokeStyle = accent;
                g.lineWidth = 2.2;
                g.beginPath();
                const step = buf.length / W;
                for (let x = 0; x < W; x++) {
                  const v = buf[Math.floor(x * step)] || 0;
                  const y = H / 2 + Math.max(-1, Math.min(1, v * 3.2)) * (H / 2 - 4);
                  if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
                }
                g.stroke();
                const lvl = Math.max(0, Math.min(1, (db + 60) / 60));
                const grad = g.createLinearGradient(0, 0, W, 0);
                grad.addColorStop(0, accent); grad.addColorStop(0.75, "#facc15"); grad.addColorStop(1, "#f43f5e");
                g.fillStyle = grad;
                g.fillRect(0, H - 6, W * lvl, 6);
                const pkX = W * Math.max(0, Math.min(1, (mm.peak + 60) / 60));
                g.fillStyle = "#ffffff";
                g.fillRect(Math.max(0, pkX - 2), H - 9, 3, 9);
              }

              const now = performance.now();
              if (now - mm.lastUi > 90) {
                mm.lastUi = now;
                setMicDb(Math.round(db));
                setMicPeakDb(Math.round(mm.peak));
              }
              mm.raf = requestAnimationFrame(draw);
            };
            m.raf = requestAnimationFrame(draw);
          } catch (err) {
            stopMicTest();
            setMicState("error");
            const name = err?.name || "";
            setMicMsg(
              name === "NotAllowedError" || name === "SecurityError"
                ? "Microphone access was blocked. Allow it in the address bar — inside an embed the page also needs microphone permission (allow=\"microphone\")."
                : name === "NotFoundError" || name === "OverconstrainedError"
                  ? "No matching microphone found. Connect the DualSense by USB (Bluetooth doesn't expose its mic to PCs) and try again."
                  : `Couldn't start the mic: ${err?.message || name || "unknown error"}`
            );
          }
        };

        const toggleMicMonitor = () => {
          const m = micRef.current;
          if (!m.gain || !m.ctx) return;
          const next = !micMonitor;
          m.gain.gain.setTargetAtTime(next ? 1 : 0, m.ctx.currentTime, 0.02);
          setMicMonitor(next);
          setMicMsg(next ? "Loopback ON — you'll hear the controller's mic through your speakers. Use headphones to avoid feedback." : "Loopback off.");
        };

        const recordMicClip = () => {
          const m = micRef.current;
          if (!m.stream || typeof MediaRecorder === "undefined") {
            setMicMsg("Recording isn't available in this browser.");
            return;
          }
          try {
            const chunks = [];
            const rec = new MediaRecorder(m.stream);
            m.recorder = rec;
            rec.ondataavailable = e => { if (e.data?.size) chunks.push(e.data); };
            rec.onstop = () => {
              const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });

          buf.set(prefixBytes, 0);

            setCalMsg("Range Calibration Active: Slowly rotate BOTH sticks 2–3 full circles clockwise & counter-clockwise, then click Finish Range.");

          let dev = hidDeviceRef.current;
          if (!dev || !dev.opened) {
            dev = await connectDualSenseHid();
            if (!dev) return false;
          }

          const payload = new Uint8Array(47);
          payload[0] = 0x03 | 0x04 | 0x08;
          payload[1] = 0x00;

          payload[3] = Math.max(0, Math.min(255, Math.round(leftMotor)));

          payload[11] = r2Params[0] || 0;
          payload[12] = r2Params[1] || 0;
          payload[13] = r2Params[2] || 0;

          payload[22] = l2Params[0] || 0;
          payload[23] = l2Params[1] || 0;
          payload[24] = l2Params[2] || 0;
