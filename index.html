                  <div className="lg-tile">
                    <small>Linked Stock</small>
                    <b>{linkedDevices.length} card{linkedDevices.length === 1 ? "" : "s"}</b>
                  </div>
                </div>

                <div className="receipt-box">
                  <small>Sourcing &amp; Order Metadata</small>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(180px,1fr))", gap: 10, marginTop: 6, fontSize: 12.5 }}>
                    <div>
                      <span style={{ color: "var(--mu)" }}>Seller:</span>{" "}
                      <strong>{exp.seller || "Unassigned / Direct"}</strong>
                    </div>
                    <div>
                      <span style={{ color: "var(--mu)" }}>Platform:</span>{" "}
                      <strong>{exp.platform || "Not specified"}</strong>
                    </div>
                    <div>
                      <span style={{ color: "var(--mu)" }}>External Order ID:</span>{" "}
                      <strong style={{ fontFamily: "'JetBrains Mono', monospace" }}>{exp.extOrderId || "None"}</strong>
                    </div>
                    <div>
                      <span style={{ color: "var(--mu)" }}>Purchase Date:</span>{" "}
                      <strong style={{ fontFamily: "'JetBrains Mono', monospace" }}>{fmtDate(exp.date)}</strong>
                    </div>
                  </div>
                  {exp.link && (
                    <div style={{ marginTop: 10, paddingTop: 10, borderTop: "1px solid var(--line)" }}>
                      <a href={exp.link} target="_blank" rel="noopener noreferrer" className="exp-link-btn">
                        <Icon name="link" size={12} /> Open External Listing / Order Link
                      </a>
                    </div>
                  )}
                </div>

                <div className="form-section" style={{ paddingTop: 4, borderTop: "none" }}>
                  <div className="form-section-head">
                    <span className="form-section-title">Linked Stock Device Cards ({linkedDevices.length})</span>
                    {linkedDevices.length > 0 && (
                      <span className={`chip ${estNetProfit >= 0 ? "Completed" : "Pending"}`}>
                        Est. Resale: {fmtMoney(estResaleSum, cur)} ({estNetProfit >= 0 ? "+" : ""}{fmtMoney(estNetProfit, cur)} est. net)
                      </span>
                    )}
                  </div>

                  {linkedDevices.length === 0 ? (
                    <p className="note" style={{ marginTop: 0 }}>
                      No stock device cards are currently linked to this order. Click <strong>Edit Order</strong> to auto-create stock cards.
                    </p>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {linkedDevices.map((dev, idx) => {
                        const unitCost = (Number(dev.deviceCost) || 0) + (Number(dev.partsCost) || 0);
                        const askPrice = dev.status === "Sold"
                          ? (Number(dev.sold) || Number(dev.price) || 0)
                          : (Number(dev.price) || Number(dev.predicted) || 0);
                        const stCls = (dev.status || "In Stock").replace(/\s+/g, "");
                        return (
                          <div key={dev.id || idx} className="seller-order-subcard" style={{ padding: "11px 14px" }}>
                            <div>
                              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                                <strong style={{ fontSize: 13.5 }}>{dev.name}</strong>
                                <span className={`pill ${stCls}`} style={{ padding: "2px 9px", fontSize: 10 }}>{dev.status || "In Stock"}</span>
                                {dev.orderBatchLabel && <span className="tg" style={{ margin: 0 }}>{dev.orderBatchLabel}</span>}
                              </div>
                              <small style={{ color: "var(--mu)", fontFamily: "'JetBrains Mono', monospace", fontSize: 11, marginTop: 3 }}>
                                Cost: {fmtMoney(unitCost, cur)} (Dev {fmtMoney(dev.deviceCost, cur)} + Parts {fmtMoney(dev.partsCost, cur)}) · {dev.status === "Sold" ? "Sold" : "Target"}: {fmtMoney(askPrice, cur)}
                              </small>
                            </div>
                            <button
                              type="button"
                              className="b"
                              style={{ padding: "6px 12px", fontSize: 11 }}
                              onClick={() => {
                                onClose();
                                onInspectLinkedStock(dev.name);
                              }}
                            >
                              <Icon name="box" size={12} /> View in Stock
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>

              <div className="dlg-footer">
                <button
                  type="button"
                  className="b red"
                  style={{ marginRight: "auto" }}
                  onClick={() => {
                    onClose();
                    onDeleteExpense(expIndex);
                  }}
                >
                  <Icon name="trash" size={14} /> Delete Order
                </button>
                <button type="button" className="b" onClick={onClose}>Close</button>
              </div>
            </div>
          </dialog>
        );
      };

      // =========================================================================
      // JOB CREATE / EDIT MODAL — INCLUDES IN-STOCK DEVICE SELECTOR & AUTO-FILL
      // =========================================================================
      const JobEditModal = ({ open, jobIndex, state, onClose, onSaveJob, onRequestDelete, onOpenInvoice }) => {
        const dlgRef = useRef(null);
        const isNew = jobIndex === null;
        const existingJob = !isNew && jobIndex !== null ? state.jobs[jobIndex] : null;
        const cur = state.settings.currency || "£";

        const [form, setForm] = useState({
          id: 1,
          date: todayIso(),
          customer: "",
          device: "",
          type: "Service",
          status: "Pending",
          deviceCost: 0,
          partsCost: 0,
          price: 0,
          notes: "",
          parts: [],
          hasWarranty: false,
          warrantyDuration: 3,
          warrantyUnit: "Months",
          linkedStockId: "",
          linkedStockName: ""
        });
        const [selPartIdx, setSelPartIdx] = useState("");
        const [partQty, setPartQty] = useState(1);
        const [pendingDeductions, setPendingDeductions] = useState([]);

        const selectableDevices = useMemo(() => {
          return state.stock
            .map((item, idx) => ({ ...item, _idx: idx }))
            .filter(item => {
              if (item.cat === "Parts") return false;
              const isCurrentlyLinked = existingJob?.linkedStockId && item.id === existingJob.linkedStockId;
              return item.status === "In Stock" || item.status === "Pending" || isCurrentlyLinked;
            });
        }, [state.stock, existingJob]);

        useEffect(() => {
          const el = dlgRef.current;
          if (!el) return;
          if (open) {
            setForm(
              existingJob
                ? {
                    ...existingJob,
                    parts: JSON.parse(JSON.stringify(existingJob.parts || [])),
                    hasWarranty: !!existingJob.hasWarranty,
                    warrantyDuration: existingJob.warrantyDuration || 3,
                    warrantyUnit: existingJob.warrantyUnit || "Months",
                    linkedStockId: existingJob.linkedStockId || "",
                    linkedStockName: existingJob.linkedStockName || ""
                  }
                : {
                    id: nextJobId(state.jobs),
                    date: todayIso(),
                    customer: "",
                    device: "",
                    type: "Service",
                    status: "Pending",
                    deviceCost: 0,
                    partsCost: 0,
                    price: 0,
                    notes: "",
                    parts: [],
                    hasWarranty: false,
                    warrantyDuration: 3,
                    warrantyUnit: "Months",
                    linkedStockId: "",
                    linkedStockName: ""
                  }
            );
            setSelPartIdx("");
            setPartQty(1);
            setPendingDeductions([]);
            if (!el.open) el.showModal();
          } else if (el.open) {
            el.close();
          }
        }, [open, jobIndex]);

        const handleSelectStockDevice = stockId => {
          if (!stockId) {
            setForm(prev => ({ ...prev, linkedStockId: "", linkedStockName: "" }));
            return;
          }
          const dev = state.stock.find(s => s.id === stockId);
          if (!dev) return;

          const devCost = Number(dev.deviceCost ?? 0);
          const ptsCost = Number(dev.partsCost ?? 0);
          const sellPrice = Number(dev.price ?? 0);

          setForm(prev => ({
            ...prev,
            linkedStockId: dev.id,
            linkedStockName: dev.name,
            device: dev.name,
            type: "Device",
            deviceCost: devCost,
            partsCost: ptsCost,
            price: sellPrice > 0 ? sellPrice : prev.price
          }));
        };

        const addPartToJob = () => {
          if (selPartIdx === "") return;
          const idx = Number(selPartIdx);
          const stItem = state.stock[idx];
          if (!stItem) return;
          const qty = Math.max(1, Number(partQty) || 1);
          const ref = { index_: stItem.index_ ?? idx, name: stItem.name, unitCost: Number(stItem.unitCost) || 0, qtyUsed: qty };
          setForm(prev => ({
            ...prev,
            parts: [...prev.parts, ref],
            partsCost: Number(((+prev.partsCost || 0) + Number(stItem.unitCost ?? 0) * qty).toFixed(2))
          }));
          setPendingDeductions(prev => [...prev, { partRef: ref, stockIdx: idx, qtyUsed: qty }]);
        };

        const removePartFromJob = idx => {
          const target = form.parts[idx];
          if (!target) return;
          const cost = (+target.unitCost || 0) * (+target.qtyUsed || 1);
          setForm(prev => ({
            ...prev,
            parts: prev.parts.filter((_, i) => i !== idx),
            partsCost: Number(Math.max(0, (+prev.partsCost || 0) - cost).toFixed(2))
          }));
          setPendingDeductions(prev => prev.filter(d => d.partRef !== target));
        };

        const linkedDeviceObj = form.linkedStockId ? state.stock.find(s => s.id === form.linkedStockId) : null;

        return (
          <dialog ref={dlgRef} className="dlg-shell dlg-wide" onCancel={e => { e.preventDefault(); onClose(); }}>
            <form
              className="dlg-form"
              onSubmit={e => {
                e.preventDefault();
                const warrData = {
                  hasWarranty: !!form.hasWarranty,
                  warrantyDuration: form.hasWarranty ? Math.max(1, Number(form.warrantyDuration) || 1) : 0,
                  warrantyUnit: (form.hasWarranty && form.warrantyUnit) || "Months"
                };
                onSaveJob(
                  {
                    ...form,
                    ...warrData,
                    deviceCost: Number(form.deviceCost) || 0,
                    partsCost: Number(form.partsCost) || 0,
                    price: Number(form.price) || 0,
                    linkedStockId: form.linkedStockId || "",
                    linkedStockName: linkedDeviceObj ? linkedDeviceObj.name : (form.linkedStockName || "")
                  },
                  jobIndex,
                  pendingDeductions.map(d => ({ stockIdx: d.stockIdx, qtyUsed: d.qtyUsed }))
                );
              }}
            >
              <div className="dlg-header">
                <div>
                  <h3>{isNew ? "Log New Job" : `Edit Job #${form.id}`}</h3>
                  <p className="dlg-subtitle">
                    {isNew ? "Create a workshop ticket, link a stock device, & auto-fill details" : `${form.customer || "Workshop ticket"} · Logged ${fmtDate(form.date)}`}
                  </p>
                </div>
                <button type="button" className="ib" title="Close" onClick={onClose}><Icon name="x" size={15} /></button>
              </div>

              <div className="dlg-body">
                <div className="form-section">
                  <div className="form-section-head">
                    <span className="form-section-title">1 · Client &amp; Hardware</span>
                  </div>

                  <div className="form-grid-2">
                    <label>
                      Job category
                      <div className="seg" style={{ marginTop: 6 }}>
                        {["Service", "Device", "Exchange", "Other"].map(t => (
                          <button
                            key={t}
                            type="button"
                            className={form.type === t ? "on" : ""}
                            onClick={() =>
                              setForm(prev => ({
                                ...prev,
                                type: t,
                                ...(t !== "Device" ? { linkedStockId: "", linkedStockName: "" } : {})
                              }))
                            }
                          >
                            {t}
                          </button>
                        ))}
                      </div>
                    </label>
                    <label>
                      Current job status
                      <div className="seg" style={{ marginTop: 6 }}>
                        {["Pending", "In Progress", "Completed", "Cancelled"].map(st => (
                          <button key={st} type="button" className={form.status === st ? "on" : ""} onClick={() => setForm({ ...form, status: st })}>
                            {st}
                          </button>
                        ))}
                      </div>
                    </label>
                  </div>

                  {form.type === "Device" && (
                    <div className="link-callout">
                      <div className="link-callout-head">
                        <span className="link-callout-title">
                          <Icon name="link" size={13} /> Link Device From Stock (Optional)
                        </span>
                        {linkedDeviceObj && (
                          <span className="linked-pill">
                            <Icon name="check" size={11} /> Linked · Auto-filled
                          </span>
                        )}
                      </div>
                      <select
                        value={form.linkedStockId || ""}
                        onChange={e => handleSelectStockDevice(e.target.value)}
                        style={{ marginTop: 0 }}
                      >
                        <option value="">-- Custom / Unlisted Device (Not from Stock) --</option>
                        {selectableDevices.map(dev => (
                          <option key={dev.id} value={dev.id}>
                            {dev.name} {dev.seller ? `(${dev.seller})` : ""} [{dev.status}] — Cost: {fmtMoney((+dev.deviceCost || 0) + (+dev.partsCost || 0), cur)} · Ask: {fmtMoney(dev.price, cur)}
                          </option>
                        ))}
                      </select>
                      <small style={{ color: "var(--mu)", fontSize: 11 }}>
                        {linkedDeviceObj
                          ? `Linked to "${linkedDeviceObj.name}". Saving this job will automatically update this stock device's status (${form.status === "Completed" ? "Sold" : form.status === "Cancelled" ? "In Stock" : "Pending"}) and record its costs & sale price.`
                          : selectableDevices.length > 0
                            ? "Pick an In-Stock device to automatically fill device name, device cost, parts cost, and asking price."
                            : "No devices currently marked 'In Stock' in your inventory."}
                      </small>
                    </div>
                  )}

                  <div className="form-grid-2">
                    <label>
                      Date
                      <input type="date" value={form.date} onChange={e => setForm({ ...form, date: e.target.value })} />
                    </label>
                    <label>
                      Customer name
                      <input type="text" placeholder="Customer full name" value={form.customer} onChange={e => setForm({ ...form, customer: e.target.value })} />
                    </label>
                  </div>

                  <label>
                    Device / fault
                    <input
                      type="text"
                      placeholder="e.g. DualSense Edge – Left stick drift + TMR swap"
                      value={form.device}
                      onChange={e => setForm({ ...form, device: e.target.value })}
                    />
                  </label>
                </div>

                <div className="form-section">
                  <div className="form-section-head">
                    <span className="form-section-title">2 · Warranty &amp; Stock Parts</span>
                  </div>
                  <label>
                    Warranty coverage
                    <div style={{ marginTop: 6 }}>
                      <div className="seg">
                        <button type="button" className={form.hasWarranty ? "" : "on"} onClick={() => setForm({ ...form, hasWarranty: false })}>No Warranty</button>
                        <button type="button" className={form.hasWarranty ? "on" : ""} onClick={() => setForm({ ...form, hasWarranty: true })}>Includes Warranty</button>
                      </div>
                      {form.hasWarranty && (
                        <div style={{ display: "flex", gap: 8, marginTop: 8, alignItems: "center" }}>
                          <input
                            type="number"
                            min={1}
                            step={1}
                            value={form.warrantyDuration ?? 3}
                            onChange={e => setForm({ ...form, warrantyDuration: Number(e.target.value) })}
                            style={{ width: 95, marginTop: 0 }}
                            placeholder="Length"
                          />
                          <select
                            value={form.warrantyUnit || "Months"}
                            onChange={e => setForm({ ...form, warrantyUnit: e.target.value })}
                            style={{ flex: 1, marginTop: 0 }}
                          >
                            {["Days", "Weeks", "Months", "Years"].map(u => <option key={u} value={u}>{u}</option>)}
                          </select>
                        </div>
                      )}
                    </div>
                  </label>

                  <label>
                    Linked parts from stock
                    <div className="prow">
                      <select value={selPartIdx} onChange={e => setSelPartIdx(e.target.value)}>
                        <option value="">-- Select Stocked Part --</option>
                        {state.stock.map((stItem, idx) =>
                          stItem.cat === "Parts" ? (
                            <option key={stItem.id || idx} value={idx}>
                              {stItem.name} ({stItem.qty} left)
                            </option>
                          ) : null
                        )}
                      </select>
                      <input type="number" min={1} value={partQty} onChange={e => setPartQty(Number(e.target.value))} />
                      <button type="button" className="b pri sq" title="Add Part" onClick={addPartToJob}><Icon name="plus" size={14} /></button>
                    </div>
                    <div className="chips" style={{ marginTop: 8 }}>
                      {form.parts.length === 0 ? (
                        <small style={{ color: "var(--mu)", fontSize: 11, textTransform: "none", letterSpacing: 0 }}>No parts linked to this job.</small>
                      ) : form.parts.map((p, idx) => (
                        <span key={idx} className="chip" style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "4px 10px" }}>
                          <Icon name="box" size={12} /> {p.name} ×{p.qtyUsed} ({fmtMoney((+p.unitCost || 0) * p.qtyUsed, cur)})
                          <button
                            type="button"
                            style={{ background: "none", border: "none", color: "var(--red)", cursor: "pointer", padding: 0, display: "flex", alignItems: "center", marginLeft: 4 }}
                            title="Remove part from job"
                            onClick={() => removePartFromJob(idx)}
                          >
                            <Icon name="trash" size={12} />
                          </button>
                        </span>
                      ))}
                    </div>
                  </label>
                </div>

                <div className="form-section">
                  <div className="form-section-head">
                    <span className="form-section-title">3 · Financials</span>
                  </div>
                  <div className="form-grid-3">
                    <label>
                      Device cost
                      <div className="mny"><span>{cur}</span><input type="number" step="0.01" value={form.deviceCost} onChange={e => setForm({ ...form, deviceCost: Number(e.target.value) })} /></div>
                    </label>
                    <label>
                      Parts cost
                      <div className="mny"><span>{cur}</span><input type="number" step="0.01" value={form.partsCost} onChange={e => setForm({ ...form, partsCost: Number(e.target.value) })} /></div>
                    </label>
                    <label>
                      Final charged
                      <div className="mny"><span>{cur}</span><input type="number" step="0.01" value={form.price} onChange={e => setForm({ ...form, price: Number(e.target.value) })} /></div>
                    </label>
                  </div>
                </div>

                <div className="form-section">
                  <div className="form-section-head">
                    <span className="form-section-title">4 · Notes &amp; Telemetry</span>
                  </div>
                  <label>
                    Job notes
                    <textarea rows={3} placeholder="Supports **bold** highlight syntax for key diagnostics" value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} />
                  </label>
                  {!isNew && existingJob && <JobTelemetryDetails job={existingJob} state={state} onOpenInvoice={onOpenInvoice} />}
                </div>
              </div>

              <div className="dlg-footer">
                {!isNew && jobIndex !== null && (
                  <button type="button" className="b red" style={{ marginRight: "auto" }} onClick={() => onRequestDelete(jobIndex)}>
                    <Icon name="trash" size={14} /> Delete
                  </button>
                )}
                <button type="button" className="b" onClick={onClose}>Cancel</button>
                <button type="submit" className="b pri"><Icon name="check" size={14} /> Save Changes</button>
              </div>
            </form>
          </dialog>
        );
      };

      // Stock Item Type Picker Modal
      const StockPickerModal = ({ open, onClose, onPickPart, onPickDevice, onPickDelivery }) => {
        const dlgRef = useRef(null);
        useEffect(() => {
          const el = dlgRef.current;
          if (!el) return;
          if (open) { if (!el.open) el.showModal(); }
          else if (el.open) el.close();
        }, [open]);

        return (
          <dialog ref={dlgRef} className="dlg-shell" onCancel={e => { e.preventDefault(); onClose(); }}>
            <div className="dlg-form">
              <div className="dlg-header">
                <div>
                  <h3>Add Stock Item</h3>
                  <p className="dlg-subtitle">Select an inventory workflow to log</p>
                </div>
                <button type="button" className="ib" title="Close" onClick={onClose}><Icon name="x" size={15} /></button>
              </div>
              <div className="dlg-body">
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "center" }}>
                  <button type="button" className="b pri" style={{ flex: "1 1 150px", justifyContent: "center", minHeight: 46 }} onClick={onPickPart}>
                    <Icon name="box" size={15} /> + Part
                  </button>
                  <button type="button" className="b pri" style={{ flex: "1 1 150px", justifyContent: "center", minHeight: 46 }} onClick={onPickDevice}>
                    <Icon name="wrench" size={15} /> + Device (In Stock)
                  </button>
                  <button type="button" className="b deliv-btn" style={{ flex: "1 1 180px", justifyContent: "center", minHeight: 46 }} onClick={onPickDelivery}>
                    <Icon name="truck" size={15} /> + Awaiting Delivery
                  </button>
                </div>
              </div>
              <div className="dlg-footer">
                <button type="button" className="b" onClick={onClose}>Cancel</button>
              </div>
            </div>
          </dialog>
        );
      };

      // Entity Add/Edit Modal (with Auto-Split Stock Creation for Device Expenses & Auto-Formatting for Diary/QA Logs)
      const EntityEditModal = ({ kind, editIndex, presetCat, state, onClose, onSaveEntity, onRequestDelete }) => {
        const dlgRef = useRef(null);
        const [form, setForm] = useState({});
        const [autoCreateStock, setAutoCreateStock] = useState(true);
        const [stockInitStatus, setStockInitStatus] = useState("In Stock");
        const [stockPartsCost, setStockPartsCost] = useState(0);
        const [stockEstPrice, setStockEstPrice] = useState(35);
        const cur = state.settings.currency || "£";
        const formRef = useRef({});
        formRef.current = form;
        const splitOptsRef = useRef({});
        splitOptsRef.current = { autoCreateStock, stockInitStatus, stockPartsCost, stockEstPrice };

        const sortedExpenses = useMemo(() => {
          return sortByDate(state.expenses || [], state.settings.sortOrder || "date-desc");
        }, [state.expenses, state.settings.sortOrder]);

        const deviceCategoryExpenses = useMemo(() => {
          return sortedExpenses.filter(e => (e.cat || "").trim() === "Device");
        }, [sortedExpenses]);

        const partsCategoryExpenses = useMemo(() => {
          return sortedExpenses.filter(e => (e.cat || "").trim() === "Parts");
        }, [sortedExpenses]);

        const knownSellers = useMemo(() => {
          const set = new Set();
          state.expenses.forEach(e => { if (e.seller) set.add(e.seller.trim()); });
          state.stock.forEach(s => { if (s.seller) set.add(s.seller.trim()); });
          return Array.from(set).sort();
        }, [state.expenses, state.stock]);

        useEffect(() => {
          const el = dlgRef.current;
          if (!el) return;
          if (!kind) {
            if (el.open) el.close();
            return;
          }
          const isNew = editIndex === null;
          if (kind === "exp") {
            const defaultCat = presetCat || "Parts";
            const existingExp = isNew ? null : state.expenses[editIndex];
            const alreadyLinkedCount = existingExp?.id
              ? state.stock.filter(s => s.cat !== "Parts" && s.linkedExpenseId === existingExp.id).length
              : 0;
            const initialForm = isNew
              ? {
                  id: `exp-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  date: todayIso(),
                  name: "",
                  cat: defaultCat,
                  amount: 0,
                  link: "",
                  seller: "",
                  platform: defaultCat === "Device" ? "Facebook Marketplace" : "",
                  extOrderId: "",
                  unitQty: 1
                }
              : {
                  id: existingExp.id || `exp-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  seller: "",
                  platform: "",
                  extOrderId: "",
                  unitQty: 1,
                  ...existingExp
                };
            setForm(initialForm);
            formRef.current = initialForm;
            const shouldSplit = isNew ? defaultCat === "Device" : ((existingExp?.cat || "") === "Device" && alreadyLinkedCount === 0);
            setAutoCreateStock(shouldSplit);
            setStockInitStatus("In Stock");
            setStockPartsCost(0);
            setStockEstPrice(35);
            splitOptsRef.current = { autoCreateStock: shouldSplit, stockInitStatus: "In Stock", stockPartsCost: 0, stockEstPrice: 35 };
          } else if (kind === "diary") {
            setForm(isNew ? { job: 0, title: "", date: todayIso(), text: "", scheduled: "", link: "", webLink: "" } : { title: "", webLink: "", ...state.diary[editIndex] });
          } else if (kind === "tests") {
            setForm(isNew ? { job: state.jobs.at(-1)?.id || 0, date: todayIso(), name: "", result: "Passed", notes: "", drive: "" } : { ...state.tests[editIndex] });
          } else if (kind === "stock-part") {
            setForm(isNew ? { id: `stk-${Date.now()}`, date: todayIso(), name: "", cat: "Parts", unitCost: 0, qty: 0, bought: 0, low: 5, link: "", linkedExpenseId: "" } : { linkedExpenseId: "", ...state.stock[editIndex] });
          } else if (kind === "stock-device" || kind === "stock-delivery") {
            const defStatus = kind === "stock-delivery" ? "Awaiting Delivery" : "In Stock";
            setForm(
              isNew
                ? { id: `stk-${Date.now()}`, date: todayIso(), name: "", cat: "Device", deviceCost: 0, partsCost: 0, price: 0, sold: 0, status: defStatus, eta: "", link: "", linkedExpenseId: "", seller: "", platform: "", extOrderId: "", orderBatchLabel: "" }
                : { status: "In Stock", eta: "", linkedExpenseId: "", seller: "", platform: "", extOrderId: "", orderBatchLabel: "", ...state.stock[editIndex] }
            );
          }
          if (!el.open) el.showModal();
        }, [kind, editIndex, presetCat]);

        if (!kind) return <dialog ref={dlgRef} className="dlg-shell dlg-wide" />;

        const isNew = editIndex === null;
        const titles = {
          exp: "Expense",
          diary: "Diary Entry",
          tests: "Test Log",
          "stock-part": "Stocked Part",
          "stock-device": "Stocked Device",
          "stock-delivery": "Inbound Device (Awaiting Delivery)"
        };
        const delKind = kind === "stock-part" || kind === "stock-device" || kind === "stock-delivery" ? "stock" : kind;
        const isDevice = kind === "stock-device" || kind === "stock-delivery";
        const isPart = kind === "stock-part";

        const handleSelectDeviceExpense = expId => {
          if (!expId) {
            setForm(prev => ({ ...prev, linkedExpenseId: "" }));
            return;
          }
          const exp = deviceCategoryExpenses.find(e => e.id === expId);
          if (!exp) return;

          const existingLinkedCount = state.stock.filter(
            (s, idx) => idx !== editIndex && s.cat !== "Parts" && s.linkedExpenseId === expId
          ).length;
          const denom = Math.max(existingLinkedCount + 1, Number(exp.unitQty) || 1);
          const splitCost = Number(((+exp.amount || 0) / denom).toFixed(2));

          setForm(prev => ({
            ...prev,
            linkedExpenseId: exp.id,
            deviceCost: splitCost,
            link: prev.link || exp.link || "",
            seller: prev.seller || exp.seller || "",
            platform: prev.platform || exp.platform || "",
            extOrderId: prev.extOrderId || exp.extOrderId || ""
          }));
        };

        const handleSelectPartExpense = expId => {
          if (!expId) {
            setForm(prev => ({ ...prev, linkedExpenseId: "" }));
            return;
          }
          const exp = partsCategoryExpenses.find(e => e.id === expId);
          if (!exp) return;

          const qtyBasis = Number(form.bought) || Number(form.qty) || 1;
          const computedUnitCost = Number(((+exp.amount || 0) / Math.max(1, qtyBasis)).toFixed(2));

          setForm(prev => ({
            ...prev,
            linkedExpenseId: exp.id,
            unitCost: computedUnitCost,
            link: prev.link || exp.link || ""
          }));
        };

        const linkedExpObj = (isDevice || isPart) && form.linkedExpenseId
          ? state.expenses.find(e => e.id === form.linkedExpenseId)
          : null;

        const expUnitQty = Math.max(1, Number(form.unitQty) || 1);
        const perUnitDeviceCost = Number(((Number(form.amount) || 0) / expUnitQty).toFixed(2));
        const existingLinkedCardsCount = !isNew && form.id
          ? state.stock.filter(s => s.cat !== "Parts" && s.linkedExpenseId === form.id).length
          : 0;
        const canCreateStockCards = kind === "exp" && (form.cat || "").trim() === "Device" && (isNew || existingLinkedCardsCount === 0);

        const handleFormSubmit = e => {
          if (e && typeof e.preventDefault === "function") e.preventDefault();
          const currentForm = formRef.current || form;
          const currentSplit = splitOptsRef.current || { autoCreateStock, stockInitStatus, stockPartsCost, stockEstPrice };
          const out = { ...currentForm };
          let extraOptions = null;

          if (kind === "exp") {
            const normalizedCat = (out.cat || presetCat || "Parts").trim();
            out.cat = normalizedCat;
            out.id = out.id || `exp-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
            out.amount = Number(out.amount) || 0;
            out.seller = (out.seller || "").trim();
            out.platform = (out.platform || "").trim();
            out.extOrderId = (out.extOrderId || "").trim();
            out.unitQty = Math.max(1, Number(out.unitQty) || 1);

            const linkedCountNow = !isNew && out.id
              ? state.stock.filter(s => s.cat !== "Parts" && s.linkedExpenseId === out.id).length
              : 0;
            const eligibleForStock = normalizedCat === "Device" && (isNew || linkedCountNow === 0);

            if (eligibleForStock && currentSplit.autoCreateStock) {
              extraOptions = {
                autoSplitStock: true,
                stockInitStatus: currentSplit.stockInitStatus || "In Stock",
                stockPartsCost: Number(currentSplit.stockPartsCost) || 0,
                stockEstPrice: Number(currentSplit.stockEstPrice) || 35
              };
            }
          } else if (kind === "diary") {
            out.job = Number(out.job) || 0;
            out.title = autoFormatInlineTitle(out.title || "");
            out.text = autoFormatLogText(out.text || "");
            out.webLink = (out.webLink || "").trim();
            out.link = (out.link || "").trim();
          } else if (kind === "tests") {
            out.job = Number(out.job) || 0;
            out.name = autoFormatInlineTitle(out.name || "");
            out.notes = autoFormatLogText(out.notes || "");
            out.drive = (out.drive || "").trim();
          } else if (kind === "stock-part") {
            out.id = out.id || `stk-${Date.now()}`;
            out.cat = "Parts";
            out.unitCost = Number(out.unitCost) || 0;
            out.qty = Number(out.qty) || 0;
            out.bought = Number(out.bought) || 0;
            out.low = Number(out.low) || 0;
            out.linkedExpenseId = out.linkedExpenseId || "";
          } else if (isDevice) {
            out.id = out.id || `stk-${Date.now()}`;
            out.cat = "Device";
            out.deviceCost = Number(out.deviceCost) || 0;
            out.partsCost = Number(out.partsCost) || 0;
            out.price = Number(out.price) || 0;
            out.sold = Number(out.sold) || 0;
            out.status = out.status || "In Stock";
            out.eta = (out.eta || "").trim();
            out.linkedExpenseId = out.linkedExpenseId || "";
            out.seller = (out.seller || "").trim();
            out.platform = (out.platform || "").trim();
            out.extOrderId = (out.extOrderId || "").trim();
            out.orderBatchLabel = (out.orderBatchLabel || "").trim();
          }
          onSaveEntity(kind, out, editIndex, extraOptions);
        };

        return (
          <dialog ref={dlgRef} className="dlg-shell dlg-wide" onCancel={e => { e.preventDefault(); onClose(); }}>
            <form
              className="dlg-form"
              onSubmit={handleFormSubmit}
            >
              <div className="dlg-header">
                <div>
                  <h3>{(isNew ? "Add " : "Edit ") + titles[kind]}</h3>
                  <p className="dlg-subtitle">
                    {isDevice
                      ? "Link to a Device Expense, track seller/order metadata, & resale unit economics"
                      : kind === "diary"
                        ? "Link to a workshop ticket or save as a standalone general note"
                        : "Changes sync automatically to local storage & Firebase"}
                  </p>
                </div>
                <button type="button" className="ib" title="Close" onClick={onClose}><Icon name="x" size={15} /></button>
              </div>

              <div className="dlg-body">
                {kind === "exp" && (
                  <Fragment>
                    <div className="form-section">
                      <span className="form-section-title">1 · Expense Classification</span>
                      <label>
                        Item description
                        <input
                          type="text"
                          placeholder="e.g. 2x DualSense Controllers - Stick Drift"
                          value={form.name || ""}
                          onChange={e => setForm({ ...form, name: e.target.value })}
                        />
                      </label>
                      <div className="form-grid-2">
                        <label>Date<input type="date" value={form.date || ""} onChange={e => setForm({ ...form, date: e.target.value })} /></label>
                        <label>
                          Category
                          <select
                            value={form.cat || "Parts"}
                            onChange={e => {
                              const nextCat = e.target.value;
                              setForm({ ...form, cat: nextCat });
                              if (isNew && nextCat === "Device") setAutoCreateStock(true);
                            }}
                          >
                            {["Parts", "Equipment", "Device", "General"].map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </label>
                      </div>
                    </div>

                    {form.cat === "Device" && (
                      <div className="form-section">
                        <span className="form-section-title">2 · Seller &amp; External Order Details</span>
                        <div className="form-grid-2">
                          <label>
                            Seller Name
                            <input
                              type="text"
                              list="known-sellers-list"
                              placeholder="e.g. Caleb, Dion, eBay Seller"
                              value={form.seller || ""}
                              onChange={e => setForm({ ...form, seller: e.target.value })}
                            />
                            <datalist id="known-sellers-list">
                              {knownSellers.map(s => <option key={s} value={s} />)}
                            </datalist>
                          </label>
                          <label>
                            Platform / Source
                            <select
                              value={form.platform || ""}
                              onChange={e => setForm({ ...form, platform: e.target.value })}
                            >
                              <option value="">-- Select Platform --</option>
                              {["Facebook Marketplace", "eBay", "Vinted", "CeX", "Gumtree", "Local / Cash", "AliExpress", "Other"].map(pl => (
                                <option key={pl} value={pl}>{pl}</option>
                              ))}
                            </select>
                          </label>
                        </div>
                        <div className="form-grid-2">
                          <label>
                            External Site Order ID
                            <input
                              type="text"
                              placeholder="e.g. 12-34567-89012 or Messenger Thread ID"
                              value={form.extOrderId || ""}
                              onChange={e => setForm({ ...form, extOrderId: e.target.value })}
                            />
                          </label>
                          <label>
                            Device Quantity (Units in Order)
                            <input
                              type="number"
                              min={1}
                              max={50}
                              step={1}
                              value={form.unitQty ?? 1}
                              onChange={e => setForm({ ...form, unitQty: Math.max(1, Number(e.target.value) || 1) })}
                            />
                          </label>
                        </div>
                      </div>
                    )}

                    <div className="form-section">
                      <span className="form-section-title">{form.cat === "Device" ? "3 · Amount & Order Link" : "2 · Amount & Order Link"}</span>
                      <div className="form-grid-2">
                        <label>
                          Total Order Amount
                          <div className="mny">
                            <span>{cur}</span>
                            <input type="number" step="any" value={form.amount ?? 0} onChange={e => setForm({ ...form, amount: e.target.value })} />
                          </div>
                        </label>
                        <label>
                          Receipt / supplier link
                          <input type="text" placeholder="https://…" value={form.link || ""} onChange={e => setForm({ ...form, link: e.target.value })} />
                        </label>
                      </div>
                      {form.cat !== "Device" && (
                        <div className="form-grid-2">
                          <label>
                            Supplier / Seller (Optional)
                            <input type="text" placeholder="e.g. AliExpress Store" value={form.seller || ""} onChange={e => setForm({ ...form, seller: e.target.value })} />
                          </label>
                          <label>
                            External Order ID (Optional)
                            <input type="text" placeholder="Order #" value={form.extOrderId || ""} onChange={e => setForm({ ...form, extOrderId: e.target.value })} />
                          </label>
                        </div>
                      )}
                    </div>

                    {canCreateStockCards && (
                      <div className="form-section">
                        <div className="link-callout">
                          <div className="link-callout-head">
                            <span className="link-callout-title">
                              <Icon name="box" size={13} /> Auto-Create Individual Stock Device Cards
                            </span>
                            <span className="linked-pill">
                              {expUnitQty} × {fmtMoney(perUnitDeviceCost, cur)} / unit
                            </span>
                          </div>
                          <div className="seg">
                            <button type="button" className={autoCreateStock ? "on" : ""} onClick={() => setAutoCreateStock(true)}>
                              Yes · Split into {expUnitQty} Stock Card{expUnitQty === 1 ? "" : "s"}
                            </button>
                            <button type="button" className={!autoCreateStock ? "on" : ""} onClick={() => setAutoCreateStock(false)}>
                              No · Expense Only
                            </button>
                          </div>
                          {autoCreateStock && (
                            <div className="form-grid-3" style={{ marginTop: 4 }}>
                              <label>
                                Initial Stock Status
                                <select value={stockInitStatus} onChange={e => setStockInitStatus(e.target.value)}>
                                  <option value="In Stock">In Stock</option>
                                  <option value="Awaiting Delivery">Awaiting Delivery</option>
                                  <option value="Pending">Pending</option>
                                  <option value="Sold">Sold / Completed</option>
                                </select>
                              </label>
                              <label>
                                Parts Cost Each
                                <div className="mny">
                                  <span>{cur}</span>
                                  <input type="number" step="0.01" min="0" value={stockPartsCost} onChange={e => setStockPartsCost(e.target.value)} />
                                </div>
                              </label>
                              <label>
                                Est. Resale Price Each
                                <div className="mny">
                                  <span>{cur}</span>
                                  <input type="number" step="0.01" min="0" value={stockEstPrice} onChange={e => setStockEstPrice(e.target.value)} />
                                </div>
                              </label>
                            </div>
                          )}
                          <small style={{ color: "var(--mu)", fontSize: 11 }}>
                            {autoCreateStock
                              ? `Automatically creates ${expUnitQty} linked device card${expUnitQty === 1 ? "" : "s"} (${expUnitQty > 1 ? "Unit 1/" + expUnitQty + " … Unit " + expUnitQty + "/" + expUnitQty : "single unit"}) at ${fmtMoney(perUnitDeviceCost, cur)} device + ${fmtMoney(Number(stockPartsCost) || 0, cur)} parts each.`
                              : "You can still link stock devices manually later from the Stock tab."}
                          </small>
                        </div>
                      </div>
                    )}
                  </Fragment>
                )}

                {kind === "diary" && (
                  <Fragment>
                    <div className="form-section">
                      <span className="form-section-title">1 · Entry Context</span>
                      <div className="form-grid-2">
                        <label>
                          Linked job (optional)
                          <select value={String(form.job ?? 0)} onChange={e => setForm({ ...form, job: Number(e.target.value) })}>
                            <option value="0">— No Linked Job (General Note) —</option>
                            {state.jobs.map(j => <option key={j.id} value={String(j.id)}>#{j.id} {j.customer} — {j.device}</option>)}
                          </select>
                        </label>
                        <label>Date<input type="date" value={form.date || ""} onChange={e => setForm({ ...form, date: e.target.value })} /></label>
                      </div>
                      <label>
                        Subject / Title (optional)
                        <input type="text" placeholder="e.g. AliExpress restock reminder, supplier note…" value={form.title || ""} onChange={e => setForm({ ...form, title: e.target.value })} />
                      </label>
                    </div>
                    <div className="form-section">
                      <span className="form-section-title">2 · Notes</span>
                      <label>Entry<textarea rows={4} placeholder="Write entry details…" value={form.text || ""} onChange={e => setForm({ ...form, text: e.target.value })} /></label>
                    </div>
                    <div className="form-section">
                      <span className="form-section-title">3 · Follow-up &amp; Attachments</span>
                      <div className="form-grid-2">
                        <label>Scheduled follow-up date<input type="date" value={form.scheduled || ""} onChange={e => setForm({ ...form, scheduled: e.target.value })} /></label>
                        <label>Web Link (Normal URL)<input type="text" placeholder="https://…" value={form.webLink || ""} onChange={e => setForm({ ...form, webLink: e.target.value })} /></label>
                      </div>
                      <label>Invoice / Document Link (PDF)<input type="text" placeholder="Google Drive or PDF URL" value={form.link || ""} onChange={e => setForm({ ...form, link: e.target.value })} /></label>
                    </div>
                  </Fragment>
                )}

                {kind === "tests" && (
                  <Fragment>
                    <div className="form-section">
                      <span className="form-section-title">1 · Hardware Test Setup</span>
                      <div className="form-grid-2">
                        <label>
                          Linked job
                          <select value={String(form.job ?? 0)} onChange={e => setForm({ ...form, job: Number(e.target.value) })}>
                            {state.jobs.map(j => <option key={j.id} value={String(j.id)}>#{j.id} {j.customer}</option>)}
                          </select>
                        </label>
                        <label>Date<input type="date" value={form.date || ""} onChange={e => setForm({ ...form, date: e.target.value })} /></label>
                      </div>
                      <div className="form-grid-2">
                        <label>What was tested<input type="text" placeholder="e.g. DualSense Circularity & Centering" value={form.name || ""} onChange={e => setForm({ ...form, name: e.target.value })} /></label>
                        <label>
                          Result
                          <select value={form.result || "Passed"} onChange={e => setForm({ ...form, result: e.target.value })}>
                            {["Passed", "Failed", "Partial"].map(r => <option key={r} value={r}>{r}</option>)}
                          </select>
                        </label>
                      </div>
                    </div>
                    <div className="form-section">
                      <span className="form-section-title">2 · Diagnostic Notes &amp; Media</span>
                      <label>Notes<textarea rows={3} value={form.notes || ""} onChange={e => setForm({ ...form, notes: e.target.value })} /></label>
                      <label>Drive / photo link<input type="text" placeholder="https://…" value={form.drive || ""} onChange={e => setForm({ ...form, drive: e.target.value })} /></label>
                    </div>
                  </Fragment>
                )}

                {kind === "stock-part" && (
                  <Fragment>
                    <div className="form-section">
                      <span className="form-section-title">1 · Component Details</span>
                      <div className="form-grid-2">
                        <label>Part name<input type="text" placeholder="e.g. Gulikit TMR Stick Pair" value={form.name || ""} onChange={e => setForm({ ...form, name: e.target.value })} /></label>
                        <label>Date<input type="date" value={form.date || ""} onChange={e => setForm({ ...form, date: e.target.value })} /></label>
                      </div>
                    </div>

                    <div className="form-section">
                      <span className="form-section-title">2 · Link to Parts Expense</span>
                      <div className="link-callout">
                        <div className="link-callout-head">
                          <span className="link-callout-title">
                            <Icon name="link" size={13} /> Parts Category Expense Link
                          </span>
                          {linkedExpObj && (
                            <span className="linked-pill">
                              <Icon name="check" size={11} /> Linked ({fmtMoney(linkedExpObj.amount, cur)})
                            </span>
                          )}
                        </div>
                        <select
                          value={form.linkedExpenseId || ""}
                          onChange={e => handleSelectPartExpense(e.target.value)}
                          style={{ marginTop: 0 }}
                        >
                          <option value="">-- Not Linked to Any Parts Expense --</option>
                          {partsCategoryExpenses.map(exp => (
                            <option key={exp.id} value={exp.id}>
                              {fmtDate(exp.date)} · {exp.name} ({fmtMoney(exp.amount, cur)})
                            </option>
                          ))}
                        </select>
                        <small style={{ color: "var(--mu)", fontSize: 11 }}>
                          {partsCategoryExpenses.length === 0
                            ? 'No expenses with the "Parts" category logged yet.'
                            : linkedExpObj
                              ? `Linked to "${linkedExpObj.name}" (${fmtMoney(linkedExpObj.amount, cur)}). Only "Parts" category expenses are listed.`
                              : 'Only expenses categorised as "Parts" are shown here.'}
                        </small>
                      </div>
                    </div>

                    <div className="form-section">
                      <span className="form-section-title">3 · Quantities &amp; Pricing</span>
                      <div className="form-grid-3">
                        <label>Unit cost<div className="mny"><span>{cur}</span><input type="number" step="any" value={form.unitCost ?? 0} onChange={e => setForm({ ...form, unitCost: e.target.value })} /></div></label>
                        <label>In stock<input type="number" step="any" value={form.qty ?? 0} onChange={e => setForm({ ...form, qty: e.target.value })} /></label>
                        <label>Total bought<input type="number" step="any" value={form.bought ?? 0} onChange={e => setForm({ ...form, bought: e.target.value })} /></label>
                      </div>
                      <div className="form-grid-2">
                        <label>Low-stock alert at<input type="number" step="any" value={form.low ?? 0} onChange={e => setForm({ ...form, low: e.target.value })} /></label>
                        <label>Supplier link<input type="text" placeholder="https://…" value={form.link || ""} onChange={e => setForm({ ...form, link: e.target.value })} /></label>
                      </div>
                    </div>
                  </Fragment>
                )}

                {isDevice && (
                  <Fragment>
                    <div className="form-section">
                      <span className="form-section-title">1 · Hardware &amp; Fulfillment Status</span>
                      <div className="form-grid-2">
                        <label>
                          Device
                          <input type="text" placeholder="e.g. Sony PS5 DualSense White" value={form.name || ""} onChange={e => setForm({ ...form, name: e.target.value })} />
                        </label>
                        <label>
                          Order / Stock Date
                          <input type="date" value={form.date || ""} onChange={e => setForm({ ...form, date: e.target.value })} />
                        </label>
                      </div>
                      <label>
                        Status
                        <div className="seg" style={{ marginTop: 6, flexWrap: "wrap" }}>
                          {["Awaiting Delivery", "In Stock", "Pending", "Sold"].map(st => (
                            <button
                              key={st}
                              type="button"
                              className={(form.status || "In Stock") === st ? "on" : ""}
                              onClick={() => setForm({ ...form, status: st })}
                            >
                              {st}
                            </button>
                          ))}
                        </div>
                      </label>
                    </div>

                    <div className="form-section">
                      <span className="form-section-title">2 · Link to Device Expense &amp; Seller</span>
                      <div className="link-callout">
                        <div className="link-callout-head">
                          <span className="link-callout-title">
                            <Icon name="link" size={13} /> Device Category Expense Link
                          </span>
                          {linkedExpObj && (
                            <span className="linked-pill">
                              <Icon name="check" size={11} /> Linked ({fmtMoney(linkedExpObj.amount, cur)})
                            </span>
                          )}
                        </div>
                        <select
                          value={form.linkedExpenseId || ""}
                          onChange={e => handleSelectDeviceExpense(e.target.value)}
                          style={{ marginTop: 0 }}
                        >
                          <option value="">-- Not Linked to Any Device Expense --</option>
                          {deviceCategoryExpenses.map(exp => (
                            <option key={exp.id} value={exp.id}>
                              {fmtDate(exp.date)} · {exp.name} {exp.seller ? `[${exp.seller}]` : ""} ({fmtMoney(exp.amount, cur)})
                            </option>
                          ))}
                        </select>
                        <small style={{ color: "var(--mu)", fontSize: 11 }}>
                          {deviceCategoryExpenses.length === 0
                            ? 'No expenses with the "Device" category logged yet.'
                            : linkedExpObj
                              ? `Linked to "${linkedExpObj.name}" (${fmtMoney(linkedExpObj.amount, cur)}). Seller, platform, order ID & per-unit cost auto-filled.`
                              : 'Only expenses categorised as "Device" are shown here.'}
                        </small>
                      </div>

                      <div className="form-grid-2">
                        <label>
                          Seller Name
                          <input
                            type="text"
                            list="known-sellers-stock"
                            placeholder="e.g. Caleb, Dion"
                            value={form.seller || ""}
                            onChange={e => setForm({ ...form, seller: e.target.value })}
                          />
                          <datalist id="known-sellers-stock">
                            {knownSellers.map(s => <option key={s} value={s} />)}
                          </datalist>
                        </label>

      // Prompt / Confirm Dialog
      const ConfirmPromptModal = ({ prompt, onClose }) => {
        const dlgRef = useRef(null);

        useEffect(() => {
          const el = dlgRef.current;
          if (!el) return;
          if (prompt) {
            setVal(prompt.initialValue == null ? "" : String(prompt.initialValue));
            if (!el.open) el.showModal();
          } else if (el.open) {
            el.close();
          }
        }, [prompt]);

        if (!prompt) return <dialog ref={dlgRef} className="dlg-shell" />;
        const hasInput = prompt.initialValue !== undefined && prompt.initialValue !== null;
        const inputType = prompt.inputType || "number";

        return (
          <dialog ref={dlgRef} className="dlg-shell" onCancel={e => { e.preventDefault(); onClose(); }}>
            <div className="dlg-form">
              <div className="dlg-header">
                <h3>{hasInput ? "Update Value" : "Confirm Action"}</h3>
